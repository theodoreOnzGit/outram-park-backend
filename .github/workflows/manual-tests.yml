# Manual test runner — dispatch-only, any branch, any scope.
#
# WHY THIS EXISTS (maintainer request, 2026-09-20). `fast-tests.yml` runs on
# `develop` with the long tier OFF, and `full-tests.yml` runs on `main` with it
# ON. Neither lets you say "run the FULL suite against develop, now" without
# pushing something. This one does: it has no push or pull_request trigger at
# all, so it only ever runs when a human asks, and the dispatch UI's branch
# selector chooses the ref.
#
# ── TWO WAYS TO START IT, AND WHY THERE ARE TWO ──────────────────────────────
#
# 1. `workflow_dispatch` -- the good one, with the inputs below and a branch
#    picker. REQUIRES THIS FILE ON THE DEFAULT BRANCH (`main`). GitHub exposes
#    `workflow_dispatch` only for workflows present there: a dispatch-only
#    workflow living solely on `develop` is invisible to both the UI and the
#    REST API. Measured 2026-09-20 -- `full-tests.yml` already carried
#    `workflow_dispatch:` and `POST /actions/workflows/full-tests.yml/dispatches`
#    still returned 404, and `GET /actions/workflows` listed only
#    `fast-tests.yml`. Once the file IS on `main` you can dispatch it against
#    any ref, and GitHub runs the copy FROM THAT REF, so later edits on
#    `develop` take effect without a second `main` push.
#
# 2. `push` to a `ci-run/**` branch -- the escape hatch that works TODAY, with
#    nothing on `main`. The default-branch rule covers `workflow_dispatch`,
#    `schedule` and `repository_dispatch`; it does NOT cover `push`, because a
#    push event runs the workflow file from the pushed ref itself. So:
#
#        git push -f origin develop:ci-run/develop
#
#    runs this full suite against develop's exact tree. Force-push is expected
#    and safe here: `ci-run/**` branches are disposable triggers, they are never
#    merged from, and nothing else reads them. Delete them whenever.
#
#    The cost of this path is that it takes no inputs -- a push carries no
#    parameters -- so it always runs the FULL scope over the whole workspace.
#    That is the common case anyway; use dispatch when you want to narrow it.
#
# ── Scope ────────────────────────────────────────────────────────────────────
#
# `full` runs the workspace HARD RULE command:
#     cargo test --workspace --lib --tests --release
# which includes every test gated behind the default-on `long-tests` feature.
# CHANGED 2026-11-10 (gh:#1337): it runs as one job per crate,
# `cargo test -p <crate> --lib --tests --release --no-fail-fast`, so that each
# crate has its own 6-hour limit (see `jobs:` below).
#
# `fast` runs the repo's own alias, ~~the same one `fast-tests.yml` uses~~
# (CORRECTED 2026-11-10: fast-tests.yml has run a compile gate plus a smoke
# set since 2026-09-29, not quick-test), per crate since gh:#1337:
#     cargo quick-test   ==   cargo test --release --lib --tests --no-default-features
# `--no-default-features` is Cargo's only lever for switching off a single
# default feature, so it also drops `kovan`'s `gui` and `petir`'s `transfer-fn`.
# Both test fine without, and dropping `gui` is desirable headless anyway.
#
# A green `fast` run means "nothing fast is broken", NEVER "the suite passes" --
# the same caveat `fast-tests.yml`'s own header carries.

name: manual tests

on:
  # See "TWO WAYS TO START IT" above. This one needs the file on `main`.
  workflow_dispatch:
    inputs:
      scope:
        description: "full = long tests ON (the real gate); fast = quick-test, long tests OFF"
        type: choice
        required: true
        default: full
        options:
          - full
          - fast
      crate:
        description: "Optional: restrict to one package (e.g. nee_soon). Blank = whole workspace."
        type: string
        required: false
        default: ""
      filter:
        description: "Optional: only tests whose name contains this substring."
        type: string
        required: false
        default: ""

  # The no-`main`-needed path. Push any tree to a `ci-run/**` branch and the
  # full suite runs against it. Deliberately NOT `develop` or `main`: this must
  # never fire on ordinary work, only when someone asks for it by pushing a
  # branch whose name says so.
  push:
    branches:
      - "ci-run/**"

# ~~env: CARGO_TERM_COLOR, CARGO_NET_RETRY, RUST_BACKTRACE,
# KOVAN_RUSTDOC_TOOLCHAIN~~ MOVED 2026-11-10 (gh:#1337) to per-crate-tests.yml:
# a called workflow does not see its caller's `env`.

concurrency:
  # Keyed on the ref so two people can run different branches at once, but a
  # second dispatch of the SAME branch queues rather than racing the first.
  # Never cancels: a deliberate manual run is not superseded noise.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ~~One job running `cargo test --workspace` (or `-p <crate>`) with
  # `timeout-minutes: 360`.~~ CHANGED 2026-11-10 (gh:#1337): one job PER CRATE,
  # from per-crate-tests.yml, because the whole workspace no longer fits in
  # GitHub's 6-hour job limit. The inputs work as before:
  #   scope   full: `cargo test -p <crate> --lib --tests --release --no-fail-fast`
  #           fast: the same plus `--no-default-features` (what `cargo
  #                 quick-test -p <crate>` runs, with --no-fail-fast added)
  #   crate   collapses the matrix to that one package (still split by test
  #           target if it is in ci/split-by-target.txt); blank = every member
  #   filter  passed to every test binary as a test-name substring, as before
  # `inputs.*` is empty on a push event, so a `ci-run/**` push runs the full
  # scope over every crate -- see the push trigger note.
  # ~~--no-fail-fast was not passed here~~ it is now, so one failing binary no
  # longer hides the rest of its crate (full-tests.yml, run 39549698983).
  tests:
    uses: ./.github/workflows/per-crate-tests.yml
    with:
      scope: ${{ inputs.scope || 'full' }}
      package: ${{ inputs.crate }}
      filter: ${{ inputs.filter }}
      cache-prefix: manual
