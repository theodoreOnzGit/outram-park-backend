# Disposable: the kovan desktop build and tests, plus `kovan-cli index --fresh`
# (rust-analyzer scip), on Windows, Linux and macOS. Chases the Windows
# 0xc00000fd / 0xc00000be failures (2026-10-22). Lives only on ci-scip/**.
name: kovan desktop + scip probe
on:
  push:
    branches: ["ci-scip/**"]
env:
  CARGO_TERM_COLOR: always
  KOVAN_PKG: knowledge-oriented-vv-analysis-for-nuclear-sciences-kovan
  # Maintainer direction, 2026-10-22: "let ci's pin the latest". The kovan
  # CI runs the latest stable toolchain and its rust-analyzer, overriding the
  # repository's rust-toolchain.toml pin (1.99.1, which has no rust-analyzer
  # component installed on a fresh runner).
  RUSTUP_TOOLCHAIN: stable
jobs:
  probe:
    name: probe / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false # one platform's failure must not hide the others'
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer
      - name: Toolchain and rust-analyzer versions
        shell: bash
        run: |
          rustup show active-toolchain
          rustc --version
          rustup which rust-analyzer
          rust-analyzer --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: scip-probe-${{ matrix.os }}
          cache-on-failure: true
      - name: Build the desktop app, the CLI and the TUI
        shell: bash
        run: cargo build --release -p "$KOVAN_PKG" --bin kovan --bin kovan-cli --bin kovan-tui
      - name: Test kovan, kovan-common and kovan-web
        id: tests
        continue-on-error: true
        shell: bash
        run: cargo test --release --no-fail-fast -p "$KOVAN_PKG" -p kovan-common -p kovan-web --lib --tests
      - name: Where rust-analyzer lives
        shell: bash
        run: ls -la "$(rustup which rust-analyzer)" "$(dirname "$(rustup which rust-analyzer)")" | head -40
      - name: kovan-cli index --fresh (the failing path)
        id: fresh
        continue-on-error: true
        shell: bash
        run: ./target/release/kovan-cli index --workspace . --fresh
      - name: Log of the kovan run
        if: always()
        shell: bash
        run: |
          ls -la target/kovan-scip || true
          if [ -f target/kovan-scip/rust-analyzer-bigstack.exe ]; then ./target/kovan-scip/rust-analyzer-bigstack.exe --version || echo "bigstack --version exit $?"; fi
          head -30 target/kovan-scip/rust-analyzer-scip.log || true
          echo ....
          tail -60 target/kovan-scip/rust-analyzer-scip.log || true
          cp target/kovan-scip/rust-analyzer-scip.log kovan-run.log || true
      - name: Control, plain rust-analyzer scip (expected to overflow on Windows only)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          rust-analyzer scip . --output control.scip > control.log 2>&1; echo "exit $?"
          tail -20 control.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scip-logs-${{ matrix.os }}
          path: |
            kovan-run.log
            control.log
      - name: Fail the job if the tests or the index failed
        if: always()
        shell: bash
        run: |
          echo "tests: ${{ steps.tests.outcome }}, index --fresh: ${{ steps.fresh.outcome }}"
          [ "${{ steps.tests.outcome }}" = success ] && [ "${{ steps.fresh.outcome }}" = success ]
