# Fast tests: a compile gate over the whole workspace plus a short smoke set,
# redesigned 2026-09-29 (GitHub #314, #414-#417; maintainer decisions).
#
# WHY IT CHANGED. The previous version ran `cargo quick-test` over every crate a
# push could reach. Measured over its last 100 runs: 1 success, 28 failures,
# 69 cancelled; runs averaged 90 min and took up to 261 (2026-09-25). Most
# pushes were superseded before they reported, and one deliberately failing
# test turned every run red, so a new regression could not be told apart
# from the known one. The maintainer disabled it on 2026-09-29 ("way too long,
# and it's failing its purpose") and chose this shape instead.
#
# ── What each push runs, on ubuntu / windows / macos ────────────────────────
#
# 1. COMPILE GATE (#414). One `cargo test --release --no-run --lib --tests`
#    over only the TOP crates, the members no other member depends on,
#    computed each run by `kovan-cli ci top-crates` so a new crate cannot be
#    left out. Every library in the workspace is built exactly ONCE, as a
#    dependency. Measured 2026-09-29: 15 of 46 members are top-level, and
#    with `--tests` they reach all 46.
#    NOT covered, accepted: low-level crates' own tests, examples and benches,
#    and features no dependent enables.
#
# 2. SMOKE SET (#415, #416), `ci/smoke-tests.toml`. The maintainer's
#    selection: Godiva (HIGH tier, from the repo's ENDF/B-VIII.0 tapes),
#    Edwards, the outram-foam cavity and the Sod shock tube. They are copies
#    hosted in top crates, run by `kovan-cli ci smoke --run` in one invocation
#    over the same package set as the gate, so nothing is compiled twice.
#
# Tests left failing ON PURPOSE are listed as `[[known_failure]]` and run in
# the `known-failures` job, which may fail without turning this run red.
#
# RELEASE MODE IS NOT NEGOTIABLE (root CLAUDE.md, "EVERYTHING is release").
# That includes the Android and iOS checks below, which ran in the dev profile
# until 2026-09-29.
#
# WORK IS NOT DONE ON A GREEN RUN HERE. A green badge means "everything
# compiles and the four smoke cases pass", never "the suite passes". The real
# suite is `cargo test --workspace --lib --tests --release`.
# ~~That real suite now RUNS, in `.github/workflows/full-tests.yml`, on
# `main`.~~ CORRECTED 2026-09-29: it has NEVER run on CI. `main` has no
# `.github/workflows/` directory, so GitHub never registered `full-tests.yml`
# (`gh workflow list --all` lists only `fast tests` and `manual tests`).
# Whether it should run nightly on `develop` is an open question on #417.
#
# NOT COVERED, deliberately: `wasm32-unknown-unknown`, which has its own gate at
# `scripts/check-wasm.sh` with a documented per-crate exclusion list.

name: fast tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A failed build should not be retried silently into a timeout.
  CARGO_NET_RETRY: 2
  RUST_BACKTRACE: short

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede only PULL-REQUEST runs, never pushes to develop: each develop
  # commit is something someone may later bisect to. (Measured earlier:
  # `cancel-in-progress: true` killed the slow legs on every push, runs
  # 35299832412 and 35300663774.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Compile gate + smoke set, on the three desktop OSes ─────────────────────
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A ceiling, not a target. Measured locally 2026-09-29 (36 threads, warm
    # cache): gate 41 s, smoke 72 s + 30 s. A cold 4-core runner is far slower:
    # the gate is a release build of the whole workspace, and Godiva's
    # RECONR/BROADR scales with cores. Replace this with a measured figure
    # after the first runs.
    timeout-minutes: 120
    strategy:
      fail-fast: false # one platform's failure must not hide the others'
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: smoke-${{ matrix.os }}
          cache-on-failure: true

      # NO SYSTEM BLAS STEP, DELIBERATELY: `ndarray-linalg` is behind
      # `outram-foam-basic-lib`'s `blas-bench` feature and out of the default
      # graph. If a BLAS install step ever becomes necessary here, something has
      # regressed back into the default graph. Fix the dependency.

      - name: Build kovan-cli (the CI selector)
        shell: bash
        run: cargo build --release -q -p kovan --bin kovan-cli

      - name: Which crates are top-level?
        id: top
        shell: bash
        run: |
          ./target/release/kovan-cli ci top-crates > top.txt
          echo "args=$(cat top.txt)" >> "$GITHUB_OUTPUT"
          echo "top crates: $(cat top.txt)"

      - name: Check the smoke list against the tree
        shell: bash
        run: ./target/release/kovan-cli ci smoke

      # One invocation over the top crates. `--no-run` builds every library
      # once plus the top crates' own lib and test targets, and links them,
      # so this is a stronger gate than `cargo check`. The smoke step below
      # reuses these artifacts.
      - name: Compile gate (top crates, --lib --tests)
        shell: bash
        run: cargo test --release --no-run --lib --tests ${{ steps.top.outputs.args }}

      - name: Smoke set (Godiva HIGH, Edwards, cavity, Sod)
        shell: bash
        run: ./target/release/kovan-cli ci smoke --run

  # ── Tests left failing on purpose; allowed to fail ────────────────────────
  known-failures:
    name: known failures (allowed to fail)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: known-failures
          cache-on-failure: true

      # Runs each `[[known_failure]]` in `ci/smoke-tests.toml` BY EXACT NAME
      # with `--ignored`. A bare `--ignored` would also start the multi-hour
      # tests that `#[ignore]` marks elsewhere. A known failure that starts
      # passing is printed as NOW PASSING: propose closing its issue.
      - name: Known failures
        shell: bash
        run: cargo run --release -q -p kovan --bin kovan-cli -- ci known-failures

  # ── Compile-only platforms ─────────────────────────────────────────────────
  android:
    name: check / android (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The three the root CLAUDE.md names: the device target plus the two
        # emulator targets.
        target: [aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.target }}
          cache-on-failure: true

      # NO NDK IS INSTALLED, AND NONE IS NEEDED. `cargo check` type-checks
      # without linking, so a pure-Rust workspace checks for Android with the
      # target alone. Verified 2026-09-18 on a machine with no NDK present.
      # If a crate ever grows a `build.rs` that invokes a C compiler, this job
      # will start failing and WILL need `cargo-ndk` — that failure is the
      # signal, and should not be worked around by dropping `--all-targets`.
      # EXCLUSION, and there is exactly one. `outram-park-digital-twin-engine`
      # is egui/eframe and is the workspace's single declared GUI exemption
      # (root CLAUDE.md: "only `outram-park-digital-twin-engine` (egui/eframe)
      # is a genuine GUI exemption"). Every other member, including `kovan`
      # and its CLI/TUI binaries, is REQUIRED to check for Android.
      #
      # Measured 2026-09-18: with that one exclusion the whole workspace passes
      # `--all-targets` for aarch64-linux-android. Do not add to this list to
      # make a red job green — a new failure here is an Android-portability
      # defect (epic op-zfr), which is the entire point of the job.
      - name: Check all targets for ${{ matrix.target }}
        run: |
          cargo check --release --workspace \
            --exclude outram-park-digital-twin-engine \
            --all-targets --target ${{ matrix.target }}

  ios:
    name: check / ios (${{ matrix.target }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-${{ matrix.target }}
          cache-on-failure: true

      # iOS IS NEW GROUND FOR THIS WORKSPACE AND IS UNVERIFIED.
      #
      # Nothing in the repository has ever been built for iOS, the root
      # CLAUDE.md's portability rules name Android and wasm but not iOS, and
      # this job was authored on a Linux machine where an iOS target CANNOT be
      # checked (it needs the macOS SDK). So unlike every other job here, its
      # first run on CI is also its first run anywhere.
      #
      # Consequences, stated rather than discovered:
      #  - `--lib` only, not `--all-targets`. The Android rule prefers
      #    `--all-targets` and it is the better bar, but several crates carry
      #    egui/wgpu examples and terminal binaries that plainly cannot build
      #    for iOS, and a permanently red job is an ignored job. Tightening
      #    this to `--all-targets` is the right follow-up once the library
      #    baseline is green.
      #  - iOS escapes the `ndarray-linalg` dev-dependency (Linux/macOS/Windows
      #    only), so no BLAS is needed. It does NOT escape the
      #    `cfg(not(target_os = "android"))` tables, so rayon, tokio, wgpu and
      #    friends are all pulled in. Whether those build for iOS is exactly
      #    what this job measures.
      #
      # If this job is red on arrival, that is INFORMATION, not a broken
      # workflow: it is the first measurement of the workspace's iOS
      # portability. Record what fails per crate and gate it the way
      # `scripts/check-wasm.sh` gates its exclusions, rather than deleting the
      # job.
      - name: Check libraries for ${{ matrix.target }}
        run: cargo check --release --workspace --lib --target ${{ matrix.target }}
