[workspace]
resolver = "2"
members = [
    "crates/chem-eng-real-time-process-control-simulator",
    "crates/teh-o-prke",
    "crates/tuas_boussinesq_solver",
    "crates/tampines-steam-tables",
    "crates/outram-foam-basic-lib",
    "crates/outram-foam-turbulence-lib",
    "crates/outram-foam-appbuilder-lib",
    "crates/outram-mc-libs",
    "crates/dwsim-libs",
    "crates/boon-lay",
    "crates/njoy-outram-park-fork",
    "crates/nee_soon",
    "crates/outram-park-fork-coolprop",
]

# Shared package metadata. Member crates keep their own `version` (they are
# published independently) but inherit everything else from here so that the
# whole OUTRAM PARK suite is released from this repository.
[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
homepage = "https://github.com/theodoreOnzGit/outram-park-backend"
repository = "https://github.com/theodoreOnzGit/outram-park-backend"
categories = ["science"]

# Single source of truth for third-party dependency versions. Every member
# inherits these with `<dep>.workspace = true`, so versions can never drift
# between TUAS, TAMPINES, etc. All pinned to the latest stable release.
[workspace.dependencies]
# core numerical / library deps
approx = "0.5.1"            # 0.6 is only a pre-release; staying on latest stable
csv = "1.4.0"
ndarray = "0.17.2"
ndarray-linalg = "0.18.1"  # features (openblas/intel-mkl) chosen per-target by each crate
peroxide = "0.41.2"
roots = "0.0.8"
thiserror = "2.0.18"
uom = "0.38.0"
serde = { version = "1.0.228", features = ["derive"] }
serde-xml-rs = "0.8.2"
anyhow = "1.0.100"
log = "0.4"
rayon = "1.11.0"
fission-yields-data = "0.1.4"
openmc-endf-8-depletion-lib-a = "1.0.0"
openmc-endf-8-depletion-lib-b = "1.0.0"
# pure-Rust HDF5 (no system libhdf5) — staged for the Windowed Multipole (WMP)
# import in njoy-outram-park-fork (Phase 4g, MIT WMP_Library). No member inherits
# it yet, so it has no build impact until WMP adds `hdf5-pure.workspace = true`.
hdf5-pure = { version = "0.20.0", features = ["ndarray"] }
# Pure-Rust DEFLATE (both encode AND decode in one crate, no C toolchain) — the
# codec for the embedded WMPB windowed-multipole blob in njoy-outram-park-fork.
# Chosen over zstd/ruzstd because those lack a mature pure-Rust *encoder*.
miniz_oxide = "0.8"

# HIGH-fidelity data-acquisition stack for njoy-outram-park-fork's `net-fetch`
# feature (opt-in ENDF download tier; see docs/data-acquisition.md). Every crate
# here is pure-Rust and cross-platform — no OpenSSL, no C build deps — so the
# default lean build (which does NOT enable `net-fetch`) pulls none of them.
ureq = { version = "2.10", default-features = false, features = ["tls"] } # rustls TLS, no OpenSSL
sha2 = "0.10"          # SHA-256 for download integrity re-checks
directories = "5.0"    # XDG / AppData / ~/Library cache dir discovery
fs2 = "0.4"            # advisory file locks (anti-thundering-herd for parallel runs)
# IAEA NDS serves each nuclide as a MAT-numbered .zip; extract in memory. Pure-Rust
# deflate via flate2's miniz_oxide backend — no system zlib.
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# GUI / example stack — egui ecosystem pinned to the matched 0.34 series
# (egui 0.34 requires Rust >= 1.92)
egui = "0.34.3"
eframe = { version = "0.34.3", default-features = false, features = [
    "accesskit",     # Make egui compatible with screen readers.
    "default_fonts", # Embed the default egui fonts.
    "wgpu",          # Use the wgpu rendering backend (Vulkan/Metal/DX12; Wayland-native).
    "persistence",   # Enable restoring app state when restarting the app.
] }
egui_plot = "0.35.0"  # 0.35 pairs with egui 0.34 (0.34.x pairs with egui 0.33)
egui_extras = { version = "0.34.3", features = ["all_loaders"] }
env_logger = "0.11.10"
image = { version = "0.25.10", features = ["jpeg", "png"] }
local-ip-address = "0.6.13"

# internal workspace crates — depend on these by path so members use the
# in-tree copy rather than a crates.io release.
chem-eng-real-time-process-control-simulator = { path = "crates/chem-eng-real-time-process-control-simulator", version = "0.1.0" }
teh-o-prke = { path = "crates/teh-o-prke", version = "0.1.2" }
tuas_boussinesq_solver = { path = "crates/tuas_boussinesq_solver", version = "0.1.3" }
tampines-steam-tables = { path = "crates/tampines-steam-tables", version = "0.2.1" }
outram-foam-basic-lib        = { path = "crates/outram-foam-basic-lib",        version = "0.1.5" }
outram-foam-turbulence-lib   = { path = "crates/outram-foam-turbulence-lib",   version = "0.1.0" }
outram-foam-appbuilder-lib   = { path = "crates/outram-foam-appbuilder-lib",   version = "0.1.0" }
outram-mc-libs         = { path = "crates/outram-mc-libs",         version = "0.1.0" }
dwsim-libs          = { path = "crates/dwsim-libs",          version = "0.1.0" }
boon-lay            = { path = "crates/boon-lay",            version = "0.1.2" }
# All nuclear-data representation (ENDF processing, WMP + Faddeeva, lean ACE)
# lives here; outram-mc-libs and nee_soon pull cross sections from it.
njoy-outram-park-fork = { path = "crates/njoy-outram-park-fork", version = "0.0.1" }
# Coupling / integration layer — composes njoy-outram-park-fork, outram-mc-libs and
# teh-o-prke behind one object-oriented facade (scaffold).
nee_soon            = { path = "crates/nee_soon",            version = "0.1.0" }

# Optimize all dependencies even in debug builds — the thermal-hydraulic
# solvers are expensive, so unoptimized deps make tests painfully slow.
# (Lifted from chem-eng's crate-level profile; profiles are only honored at the
# workspace root.)
[profile.dev.package."*"]
opt-level = 2
