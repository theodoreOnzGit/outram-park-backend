[package]
name = "kovan-web"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
# AGPL-3.0-only, like the rest of the kovan front ends (`kovan`), NOT the
# workspace's GPL-3.0-only: the maintainer's direction for web-kovan
# (GitHub #736, 2026-10-06: "AGPL, since it is part of the kovan family").
# It depends on no AGPL crate itself; see NOTICE.
license = "AGPL-3.0-only"
description = "KOVAN-WEB — web-kovan, the read-only Code Review UI (code map, crate module trees, module function rings, source panel, review bar) in egui, built for the browser (wasm32) and natively."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# The page's HTML and build script are repo-only.
exclude = ["web"]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 2
topic = "knowledge-management"
maturity = 1

[dependencies]
# The code map, call graph and star-layout data and geometry (wasm-clean;
# moved out of `kovan` for this crate on 2026-10-06).
kovan-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The UI. Off Android only: the workspace's windowing exemption (the pure
# model, `model` and `data`, still builds and is tested there).
[target.'cfg(not(target_os = "android"))'.dependencies]
egui = { workspace = true }

# Browser plumbing: fetch, the URL hash, opening a tab, the clock.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Location", "History", "Response", "Element",
    "HtmlCanvasElement", "NodeList", "DomRect",
] }

# The page: `examples/web.rs` runs the UI in eframe, natively (reading the
# data from a folder) and in the browser (web/build.sh).
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
eframe = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
eframe = { workspace = true, features = ["glow"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement"] }

# web-kovan, natively or in the browser:
#
#   cargo run -p kovan-web --example web --release -- --data <dir> [--workspace .]
#   bash crates/kovan-web/web/build.sh <out-dir>
#
# Carries an Android stub `main`.
[[example]]
name = "web"
path = "examples/web.rs"
