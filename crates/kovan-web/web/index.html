<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Review · OUTRAM PARK</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1014; color: #d8dce4;
               font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #kw_canvas { display: block; width: 100%; height: 100%; outline: none; }
  #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             text-align: center; padding: 24px; }
  #loading .box { max-width: 34em; }
  #loading .spin { width: 28px; height: 28px; margin: 0 auto 16px; border-radius: 50%;
                   border: 3px solid #3a4150; border-top-color: #7aa7ff; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  noscript, .err { color: #ff8a8a; }
</style>
</head>
<body>
<canvas id="kw_canvas"></canvas>
<div id="loading">
  <div class="box">
    <div class="spin"></div>
    <p><strong>Loading web-kovan…</strong></p>
    <p>The read-only Code Review view of OUTRAM PARK: the code map, each crate's module tree, each module's
      functions with their callers and callees, review stamps and source.</p>
    <p>Research, education and V&amp;V only.</p>
    <noscript>This page needs JavaScript and WebAssembly.</noscript>
  </div>
</div>
<script type="module">
  import init from "./kovan_web.js";
  init().catch((e) => {
    const el = document.getElementById("loading");
    if (el) el.innerHTML = '<p class="err">Could not start: ' + String(e) + "</p>";
    console.error(e);
  });
</script>
</body>
</html>
