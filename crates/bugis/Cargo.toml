[package]
name = "bugis"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "BUGIS (Browser-based User Graphics Interaction System) — colour theming for the OUTRAM PARK GUIs: the shared Gruvbox Dark/Light egui theme, palette and theme selector."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
exclude = ["docs"]

# Where this crate sits in kovan's code map (see bishan's Cargo.toml for the
# keys). A utility: no topic fidelity.
[package.metadata.kovan]
row = 0
topic = "utility"
maturity = 1
backronym = "Browser-based User Graphics Interaction System"

# egui only (pure Rust: compiles on Android and wasm32); never eframe, so a
# non-GUI crate never pulls a windowing stack through this one.
[dependencies]
egui.workspace = true
