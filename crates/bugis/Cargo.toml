[package]
name = "bugis"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
description = "BUGIS (Browser-based User Graphics Interaction System) — colour theming for the OUTRAM PARK GUIs, no_std + alloc: the Gruvbox palette and roles, temperature and Crameri colour maps, and (feature egui) the shared Gruvbox Dark/Light egui theme and selector."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
exclude = ["docs"]

# Where this crate sits in kovan's code map (see bishan's Cargo.toml for the
# keys). A utility: no topic fidelity.
[package.metadata.kovan]
row = 0
topic = "utility"
maturity = 1
backronym = "Browser-based User Graphics Interaction System"

# no_std + alloc core (maintainer, 2026-11-02). PETIR for the exact floor and
# round the colour maps use (petir is no_std). egui is the
# optional GUI half, on by default; never eframe, so no crate pulls a
# windowing stack through this one.
[features]
default = ["egui"]
egui = ["dep:egui"]

[dependencies]
petir = { workspace = true }
egui = { workspace = true, optional = true }
