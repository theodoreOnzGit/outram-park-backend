[package]
name = "changi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "CHANGI — atmospheric dispersion, plume transport, deposition and ground contamination. Pure-Rust port of FLEXPART. Research, education and V&V only."
homepage.workspace = true
repository.workspace = true
categories.workspace = true
# The upstream FLEXPART clone is reference-only and gitignored; it is never
# compiled into the crate and never packaged.
exclude = ["docs", "upstream_source/*", "dev/*"]

[dependencies]
uom   = { workspace = true }
# petir supplies the numerics. Its erf/erfc are GSL-derived and carry their own
# test suite, so `part0` uses them rather than porting FLEXPART's erf.f90 --
# the workspace "reuse before porting, port before writing" rule.
petir = { workspace = true }

[dev-dependencies]
approx = { workspace = true }

# ── rayon: native + Android only ─────────────────────────────────────────────
# The Gaussian puff field's own thread pool (see `puff::wgsl::pool`) --
# the map refreshes at 10 Hz beside a physics loop, and sharing the global
# pool means whichever grabs the workers first stalls the other.
#
# Target-gated off wasm ONLY, matching `boon-lay`'s own rayon-vs-wasm32
# constraint (`crates/boon-lay/Cargo.toml`, bead op-okqo.1): rayon is pure
# Rust and Android is in scope, so Termux keeps the multi-core path. On
# `wasm32-unknown-unknown`, which has no OS threads, `puff::wgsl::field_pooled`
# falls back to the serial `field_serial` kernel under the same name rather
# than depending on rayon at all -- see that function's doc comment.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[features]
# gpu — dispatches `puff::wgsl::field_gpu`/`field_auto`'s GPU path through
# PETIR's headless runner. OFF BY DEFAULT, matching `petir/wgpu`'s own
# default: a host with no adapter (or this feature disabled) simply uses
# `puff::wgsl::field_pooled`. See `puff::wgsl`'s module doc for why both
# paths must exist -- `outram-mc-libs/CLAUDE.md`'s GPU policy is a hard rule
# across this workspace, and `petir/wgpu` is itself target-gated off Android
# and wasm, which this feature does not change.
gpu = ["petir/wgpu"]
