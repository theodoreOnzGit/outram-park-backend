[package]
name = "bishan"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "BISHAN (Building Internal Source-term and Hazard Analysis Network) — Level 2 PSA: severe-accident progression inside the plant, containment and building response, in-building aerosol transport and pool scrubbing, release categories. First code (2026-09-29): a lumped HTR-10 reactor-building CV; the rest of the scope is not implemented."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# `docs/` is repo-only (the rustdoc->markdown API mirror and any V&V
# write-ups). Excluded so it never ships to crates.io.
exclude = ["docs"]

# `uom` since 2026-09-29: the building CV (gh:#400) is the first code, and
# its API carries physical quantities. RAFFLES (the roadmap's probabilistic
# machinery) is still NOT declared: nothing calls into it yet.
[dependencies]
uom.workspace = true
