[package]
name = "outram-mc-libs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure-Rust port of OpenMC Monte Carlo neutron transport kernels -- an independent OUTRAM PARK fork, not the official OpenMC software"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# V&V raw data (verification_and_validation/*.csv) is dev-only, gitignored,
# and never shipped in the packaged crate. `docs/` (incl. the generated
# docs/api.md rustdoc mirror) isn't crate content either.
exclude = ["verification_and_validation/*.csv", "docs"]

[dependencies]
thiserror = { workspace = true }
ndarray = { workspace = true }
# Nuclear data (cross sections, ν̄, χ). outram-mc-libs is data-free — it pulls all
# microscopic cross sections from this crate's provider surface. See
# docs/architecture.md.
njoy-outram-park-fork = { workspace = true }
# Used ONLY at the njoy nuclear-data boundary (S(α,β) thermal scattering import in
# `material::thermal`), which speaks dimensioned `uom` types. The transport hot
# loop stays raw `f64` — see this crate's CLAUDE.md "Units" note.
uom = { workspace = true }
# Depletion / transmutation data — CONSUMED, not rebuilt. All pure-Rust
# (serde + serde-xml-rs + uom + strum; no BLAS/C), so they stay Android-safe.
#   * decay data (half-lives, decay modes, branching, targets) parsed from the
#     ENDF/B-8 OpenMC depletion chain XML, split a (Z<=47) / b (Z>=48).
#   * parent-independent fission yields (ENDF/B-VIII.0) per fissioning nuclide.
# See src/depletion/ and docs/ai-fleet-review/op-6tz-depletion/.
openmc-endf-8-depletion-lib-a = { workspace = true }
openmc-endf-8-depletion-lib-b = { workspace = true }
fission-yields-data = { workspace = true }

[features]
# HIGH-fidelity nuclear data. Forwards to njoy's `net-fetch` tier so
# `Nuclide::from_endf` can download raw ENDF tapes and reconstruct pointwise
# σ(E) on device (RECONR + BROADR). Off by default — the LOW tier
# (`Nuclide::from_core`, embedded WMP + fast MGXS) needs no network. Enable with
# `--features net-fetch`. See docs/data-acquisition.md.
net-fetch = ["njoy-outram-park-fork/net-fetch"]

# Optional GPU compute (headless, no window) for the embarrassingly-parallel MC
# kernels — see `src/gpu/`. wgpu is **target-gated OFF Android** (no system
# Vulkan/Metal loader, no easy toolchain there), so the library still builds
# headless for `aarch64-linux-android` via the CPU-only shim. Desktop targets
# get the real wgpu path; the CPU (raw-f64 transport) always stays the trusted,
# deterministic reference — GPU is acceleration only. Version is inherited from
# the root `[workspace.dependencies]` (matched to the eframe/egui 0.34 stack).
#
# NOTE: no `pollster`/executor dependency is added — `src/gpu/mod.rs` hand-rolls
# a tiny pure-std `block_on` to drive the two `request_adapter`/`request_device`
# futures, keeping this crate's third-party surface unchanged (dependency policy:
# all versions live in the root workspace table).
[target.'cfg(not(target_os = "android"))'.dependencies]
wgpu = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
