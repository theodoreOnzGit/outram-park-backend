[package]
name = "outram-park-fork-onix"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Independent pure-Rust fork/translation of ONIX (open-source depletion/burnup; MIT upstream) — Bateman/CRAM depletion + fission-product inventory for the MSRE digital twin. SCAFFOLD: no human V&V. Not affiliated with the ONIX project."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# docs/ and the upstream reference clone are repo-only provenance aids, never
# shipped in the packaged crate. upstream_source/README.md (the provenance
# record) is intentionally NOT excluded so it stays in the package.
exclude = ["docs", "upstream_source/ONIX"]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 2
topic = "neutronics"
fidelity = 1
maturity = 2

[dependencies]
# Every transcendental routes through PETIR for cross-platform bit identity
# (gh:#985), and since gh:#999 CRAM16 itself (petir::depletion::cram16_pfd).
# petir is no_std, so this edge adds nothing Android- or wasm-hostile.
petir = { workspace = true }
uom.workspace = true
thiserror.workspace = true
# CRAM16 itself is petir::depletion::cram16_pfd since 2026-10-20 (gh:#999), on
# PETIR's own complex type; num-complex was dropped then.

