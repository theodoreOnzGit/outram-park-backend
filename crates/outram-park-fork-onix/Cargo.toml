[package]
name = "outram-park-fork-onix"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Independent pure-Rust fork/translation of ONIX (open-source depletion/burnup; MIT upstream) — Bateman/CRAM depletion + fission-product inventory for the MSRE digital twin. SCAFFOLD: no human V&V. Not affiliated with the ONIX project."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# docs/ and the upstream reference clone are repo-only provenance aids, never
# shipped in the packaged crate. upstream_source/README.md (the provenance
# record) is intentionally NOT excluded so it stays in the package.
exclude = ["docs", "upstream_source/ONIX"]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: its order in that box,
# 1 = highest fidelity (longest crunch time, fewest assumptions). maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 2
topic = "neutronics"
fidelity = 3
maturity = 2

[dependencies]
uom.workspace = true
thiserror.workspace = true
# num-complex: complex arithmetic for the CRAM partial-fraction resolvent solves
# (A - theta_k/dt * I)^{-1}. Pure Rust, no BLAS/FFI, Android-safe. Version lives
# in the root [workspace.dependencies].
num-complex.workspace = true

