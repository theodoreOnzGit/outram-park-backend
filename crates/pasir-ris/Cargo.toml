[package]
name = "pasir-ris"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "PASIR RIS (Probabilistic Assessment of Safety In Reactors: Risk & Reliability Integrated Studio) — the reserved home for an integrated risk and reliability GUI over the workspace's safety crates. Placeholder: nothing is implemented."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# `docs/` is repo-only (the rustdoc->markdown API mirror and any V&V
# write-ups). Excluded so it never ships to crates.io.
exclude = ["docs"]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 4
topic = "app"
fidelity = [0, 1]
maturity = 0

# Every PSA-related crate, all three levels, declared by maintainer direction
# (2026-10-06: "pasir ris should depend on any PSA related crate yeah... all 3
# levels at lower-ish fidelity") before any code calls into them, so the code
# map shows where the studio sits. PASIR RIS drives their lower-fidelity
# models; the high-fidelity solvers stay in their own crates and studios.
[dependencies]
# Level 1: fault trees (`raffles::scram`), sampling and UQ.
raffles.workspace = true
# Level 2: in-building release (`bishan`) and the source term and offsite
# chain it orchestrates (`sembawang`).
bishan.workspace = true
sembawang.workspace = true
# Level 3: atmospheric dispersion (`changi`), dose (`buangkok`) and ground
# transport (`redhill`, a placeholder).
changi.workspace = true
buangkok.workspace = true
redhill.workspace = true
