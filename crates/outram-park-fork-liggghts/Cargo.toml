[package]
name = "outram-park-fork-liggghts"
version = "0.0.0"
edition.workspace = true
# LICENSING NOTE (see NOTICE): LIGGGHTS-PUBLIC's source headers declare "GNU
# Public License, version 2 OR LATER", which IS compatible with GPL-3.0 (the
# "or later" option permits use under GPLv3) — so LIGGGHTS-PUBLIC source may be
# ported into this GPL-3.0-only crate. (Corrects an earlier note that wrongly
# said GPL-2.0-only/blocked.) Confirm each ported file's "or later" header and
# keep its provenance; LAMMPS-proper headers are version-unspecified (murkier).
license.workspace = true
description = "Pure-Rust granular-DEM library for OUTRAM PARK (particles, contact mechanics, thermal DEM, pebble/packed-bed physics), porting/reimplementing LIGGGHTS/LAMMPS-granular algorithms. LIGGGHTS-PUBLIC is GPL-2-or-later (GPL-3 compatible) — see NOTICE. SCAFFOLD: Particle framework only, no human V&V."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
exclude = ["docs"]

[dependencies]
# Pure-Rust, Android-safe deps only (no BLAS / C). `uom` types the physical
# API boundary (mass, radius, temperature, ...); `thiserror` the error enum.
# The DEM pillar is kept dependency-independent of the CFD crates (per the
# Phase II separation principle) — CFD-DEM coupling is a future explicit seam.
uom.workspace = true
thiserror.workspace = true

[dev-dependencies]
approx.workspace = true

[lib]
name = "outram_park_fork_liggghts"
path = "src/lib.rs"
