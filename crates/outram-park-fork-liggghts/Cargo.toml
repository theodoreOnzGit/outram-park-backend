[package]
name = "outram-park-fork-liggghts"
version = "0.0.0"
edition.workspace = true
# LICENSING NOTE (see NOTICE): LIGGGHTS-PUBLIC and LAMMPS are GPL-2.0-ONLY,
# which is NOT compatible with this workspace's GPL-3.0-only license — GPL-2.0
# code cannot be relicensed to GPL-3.0. This crate is therefore an INDEPENDENT
# Rust implementation of granular-DEM physics (informed by public DEM
# literature and by identifying the upstream algorithms by name), and does NOT
# copy or translate GPL-2.0 LIGGGHTS/LAMMPS source. Porting actual upstream
# source is BLOCKED pending a maintainer licensing decision (bead op-t3l).
license.workspace = true
description = "Independent pure-Rust granular-DEM library for OUTRAM PARK (particles, contact mechanics, thermal DEM, pebble/packed-bed physics), informed by LIGGGHTS/LAMMPS-granular algorithms. NOT a code port — see NOTICE for the GPL-2 vs GPL-3 licensing note. SCAFFOLD: Particle framework only, no human V&V."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
exclude = ["docs"]

[dependencies]
# Pure-Rust, Android-safe deps only (no BLAS / C). `uom` types the physical
# API boundary (mass, radius, temperature, ...); `thiserror` the error enum.
# The DEM pillar is kept dependency-independent of the CFD crates (per the
# Phase II separation principle) — CFD-DEM coupling is a future explicit seam.
uom.workspace = true
thiserror.workspace = true

[dev-dependencies]
approx.workspace = true

[lib]
name = "outram_park_fork_liggghts"
path = "src/lib.rs"
