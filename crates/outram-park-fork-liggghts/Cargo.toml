[package]
name = "outram-park-fork-liggghts"
version = "0.0.0"
edition.workspace = true
# LICENSING NOTE (see NOTICE): LIGGGHTS-PUBLIC's source headers declare "GNU
# Public License, version 2 OR LATER", which IS compatible with GPL-3.0 (the
# "or later" option permits use under GPLv3) — so LIGGGHTS-PUBLIC source may be
# ported into this GPL-3.0-only crate. (Corrects an earlier note that wrongly
# said GPL-2.0-only/blocked.) Confirm each ported file's "or later" header and
# keep its provenance; LAMMPS-proper headers are version-unspecified (murkier).
license.workspace = true
description = "Pure-Rust granular-DEM library for OUTRAM PARK (particles, contact mechanics, thermal DEM, pebble/packed-bed physics), porting/reimplementing LIGGGHTS/LAMMPS-granular algorithms. LIGGGHTS-PUBLIC is GPL-2-or-later (GPL-3 compatible) — see NOTICE. SCAFFOLD: Particle framework only, no human V&V."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
exclude = ["docs"]

[features]
# Tests over 5 minutes are gated on this and it is default-on, so a plain
# `cargo test` runs them. See the "Any test over 5 minutes" HARD RULE in the
# workspace CLAUDE.md; turn them off with `cargo quick-test -p
# outram-park-fork-liggghts`.
default = ["long-tests"]
long-tests = []
# Contact-graph and message-passing-reach bridge to `raffles::gnn`
# (src/gnn_bridge.rs). Off by default. Enabling it does NOT pull in `burn`:
# the graph and the reach bound are plain combinatorics, and `raffles`'s own
# `burn` feature stays off unless a caller asks for it.
gnn = ["dep:raffles"]

[dependencies]
# Pure-Rust, Android-safe deps only (no BLAS / C). `uom` types the physical
# API boundary (mass, radius, temperature, ...); `thiserror` the error enum.
# The DEM pillar is kept dependency-independent of the CFD crates (per the
# Phase II separation principle) — CFD-DEM coupling is a future explicit seam.
uom.workspace = true
thiserror.workspace = true
# RAFFLES's graph-neural-network layer, for the `gnn` feature below. OPTIONAL
# and off by default: a DEM user who is not building a surrogate should not
# compile a tensor library. The dependency is one-way — `raffles` does not
# depend on this crate, and must not, or the two become uncompilable.
raffles = { workspace = true, optional = true }

[dev-dependencies]
approx.workspace = true

[lib]
name = "outram_park_fork_liggghts"
path = "src/lib.rs"
