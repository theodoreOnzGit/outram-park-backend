[package]
name = "outram-foam-basic-lib"
version = "0.1.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenFOAM primitive functions translated to Rust -- an independent OUTRAM PARK fork, not the official OpenFOAM software"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# V&V raw data (verification_and_validation/*.csv) is dev-only, gitignored,
# and never shipped in the packaged crate. `docs/` (incl. the generated
# docs/api.md rustdoc mirror) isn't crate content either. `upstream_source/
# openfoam` is the reference OpenFOAM C++ clone kept in-repo for provenance
# only — it is not crate content and must not be packaged (the small
# `upstream_source/README.md` provenance record stays in the package).
exclude = ["verification_and_validation/*.csv", "docs", "upstream_source/openfoam"]

[dependencies]
thiserror.workspace = true
uom.workspace = true
ndarray.workspace = true
# Data parallelism for the hot finite-volume kernels — the LDU sparse
# matrix-vector product, the Krylov vector operations, and the element-wise
# field algebra. Pure Rust with no system dependency, so it is Android/Termux
# clean and is therefore an unconditional dependency.
rayon.workspace = true

# Optional GPU acceleration for the same kernels (`src/gpu.rs`) — target-gated
# OFF Android, which has no system Vulkan/Metal loader and where the workspace
# Android rule forbids GPU dependencies in a library build, so the crate still
# builds headless for aarch64-linux-android. On desktop it is built
# unconditionally with a mandatory runtime CPU fallback: GPU is acceleration
# only, and the CPU path is the trusted one. This mirrors the arrangement
# already used by `outram-park-fork-pflotran` and `njoy-outram-park-fork`.
[target.'cfg(not(target_os = "android"))'.dependencies]
wgpu.workspace = true

[dev-dependencies]
approx.workspace = true
ndarray.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
ndarray-linalg = { workspace = true, features = ["openblas-system"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
ndarray-linalg = { workspace = true, features = ["intel-mkl-static"] }

[target.'cfg(windows)'.dev-dependencies]
ndarray-linalg = { workspace = true, features = ["intel-mkl-static"] }

[lib]
name = "outram_foam_basic_lib"
path = "src/lib.rs"
