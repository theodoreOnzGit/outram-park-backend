[package]
name = "outram-mc-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Mobile-first, touchscreen ratatui TUI for outram-mc-libs: pick a preset geometry/material, tune run settings (CPU/GPU, batches, seed), and watch the k-eigenvalue converge with a neutron-spectrum / cross-section overlay"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true

[lib]
name = "outram_mc_tui"
path = "src/lib.rs"

[[bin]]
name = "outram-mc-tui"
path = "src/main.rs"

[dependencies]
outram-mc-libs.workspace = true
njoy-outram-park-fork.workspace = true
# ratatui runs ON Android/Termux for THIS crate (a terminal lib is in-scope on
# Android per the workspace CLAUDE.md "Android portability" rule) — unlike
# kovan-tui, which target-gates ratatui off Android and stubs to a CLI
# redirect. Declared unconditionally, `.workspace = true`, no pin. ratatui
# re-exports its matched crossterm as `ratatui::crossterm`, which is what this
# crate uses for mouse-capture events (`EnableMouseCapture` / `MouseEvent`) —
# no separate crossterm dependency.
ratatui.workspace = true
