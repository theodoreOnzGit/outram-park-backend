[package]
name = "kovan-discovery"
description = "KOVAN file discovery + deterministic text search using the fd (ignore) and ripgrep (grep) engines."
version = "0.0.1"
edition.workspace = true
license = "AGPL-3.0-only"  # all of kovan is AGPL since 2026-10-07 (NOTICE)
# `docs/` is repo-only: the rustdoc->markdown API mirror and the V&V
# write-ups. Excluded so it never ships to crates.io (size, and it is
# not part of the published API surface).
exclude = ["docs"]
repository.workspace = true

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 1
topic = "knowledge-management"
maturity = 1

[dependencies]
kovan-common.workspace = true
ignore.workspace = true
grep-searcher.workspace = true
grep-regex.workspace = true
grep-matcher.workspace = true
# gitoxide (gix) *library* — powers the `git` module (repo discovery, HEAD/
# branch, tracked files, history, blame, status). Pure-Rust, so the default
# library backend builds clean on Android; the CLI-fallback backend is gated
# off Android in `git.rs`. See the root [workspace.dependencies] note.
gix.workspace = true
# Zotero search (`zotero` module, GitHub #751): `regex` for full-text regexp mode
# and the CJK/word token classes; `serde_json` for saved-search JSON;
# `unicode-normalization` for `normalizeForSearch` (NFKD/NFC). All pure Rust.
regex.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
# Throwaway fixture trees (with a real .gitignore) for discovery/search
# tests — pure-Rust, Android-friendly, dev-only so it never touches the
# Android library build (see CLAUDE.md's Android portability rule).
tempfile.workspace = true
