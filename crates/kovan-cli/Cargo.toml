[package]
name = "kovan-cli"
description = "KOVAN command-line interface — agent-facing (Claude Code and other coding agents)."
version = "0.0.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "kovan"
path = "src/main.rs"

[dependencies]
kovan-common.workspace = true
kovan-discovery.workspace = true
kovan-literature.workspace = true
kovan-semantics.workspace = true
kovan-codegen.workspace = true
# `tokens` / `historian`: per-commit API-token accounting and the pre-merge
# report. Replaces docs/historian/*.py so the toolchain needs no Python.
kovan-metrics.workspace = true
clap.workspace = true
# `lit import`/`lit bibtex` round-trip a `KovanDocument` through JSON on disk
# (kovan-common's canonical serde format).
serde_json.workspace = true
# `kovan setup`: PATH-presence check for the curated external-tool list
# (pure-Rust, Android-fine; the `cargo install` spawn itself is desktop-scope
# and only runs when a user explicitly invokes `setup`).
which.workspace = true

[dev-dependencies]
# `lopdf` builds a small synthetic PDF fixture for the `lit` end-to-end tests
# (mirrors kovan-literature's private `test_pdf` helper, which isn't exported).
lopdf.workspace = true
tempfile.workspace = true
