[package]
name = "outram-blender"
version = "0.0.0"
edition.workspace = true
license.workspace = true
# NAME / TRADEMARK NOTE (for the maintainer): the workspace convention (op-ahi)
# names independent forks `outram-park-fork-<project>` (e.g.
# `outram-park-fork-coolprop`). The maintainer explicitly requested the name
# `outram-blender`. This crate is NOT affiliated with, endorsed by, or
# sanctioned by the Blender Foundation; "Blender" is used only to identify the
# upstream project whose mesh/geometry ARCHITECTURE inspired this scaffold. The
# final published name is a maintainer decision — see README.md "Naming &
# trademark".
description = "Blender-inspired mesh-authoring frontend for OUTRAM PARK multiphysics (scaffold) -- an independent OUTRAM PARK project, not affiliated with the Blender Foundation"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# docs/ (dependency map, AI-fleet review manifest) is repo-only, never shipped.
exclude = ["docs"]

[dependencies]
# Pure-Rust error type (Android-safe, in workspace deps). No BLAS, no C, no GUI.
thiserror = { workspace = true }

# NOTE: no OpenGL/Vulkan/GUI dependency here. The library is headless and
# Android-buildable. Any future viewport/GUI belongs in `examples/` behind a
# `cfg(not(target_os = "android"))` gate, never in the library's unconditional
# build (workspace Android-portability rule).
