[package]
name = "petir"
version = "0.0.3"
edition.workspace = true
# GPL-3.0-only. PETIR is a no_std port of parts of the GNU Scientific Library,
# which is GPL-3.0-OR-LATER -- verified 2026-09-14 by reading GSL's own per-file
# headers, not its COPYING and not its documentation (see NOTICE and
# upstream_source/README.md for why that distinction matters). Porting GPL
# source creates a derivative work, so the obligation carries over and the flow
# is ONE-WAY: code here cannot go back upstream under another licence.
#
# It also carries kernels lifted verbatim from outram-foam-basic-lib (GPL-3.0,
# itself derived from OpenFOAM) and transfer-function blocks derived from
# chem-eng-real-time-process-control-simulator (GPL-3.0). Both are in-workspace
# and GPL-3.0, so no additional obligation arises; provenance headers still
# travel with every file.
license.workspace = true
description = "PETIR — Polynomials, Equations, Transforms, Integration and Roots. A no_std, dependency-lean core numerics library ported from the GNU Scientific Library. Independent port, not affiliated with or endorsed by GSL or the FSF. AI-assisted draft: unverified and untrusted except where a specific V&V case demonstrates otherwise — not for safety-critical use."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# `docs/` is the repo-only API mirror; `upstream_source/GSL` is the gitignored
# reference clone. Neither is packaged. upstream_source/README.md is NOT
# excluded -- the provenance record must travel with the crate.
exclude = ["docs", "upstream_source/GSL"]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 0
topic = "utility"
maturity = 2
backronym = "Polynomials, Equations, Transforms, Integration and Roots"

[dependencies]
# libm is REQUIRED, not a nicety: in no_std the f64 transcendentals are
# std-only and the ported GSL routines call them throughout. See the comment in
# the workspace manifest for the bit-identical-across-platforms consequence,
# which is deliberate and must not be silently undone.
libm.workspace = true

# uom — OPTIONAL, and deliberately confined to ~~the `transfer-fn` module~~
# `transfer_fn` and `uom_math` (the latter added 2026-10-20, gh:#985: it holds
# no numerics, only the 27 quantity methods no_std uom drops, forwarded to
# `real` / `mathf`).
#
# The epic (bn:op-chyp) settled "Raw f64, not uom -- PETIR is dimensionless
# numerics; uom belongs at the physics crates' API boundaries, not inside a
# Chebyshev evaluator." That still holds and is not being relaxed: every
# numerical kernel in this crate -- linalg, poly, specfunc, and everything that
# follows them -- takes and returns bare f64.
#
# The one place units are genuinely load-bearing is `transfer_fn`, whose blocks
# are derived from chem-eng-real-time-process-control-simulator, where a sample
# time IS a `uom` Time and a dimensionless signal IS a `Ratio`. Stripping the
# units there would be a regression against the code being ported, not a
# simplification. So uom is confined behind a feature: a caller who wants only
# the numerics (njoy-outram-park-fork and raffles are the motivating cases, both
# explicitly dependency-lean) gets no uom in their graph at all.
#
# ~~CRATE-LOCAL, NOT `workspace = true`, and that is forced rather than chosen:
# the root entry is `uom = "0.38.0"` with default features, which include `std`.
# Cargo's workspace inheritance can only ADD features, never remove them -- a
# member writing `default-features = false` has it silently ignored (Cargo warns
# and plans to make it an error). There is no way to get a no_std uom through
# inheritance. The version string is kept BYTE-IDENTICAL to the root entry; if
# you bump uom there, bump it here in the same change.~~
# **CORRECTED 2026-10-20 (gh:#985)** -- the root entry is now itself no_std
# (`default-features = false, features = ["autoconvert", "f64", "si"]`), so
# PETIR inherits it like every other member and the duplicated version string
# is gone. Inheritance still only ADDS features, so the constraint has moved:
# the ROOT must never list `std`, or this crate's no_std build links std.
# `tests/dependency_policy.rs` now checks exactly that, mechanically.
uom = { workspace = true, optional = true }

# wgpu — OPTIONAL, behind the `wgpu` feature, and target-gated off Android and
# wasm.
#
# Off Android: no system Vulkan/Metal loader. Off wasm: wgpu-hal is not Sync
# there, and a dev-dependency applies to tests as well as examples.
#
# THIS IS THE ONE FEATURE THAT BRINGS IN `std`, and it is the thing the
# removed `platform-libm` feature got wrong (bn:op-7kwt). That feature declared
# a `std` feature while `lib.rs` gated `extern crate std;` on `cfg(test)`
# ALONE, so `std` never actually arrived for a non-test build and the hatch had
# been dead since the crate went `no_std`. The lesson is not "never add such a
# feature" -- it is "gate `extern crate std` on the feature as well, and prove
# it with the sweep that caught the last one":
#
#     cargo check -p petir --all-features --all-targets
#
# `lib.rs` now reads `#[cfg(any(test, feature = "wgpu"))] extern crate std;`.
# The crate stays `#![no_std]` with default features, and all five mandated
# no_std checks run with default features.
# `faer` — OPTIONAL, behind the `faer` feature (off by default): the real
# faer crate as a second backend of `sparse::SparseLu` / `SparseLlt`
# (`SparseBackend::Faer`). Maintainer direction, gh #994, 2026-10-20: "bring
# faer into petir under a feature, then wire it into bedok", corrected the
# same day to keep PETIR no_std + alloc: faer's default features are off
# (the root entry says `default-features = false`) and only `sparse-linalg`
# is named here, so no `std`, no `rayon` and no `npy` (whose `psm` C build
# broke the Android check). See CLAUDE.md "Dependencies".
faer = { workspace = true, optional = true, features = ["sparse-linalg"] }

[dev-dependencies]
approx.workspace = true
# `libm` is a dev-dependency as well as a dependency so the V&V tests can call
# it DIRECTLY. `petir::real::{exp, ln, powf}` route to the ARM
# optimized-routines ports, so comparing a fast port against `petir::real`
# would compare it with itself; the cross-check has to reach the musl-derived
# implementation by name to stay an independent second opinion.
libm.workspace = true
# `faer` — the upstream that `petir::sparse` was ported from (gh #994,
# maintainer direction 2026-10-20). A DEV-dependency only, so
# `tests/sparse_vs_faer.rs` compares the port against upstream's own compiled
# code on every test run (orderings exactly, solutions bit for bit). Never a
# normal dependency: faer needs `std`. No `rayon`: the comparison is serial.
faer = { workspace = true, features = ["std", "sparse-linalg"] }


[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
wgpu = { workspace = true, optional = true }

# naga — wgpu's own shader front-end, used by the tests to VALIDATE the WGSL
# without a device, so CI checks something even where no adapter exists.
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dev-dependencies]
naga = { workspace = true, features = ["wgsl-in"] }

[features]
default = ["transfer-fn"]
# Continuous and discrete transfer functions (the `transfer_fn` module). Pulls
# in no_std `uom` for sample times and signal ratios. Turn it off for a
# units-free, uom-free numerics core.
transfer-fn = ["uom"]
# `uom_math` (gh:#985): the 27 Quantity / Ratio / Angle methods no_std `uom`
# drops (sqrt, powi, cbrt, hypot, mul_add, atan2, exp/ln/log*, trig and
# inverse trig), restored on PETIR maths under `r_` names. On by default
# through `transfer-fn`; a consumer that wants only the quantity helpers can
# take `default-features = false, features = ["uom"]`.
uom = ["dep:uom"]
# wgpu — the GPU path: `wgsl::gpu`, a headless compute runner for the WGSL
# kernels in `wgsl`. OFF BY DEFAULT and enabled by nothing else.
#
# This is the only feature that pulls in `std`, which is why `lib.rs` gates
# `extern crate std;` on it as well as on `cfg(test)`. Without the shader
# source and the `f32` mirrors it guards nothing: those live in `wgsl` and
# `wgsl::mirror`, are `no_std` and dependency-free, and are always compiled.
wgpu = ["dep:wgpu"]
# The real faer 0.24.4 as `sparse::SparseBackend::Faer`. Caveats: no_std +
# alloc; without `std` (below) faer cannot detect the CPU at run time and runs
# its baseline kernels unless built with target features (`-C
# target-cpu=native` or `-C target-feature=+avx2,+fma`); its results depend on
# the CPU and instruction set, so they are not bit-identical across machines
# (`SparseBackend::Ported` is the deterministic choice). See README/CLAUDE.md.
faer = ["dep:faer"]
# `std` — OPTIONAL, off by default. Its ONLY effect is `faer/std` when `faer`
# is on, which gives faer runtime CPU detection (AVX2/FMA, AVX-512) and its
# fast kernels. PETIR itself stays `#![no_std]` and its ported numerics do not
# change (UFCS throughout, gh:#1001). Maintainer direction, gh #994,
# 2026-10-20: "You can give petir a std feature also."
std = ["faer?/std"]
# ~~std / platform-libm~~ REMOVED 2026-09-17 (bn:op-7kwt). The `platform-libm`
# escape hatch could not compile in any configuration -- it declared `std` while
# lib.rs was `#![no_std]` unconditionally with `extern crate std` gated on
# `cfg(test)` alone. See `src/mathf.rs`'s module docs for the full record and
# for why gating it on `cfg(test)` was rejected rather than adopted.
