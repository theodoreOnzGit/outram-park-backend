# module surface is built out incrementally (see docs/notes.md or the epic
# op-dt3 in beads for the live plan).
tuas_boussinesq_solver.workspace = true
outram-park-fork-coolprop.workspace = true
tampines-steam-tables.workspace = true
outram-foam-basic-lib.workspace = true
chem-eng-real-time-process-control-simulator.workspace = true

# Public API primitives -- dimensioned quantities and error types.
uom.workspace = true
thiserror.workspace = true

# No GUI dependencies here (egui/eframe/egui_plot/egui_extras etc.) -- this is
# a headless library per the workspace's Android-portability rule. GUI deps
