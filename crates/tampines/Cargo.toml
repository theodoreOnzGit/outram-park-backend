[package]
name = "tampines"
version = "0.0.4"
authors = [
    "Ong Kay Chen Theodore",
    "Ethan Yew Hoe, Wong",
    "Professor Per F. Peterson",
    "University of California, Berkeley Thermal Hydraulics Lab",
    "Singapore Nuclear Research and Safety Institute (SNRSI)",
    "National University of Singapore (NUS)",
    "The OUTRAM PARK backend contributors",
]
edition.workspace = true
license.workspace = true
# `docs/` is repo-only: the rustdoc->markdown API mirror and the V&V
# write-ups. Excluded so it never ships to crates.io (size, and it is
# not part of the published API surface).
exclude = ["docs"]
description = "TAMPINES -- Thermal-hydraulic Artificial-intelligence Multi-Phase INtegrated Emulator System: the central OUTRAM PARK thermal-hydraulic framework (fluid flow, thermophysical properties, heat transfer, balance of plant, humid-air psychrometrics, multiphase TH)"
homepage.workspace = true
repository.workspace = true
categories.workspace = true

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 3
topic = "thermal-hydraulics"
fidelity = 1
maturity = 1
backronym = "Thermal-hydraulic Artificial-intelligence Multi-Phase INtegrated Emulator System"

[features]
# `long-tests` gates the individual tests that measure over 5 minutes, and is
# default-on, so a plain `cargo test` runs them. See the "Any test over 5
# minutes" HARD RULE in the workspace CLAUDE.md. Turn them off while
# iterating with `cargo quick-test -p tampines`.
default = ["long-tests"]
long-tests = []

[dependencies]
# Every transcendental routes through PETIR for cross-platform bit identity
# (gh:#985). petir is no_std, so this edge adds nothing Android- or wasm-hostile.
petir = { workspace = true }
# Backend thermal-hydraulic / thermophysical-property crates this framework
# composes. Wired now even though not every one has a consumer yet -- the
# module surface is built out incrementally (see docs/notes.md or the epic
# op-dt3 in beads for the live plan).
tuas_boussinesq_solver.workspace = true
outram-park-fork-coolprop.workspace = true
tampines-steam-tables.workspace = true
outram-foam-basic-lib.workspace = true
# Uncertainty quantification and reduced-order models (RAVEN port). tampines
# reaches real-time by evaluating a SURROGATE where a full property or closure
# solve is too slow per tick per node -- see the crate docs. The ROM layer
# itself is tracked in beads op-38my; this dependency is wired now so the
# intent is discoverable from the manifest and the doc links resolve, in the
# same spirit as the note above about crates without a consumer yet.
raffles.workspace = true
# The 3-D multiphase reference (epic op-2kk). `multiphase_1d` reduces its
# closures to 1-D rather than inventing its own -- the hard constraint in beads
# op-dt3.12 / op-dt3.13. Only the algebraic closures are consumed
# (`SlipModel`, `DragModel`); the 3-D field equations are not.
outram-foam-multiphase.workspace = true
# GeN-Foam port (gh:#1060): `multiphase_1d::interfacial` reuses its
# interfacial-area models (`closures::interfacial::area::InterfacialArea`) and
# its one-parameter flow-regime map (`regime_map::RegimeMap1D`) rather than
# porting them a second time. No cycle: the appbuilder depends only on petir,
# outram-foam-{basic,turbulence,multiphase}-lib, ndarray, serde, uom, thiserror.
outram-foam-appbuilder-lib.workspace = true
chem-eng-real-time-process-control-simulator.workspace = true
# DWSIM-derived equipment-model correlations (pipe/valve/heat-exchanger/
# expander/pump) for tampines::components (op-dt3.4) to build on.
outram-park-fork-dwsim-libs.workspace = true
# TRISO coated-particle geometry (four-layer CSG cell with uom-typed layer
# radii) reused by tampines::pebble_bed::triso rather than duplicated.
# Maintainer-approved edge (2026-08-11, op-jyyp.5): geometry and per-layer
# property handling only -- boon-lay's fission-product RELEASE model is NOT
# consumed here (its CRP-6 verification test is flagged defective, op-jyyp.10).
boon-lay.workspace = true
# 1-D continuous-Galerkin flow (gh:#1069) takes its Gauss-Legendre line rule
# from farrer-park's `quadrature::facet_rule(FacetType::Line2)` rather than a
# copy. farrer-park depends only on petir, uom, thiserror and
# outram-foam-basic-lib, all already here, so this edge adds no new crate to
# the tree and no cycle (farrer-park does not depend on tampines).
farrer-park.workspace = true
# ~~teh-o-prke as a library dependency for the HTR-10 coupled transient
# (gh:#1151, decision D2)~~ CORRECTED again 2026-11-03: maintainer moved
# coupled kinetics to nee_soon (`nee_soon::htr10_th_transient`); tampines
# takes heat sources as fixed or user-set inputs and is teh-o-prke-free again
# (~~only the gated dev-dependency below, for the fhr_sim_v2 example~~ none at
# all since 2026-11-05: that example moved to nee_soon).

# Public API primitives -- dimensioned quantities and error types.
uom.workspace = true
thiserror.workspace = true

# No GUI dependencies here (egui/eframe/egui_plot/egui_extras etc.) -- this is
# a headless library per the workspace's Android-portability rule. GUI deps
# belong only under [dev-dependencies] once examples/ lands (op-dt3.7/.8).
# (Since 2026-11-05 tampines has no GUI example; fhr_sim_v2 moved to nee_soon.)

# ~~fhr_sim_v2 (op-dt3.7, moved from tampines-steam-tables). teh-o-prke +
# nee_soon for the Nordheim-Fuchs kinetics reconstruction; ...~~
# MOVED 2026-11-05 (maintainer: "nee_soon depends on tampines, never the
# reverse"): the fhr_sim_v2 example now lives at
# `crates/nee_soon/examples/fhr_sim_v2/`, with the gated GUI dev-dependency
# block it needed (teh-o-prke, nee_soon, ndarray, egui, bugis, eframe,
# env_logger, local-ip-address, egui_plot, egui_extras, serde). Nothing else in
# tampines used them, so tampines has no dev-dependency on nee_soon (a
# publish-time cycle: `cargo publish` resolves dev-dependencies too).

# ── wasm32: name getrandom's entropy backend ─────────────────────────────────
# getrandom 0.3 will not build for wasm32-unknown-unknown without being told
# where entropy comes from. The `wasm_js` FEATURE here is half of it; the other
# half is the matching cfg flag in the workspace `.cargo/config.toml`, and
# getrandom errors if either is missing.
#
# This crate does not want randomness — it arrives via `peroxide`, which pulls
# `rand` unconditionally with no feature to disable it. Cutting the dependency
# would mean replacing peroxide's CubicSpline across ~39 sites, which is its own
# job; satisfying it is the smaller correct change here. Bead op-okqo.3.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
