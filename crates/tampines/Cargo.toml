[package]
name = "tampines"
version = "0.0.1"
authors = [
    "Ong Kay Chen Theodore",
    "Ethan Yew Hoe, Wong",
    "Professor Per F. Peterson",
    "University of California, Berkeley Thermal Hydraulics Lab",
    "Singapore Nuclear Research and Safety Institute (SNRSI)",
    "National University of Singapore (NUS)",
    "Repository Contributors",
]
edition.workspace = true
license.workspace = true
description = "TAMPINES -- Thermal-hydraulic Artificial-intelligence Multi-Phase INtegrated Emulator System: the central OUTRAM PARK thermal-hydraulic framework (fluid flow, thermophysical properties, heat transfer, balance of plant, humid-air psychrometrics, multiphase TH)"
homepage.workspace = true
repository.workspace = true
categories.workspace = true

[dependencies]
# Backend thermal-hydraulic / thermophysical-property crates this framework
# composes. Wired now even though not every one has a consumer yet -- the
# module surface is built out incrementally (see docs/notes.md or the epic
# op-dt3 in beads for the live plan).
tuas_boussinesq_solver.workspace = true
outram-park-fork-coolprop.workspace = true
tampines-steam-tables.workspace = true
outram-foam-basic-lib.workspace = true
# The 3-D multiphase reference (epic op-2kk). `multiphase_1d` reduces its
# closures to 1-D rather than inventing its own -- the hard constraint in beads
# op-dt3.12 / op-dt3.13. Only the algebraic closures are consumed
# (`SlipModel`, `DragModel`); the 3-D field equations are not.
outram-foam-multiphase.workspace = true
chem-eng-real-time-process-control-simulator.workspace = true
# DWSIM-derived equipment-model correlations (pipe/valve/heat-exchanger/
# expander/pump) for tampines::components (op-dt3.4) to build on.
outram-park-fork-dwsim-libs.workspace = true
# TRISO coated-particle geometry (four-layer CSG cell with uom-typed layer
# radii) reused by tampines::pebble_bed::triso rather than duplicated.
# Maintainer-approved edge (2026-08-11, op-jyyp.5): geometry and per-layer
# property handling only -- boon-lay's fission-product RELEASE model is NOT
# consumed here (its CRP-6 verification test is flagged defective, op-jyyp.10).
boon-lay.workspace = true

# Public API primitives -- dimensioned quantities and error types.
uom.workspace = true
thiserror.workspace = true

# No GUI dependencies here (egui/eframe/egui_plot/egui_extras etc.) -- this is
# a headless library per the workspace's Android-portability rule. GUI deps
# belong only under [dev-dependencies] once examples/ lands (op-dt3.7/.8).

# fhr_sim_v2 (op-dt3.7, moved from tampines-steam-tables). teh-o-prke +
# nee_soon for the Nordheim-Fuchs kinetics reconstruction; the rest mirrors
# tampines-steam-tables's former fhr_sim_v2 dev-deps (tuas_boussinesq_solver
# and chem-eng-real-time-process-control-simulator are already real deps
# above, usable in examples too).
#
# These dev-dependencies are used ONLY by the fhr_sim_v2 GUI example, and the
# `egui`/`eframe` stack is Android-hostile (it needs a `cc`/`ring` C toolchain).
# Gate the whole block off Android so `cargo check --target
# aarch64-linux-android --tests --examples` does not try to build the GUI stack.
# The example itself carries `#![cfg(not(target_os = "android"))]`.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
teh-o-prke.workspace = true
nee_soon.workspace = true
ndarray.workspace = true
egui.workspace = true
eframe.workspace = true
env_logger.workspace = true
local-ip-address.workspace = true
roots.workspace = true
egui_plot.workspace = true
egui_extras.workspace = true
serde.workspace = true

[[example]]
name = "fhr_sim_v2"
path = "examples/fhr_sim_v2/main.rs"
