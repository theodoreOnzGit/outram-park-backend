edition.workspace = true
license = "MIT"                       # provisional — CoolProp is MIT (bead op-kbc.5)
description = "Pure-Rust fork/translation of CoolProp (Helmholtz-EOS thermophysical properties), enum-dispatched with hardcoded fluid data — no runtime JSON."
