[package]
name = "outram-park-fork-coolprop"
version = "0.1.0"
edition.workspace = true
# GPL-3.0-only: although CoolProp itself is MIT, this crate ships GPL-3.0-only
# OpenFOAM-derived code (src/openfoam_algorithms/openfoam_source/*), which is
# infective — so the crate as a whole is distributed under GPL-3.0-only. The
# CoolProp-derived portions retain their MIT provenance in-tree (see NOTICE).
# (Resolves bead op-kbc.5.)
license.workspace = true
description = "Pure-Rust fork/translation of CoolProp (Helmholtz-EOS thermophysical properties), enum-dispatched with hardcoded fluid data — no runtime JSON. An independent OUTRAM PARK fork, not the official CoolProp software. GPL-3.0 (ships OpenFOAM-derived code); no human V&V yet — use at your own risk."
repository.workspace = true
homepage.workspace = true
categories.workspace = true
# V&V raw data (verification_and_validation/*.csv) is dev-only, gitignored,
# and never shipped in the packaged crate. `docs/` holds LaTeX sources and
# build artifacts (.aux/.bbl/.bcf/...) that aren't crate content either.
exclude = ["verification_and_validation/*.csv", "docs"]

# The Helmholtz EOS engine and fluid data are pure `std` (hardcoded Rust, no
# runtime JSON). `uom` is the only runtime dependency — it types the
# `OPCPFluidSingleCV` control-volume API and the vendored `openfoam_algorithms`
# finite-volume layer. Both `uom` and those primitives are pure Rust (no BLAS /
# C / ndarray, and no `outram-foam-basic-lib` dependency — the primitives are
# copied in as source), so the crate still builds on Android.
[dependencies]
uom.workspace = true

[dev-dependencies]
approx.workspace = true
