[package]
name = "outram-park-fork-coolprop"
version = "0.1.2"
authors.workspace = true
edition.workspace = true
# GPL-3.0-only: although CoolProp itself is MIT, this crate ships GPL-3.0-only
# OpenFOAM-derived code (src/openfoam_algorithms/openfoam_source/*), which is
# infective — so the crate as a whole is distributed under GPL-3.0-only. The
# CoolProp-derived portions retain their MIT provenance in-tree (see NOTICE).
# (Resolves bead op-kbc.5.)
license.workspace = true
description = "Pure-Rust fork/translation of CoolProp (Helmholtz-EOS thermophysical properties), enum-dispatched with hardcoded fluid data — no runtime JSON. An independent OUTRAM PARK fork, not the official CoolProp software. GPL-3.0 (ships OpenFOAM-derived code); no human V&V yet — use at your own risk."
repository.workspace = true
homepage.workspace = true
categories.workspace = true
# V&V raw data (verification_and_validation/*.csv) is dev-only, gitignored,
# and never shipped in the packaged crate. `docs/` holds LaTeX sources and
# build artifacts (.aux/.bbl/.bcf/...) that aren't crate content either.
# `upstream_source/CoolProp` is the reference CoolProp clone kept in-repo for
# provenance and codegen only (some files tracked, most gitignored) — it is not
# crate content and must not be packaged; `upstream_source/README.md` (the
# provenance record) is small and stays in the package.
exclude = ["verification_and_validation/*.csv", "docs", "upstream_source/CoolProp"]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 2
topic = "thermal-hydraulics"
fidelity = 0
maturity = 2

# The Helmholtz EOS engine and fluid data are pure `std` (hardcoded Rust, no
# runtime JSON). `uom` is the only runtime dependency — it types the
# `OPCPFluidSingleCV` control-volume API and the vendored `openfoam_algorithms`
# finite-volume layer. Both `uom` and those primitives are pure Rust (no BLAS /
# C / ndarray, and no `outram-foam-basic-lib` dependency — the primitives are
# copied in as source), so the crate still builds on Android.
[dependencies]
# erf / erfc / tgamma / lgamma in pure Rust, replacing the `extern "C"` calls
# into the system C libm (bn:op-chyp.6). PETIR is no_std with only `libm`.
petir.workspace = true
uom.workspace = true
# The FvMesh, MeshError, 1-D mesher and tensor primitives of
# `openfoam_algorithms::openfoam_source` are re-exported from here (deduped
# 2026-10-03, GitHub #492; they were code-identical copies). This is the one
# new heavy-ish edge in this crate: it brings thiserror and ndarray (with
# matrixmultiply, num-complex, num-integer, rawpointer, ...) into a tree that
# was petir + uom only. All pure Rust, Android- and wasm-clean; rayon/wgpu stay
# off. Recorded on #492 so the maintainer can reverse it if the weight matters.
outram-foam-basic-lib.workspace = true

[dev-dependencies]
approx.workspace = true
