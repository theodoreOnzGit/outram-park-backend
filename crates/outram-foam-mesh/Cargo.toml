[package]
name = "outram-foam-mesh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "OpenFOAM mesh generation & conversion utilities translated to Rust (blockMesh, snappyHexMesh, ideasUnvToFoam, polyDualMesh) -- an independent OUTRAM PARK fork, not the official OpenFOAM software"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# V&V raw data (verification_and_validation/*.csv) is dev-only, gitignored,
# and never shipped in the packaged crate. `docs/` (incl. the generated
# docs/api.md rustdoc mirror) isn't crate content either.
exclude = ["verification_and_validation/*.csv", "docs"]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: its order in that box,
# 1 = highest fidelity (longest crunch time, fewest assumptions). maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 2
topic = "thermal-hydraulics"
fidelity = 5
maturity = 2

[dependencies]
thiserror.workspace = true
uom.workspace = true
ndarray.workspace = true
outram-foam-basic-lib.workspace = true

[dev-dependencies]
approx.workspace = true

[lib]
name = "outram_foam_mesh"
path = "src/lib.rs"
