[package]
name = "kovan"
description = "KOVAN — CLI (agent-facing), TUI and GUI (human-facing) front ends over the KOVAN knowledge layer."
version = "0.0.0"
edition.workspace = true
# AGPL-3.0-only, NOT `license.workspace = true` (GPL-3.0-only) — deliberate,
# maintainer-directed divergence from the workspace default (2026-08-21) to
# depend on `kopitiam-pdf` (also AGPL-3.0-only). See NOTICE in this directory
# for the full relicense record and the workspace-boundary rule it sets: this
# is the ONLY AGPL-3.0-only crate in OUTRAM PARK, `kopitiam-pdf` is declared
# here (not in the root `[workspace.dependencies]`) so no other crate can
# pick it up by accident, and nothing else in the workspace may depend on
# `kovan` without re-examining that boundary.
license = "AGPL-3.0-only"

# Consolidated 2026-08-21 from the former separate `kovan-cli` and
# `kovan-tui` crates so one crate carries all three interfaces. `kovan` and
# `kovan-tui` need no extra feature (matching the two original crates, whose
# clap/ratatui deps were unconditional — nothing else depends on this crate as
# a library, so there is no "keep the base lean" concern the way there is for
# kovan-literature).
#
# The graph digitiser (`src/digitiser/`, three more binaries below) moved in
# from `kovan-literature` the same day — see NOTICE for why (in one line:
# only the digitiser needs `kopitiam-pdf`, which is why this crate alone is
# AGPL-3.0-only, and kovan-literature must not be dragged into that). Its
# `frontend`/CLI surface needs no feature gate any more — `clap` is already
# unconditional here, unlike in kovan-literature, where it was optional. Only
# the egui GUI stays behind a feature, now named plainly `gui` (was
# kovan-literature's `digitise-gui`) since this crate owns it outright.
#
# `gui` is a DEFAULT feature — desktop builds get the `kovan` GUI binary with
# a plain `cargo build -p kovan`, no `--features gui` needed — but stays Android-free
# with no `--no-default-features` needed either: `eframe`/`egui` are declared
# only under the `[target.'cfg(not(target_os = "android"))'.dependencies]`
# table below, so on an Android build those deps simply do not exist in that
# target's dependency graph at all, and `gui`'s `dep:eframe`/`dep:egui`
# requirement resolves to nothing there rather than erroring. Confirmed
# 2026-08-21: `cargo tree -p kovan --target aarch64-linux-android -e
# features` shows zero `eframe`/`egui` — the standard Cargo pattern for a
# platform-specific default feature, the same shape crates like `winit` use.
[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui"]

# Exactly three binaries, per the final interface spec on GitHub issue #30
# (2026-08-21): `kovan` (GUI), `kovan-cli` (agent CLI), `kovan-tui` (terminal
# UI). Collapsed from the prior five (`kovan`, `kovan-tui`, `kovan-gui`,
# `kovan-digitise`, `kovan-digitise-tui`) — `kovan-digitise` folded into
# `kovan-cli digitise`, `kovan-digitise-tui`'s review screen became
# `kovan-tui`'s Digitiser tab. See NOTICE and `src/tui/digitiser.rs`.
[[bin]]
name = "kovan"
path = "src/bin/kovan.rs"
required-features = ["gui"]

[[bin]]
name = "kovan-cli"
path = "src/bin/kovan-cli.rs"

[[bin]]
name = "kovan-tui"
path = "src/bin/kovan-tui.rs"

[dependencies]
kovan-common.workspace = true
kovan-discovery.workspace = true
kovan-literature.workspace = true
kovan-semantics.workspace = true
kovan-codegen.workspace = true
# `tokens` / `historian`: per-commit API-token accounting and the pre-merge
# report. Replaces docs/historian/*.py so the toolchain needs no Python.
kovan-metrics.workspace = true
clap.workspace = true
# `lit import`/`lit bibtex` round-trip a `KovanDocument` through JSON on disk
# (kovan-common's canonical serde format). Also used by the TUI Ingest tab.
serde_json.workspace = true
# `kovan setup`: PATH-presence check for the curated external-tool list
# (pure-Rust, Android-fine; the `cargo install` spawn itself is desktop-scope
# and only runs when a user explicitly invokes `setup`).
which.workspace = true
# Pure-Rust PDF page rasterizer (a from-source port of MuPDF's `fitz` draw
# device — real vector fills/strokes/images, real TrueType/CFF glyph outlines,
# not a screenshot pipeline), the missing piece for GitHub issue #30's
# integrated PDF reader (kopi-beans `op-6ez3`/`op-95x6`). AGPL-3.0-only —
# see the `license` field above and NOTICE for why this crate, alone in the
# workspace, is licensed to match. Declared directly here, NOT in the root
# `[workspace.dependencies]`, so it stays scoped to this one crate. Confirmed
# pure-Rust / Android-Termux-clean (no `-sys`/C-toolchain crate anywhere in
# its dependency tree) via `cargo tree -p kovan`, 2026-08-21 — no target
# gate needed. Not yet called from any code path in this crate; landing the
# dependency is the whole of this change, wiring it up is the separate,
# larger beads above.
kopitiam-pdf = "0.2.5"
# Graph digitiser engine (`src/digitiser/raster.rs` etc.): pure-Rust PNG/JPEG
# decoding (no C toolchain, builds on Termux/Android) and the codec
# `kopitiam-pdf` itself pulls in transitively. Moved in from kovan-literature
# 2026-08-21 with the rest of the digitiser — see NOTICE.
image.workspace = true
# `DigitisedDataset` and friends derive `Serialize`/`Deserialize`
# (`src/digitiser/dataset.rs`), and `raster.rs` SHA-256-hashes the source
# image for provenance (`DATA_POLICY.md`) — both moved in with the digitiser.
serde.workspace = true
sha2.workspace = true
# ratatui is unconditional (not target-gated off Android), unlike in most of
# this crate's own history: `kovan-digitise-tui` (moved in from
# kovan-literature 2026-08-21, see NOTICE) was Android-functional there
# (kovan-literature declared ratatui unconditionally too), and keeping that
# working mattered more than the Android build-size saving `kovan-tui` alone
# would get from gating it off. Once ratatui was unconditional, the
# `#[cfg(not(target_os = "android"))]` gate on `pub mod tui;` in `src/lib.rs`
# had no technical reason left either (it existed only because ratatui used
# to be Android-gated) — it was dropped the same day, so `kovan-tui` is now
# genuinely Android/Termux-usable end to end, not just Android-buildable.
# Confirmed 2026-08-21: `cargo check -p kovan --all-targets --target
# aarch64-linux-android` is clean with the full `tui` module (all seven
# tabs, including the digitiser) compiled in. This matters directly for
# GitHub issue #30's final interface spec, whose stated reason for wanting
# exactly `kovan`/`kovan-cli`/`kovan-tui` was Android usability.
ratatui.workspace = true

# The `gui` feature's egui/eframe stack, desktop-only: target-gated off
# Android on top of being behind the feature, so an Android build of this
# crate never pulls it even if some future caller enabled `gui` by mistake.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }

[dev-dependencies]
# `lopdf` builds a small synthetic PDF fixture for the `lit` end-to-end tests
# (mirrors kovan-literature's private `test_pdf` helper, which isn't exported).
lopdf.workspace = true
tempfile.workspace = true
