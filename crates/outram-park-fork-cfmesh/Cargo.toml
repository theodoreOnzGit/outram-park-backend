[package]
name = "outram-park-fork-cfmesh"
version = "0.0.4"
edition.workspace = true
# GPL-3.0-only: this crate is a Rust port/fork of cfMesh (GPL-3.0-only). The
# voro++-derived portions (BSD, LBNL) retain their permissive provenance
# in-tree (see NOTICE); BSD is GPLv3-compatible, so the crate as a whole is
# distributed under GPL-3.0-only.
license.workspace = true
description = "Pure-Rust fork/port of cfMesh (Creative Fields' automatic unstructured mesh generator: Cartesian / tetrahedral / polyhedral meshing with boundary layers), with voro++ as the Voronoi/polyhedral-dual reference. Consumes an outram-blender surface mesh and produces an outram-foam polyMesh. An independent OUTRAM PARK fork, not the official cfMesh. AGPL-3.0-only (ported files keep GPL-3.0); scaffold stage — no human V&V yet, use at your own risk."
repository.workspace = true
homepage.workspace = true
categories.workspace = true
# The vendored upstream clones are dev-only reference material (gitignored) and
# must never be packaged; `upstream_source/README.md` (the small provenance
# record) stays in the package.
exclude = ["docs", "upstream_source/cfMesh", "upstream_source/voro", "test_data"]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
# ~~row = 0~~ row 1 since 2026-11-05: `outram-foam-basic-lib` (row 1) became a
# regular dependency (gh:#1255), and a crate sits no lower than what it uses.
row = 1
topic = "utility"
maturity = 2

# The volume-meshing core (VolumeMesh, cartesian, carve, snap) is pure Rust.
# ~~it has no dependencies; `foam-export` pulls `outram-foam-basic-lib`~~
# **CHANGED 2026-11-05 (gh:#1255):** `outram-foam-basic-lib` is a regular
# dependency: `mesh_optimizer`'s boundary moves call its port of OpenFOAM's
# `eigenValues` / `eigenVectors` (symmTensor), as upstream cfMesh does. That
# crate is BLAS-free, in the wasm32 gate and Android-safe, and every consumer of
# this crate (outram-blender, dhoby-ghaut) already enabled `foam-export`, so
# none builds more than before. `foam-export` now only switches on the
# `PolyMesh` bridge module.
[features]
foam-export = []
# The cell-centre dual (gh:#1240, `dual::DualKind::CellCentre`): OpenFOAM's
# `polyDualMesh` as ported in `outram-foam-mesh` (pure Rust, Android- and
# wasm-safe). outram-foam-mesh does not depend on this crate: no cycle. Since
# gh:#1480 the dependency is unconditional; the feature only switches the code.
cell-centre-dual = []
# gh:#1476: `surfaceFile` STL reading through outram-foam-mesh's port of
# OpenFOAM's STLReader (`tri_surf_io::read_surface_bytes`). FMS/FTR need no
# feature. Since gh:#1480 outram-foam-mesh is an unconditional dependency; the
# feature only switches the code on. The outram-foam-cli meshers (cartesianMesh, tetMesh, pMesh, cartesian2DMesh)
# turn it on.
surface-file = []

[dependencies]
# Every transcendental routes through PETIR for cross-platform bit identity
# (gh:#985). petir is no_std, so this edge adds nothing Android- or wasm-hostile.
petir = { workspace = true }
outram-foam-basic-lib = { workspace = true }
# gh:#1480: non-optional. The OpenFOAM mesh-quality checks (`checks.rs`, used by
# the layer back-off, the pipelines and the optimizers) live in
# `outram_foam_mesh::check_mesh`. Pure Rust, Android- and wasm-safe (checked
# 2026-11-11, see the gh:#1480 V&V record); outram-foam-mesh does not depend on
# this crate: no cycle.
outram-foam-mesh = { workspace = true }

[dev-dependencies]
# (outram-foam-mesh, used by the gh:#1276 feature-edge differential, is a
# normal dependency since gh:#1480.)
# gh:#1385: the upstream-differential tests inflate the committed `.gz`
# polyMesh files (pure-Rust DEFLATE, already a workspace dependency).
miniz_oxide = { workspace = true }

# GUI example stack — the `mesh_studio` egui app (author a surface → generate a
# polyhedral volume mesh with prism boundary layers → export OpenFOAM/outram-foam
# polyMesh). Dev-only and target-gated OFF Android (windowing exemption); the
# library stays pure-Rust and Android-buildable.
# Also off wasm: this block is the egui/eframe (or wgpu) example stack, and
# wgpu-hal is not Sync on wasm. Dev-dependencies apply to TESTS as well as
# examples, so without this gate `cargo test --target wasm32-wasip1` cannot
# build even a test that touches none of it. The --lib compile gate in
# scripts/check-wasm.sh is blind to this class of problem. Bead op-okqo.7.
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dev-dependencies]
eframe = { workspace = true }
egui = { workspace = true }
bugis = { workspace = true }
env_logger = { workspace = true }

# The mesh-authoring GUI. Needs `foam-export` for the polyMesh writer, so it only
# builds with that feature:
#   cargo run -p outram-park-fork-cfmesh --example mesh_studio --features foam-export --release
[[example]]
name = "mesh_studio"
path = "examples/mesh_studio/main.rs"
required-features = ["foam-export"]

# gh:#1269: the edgeExtractor differential images use the cell-centre dual.
[[example]]
name = "edge_extractor_images"
path = "examples/edge_extractor_images.rs"
required-features = ["cell-centre-dual"]
