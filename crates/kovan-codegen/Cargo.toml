[package]
name = "kovan-codegen"
description = "KOVAN deterministic engineering-code generation for known numerical methods."
version = "0.0.1"
edition.workspace = true
license.workspace = true
# `docs/` is repo-only: the rustdoc->markdown API mirror and the V&V
# write-ups. Excluded so it never ships to crates.io (size, and it is
# not part of the published API surface).
exclude = ["docs"]
repository.workspace = true

[dependencies]
kovan-common.workspace = true
# Placeholder stage: no macro/codegen crates yet. When implementing, `syn`,
# `quote`, and `proc-macro2` are the expected additions for procedural macros;
# declarative macros and `build.rs` generation need no extra deps.
