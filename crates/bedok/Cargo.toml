[package]
name = "bedok"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "BEDOK — systems-level multiphysics coupling: 3-D nodal-diffusion neutronics coupled to thermal hydraulics. Rust translation of Than Yan Ren's (SNRSI) MATLAB implementation."
repository = "https://github.com/theodoreOnzGit/outram-park-backend"
readme = "README.md"
publish = false

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: its order in that box,
# 1 = highest fidelity (longest crunch time, fewest assumptions). maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 3
topic = "neutronics"
fidelity = 3
maturity = 2

[features]
# `long-tests` (GitHub #503, 2026-10-02): the workspace rule
# (docs/claude-md/long-tests-and-ci.md) gates any test over 5 minutes behind
# this default-on feature. MEASURED 2026-10-02 on an i9-13900K, each test run
# alone (RAYON_NUM_THREADS=12 pinned to 14 cores; the two transients re-run on
# 10 cores / 8 threads): the slowest is neacrpd1t's
# `the_two_kinetics_schemes_agree_on_a_gentle_window` at 202 s (14 cores) /
# 206 s (10 cores), then 108 s, 99 s, 95 s; no test reaches 5 minutes, so
# NOTHING is gated yet. The 49-minute run that prompted #503 was CPU
# oversubscription (each test runs faer/rayon in parallel internally, and the
# harness ran 14 of them at once), not a slow test: the whole lib suite takes
# 1509 s at `--test-threads=4` (14 then 10 cores). See CLAUDE.md.
default = ["long-tests"]
long-tests = []

# Dependencies are added as the modules that need them land, rather than all up
# front, so an unused entry never implies a capability the crate does not have.
#
# Expected additions, with the module that will pull each one in:
#   csv                     -> the benchmark case files (neacrpd1, iaea3ds, ...)
#   faer                    -> the sparse solves in diffusion_solverxyz
#   plotters (workspace dep -> plotreactor3dcolour
#     to be added)
#
# No steam-table dependency is needed: `IAPWS_IF97.m` is being translated
# directly into `src/iapws_if97/`, so `tampines-steam-tables` is NOT used here.
# That third-party translation is BSD-2-Clause (Copyright (c) 2013, Mark
# Mikofski), which is GPL-3.0-compatible; its terms are reproduced in the crate
# NOTICE as that licence requires.
[dependencies]
thiserror.workspace = true
# Platform-independent transcendentals for the nodal coupling coefficients.
#
# `calc_abefghxyz` builds its coefficients from `sinh` and `cosh`. Rust's
# inherent `f64::sinh` dispatches to the SYSTEM C library, and glibc and the
# MSVC CRT disagree in the last ulp — which is enough to change the flux
# solve's convergence path and move k_eff by 14 pcm. PETIR routes them through
# the pure-Rust `libm` (fdlibm) instead, one fixed implementation on every
# platform. See GitHub issue #222 and `petir::real`.
petir.workspace = true
# Sparse linear algebra, for the two flux solvers.
#
# Everything ported before them avoided a sparse solve: the A2 system in
# calc_a1234_expansionxyz only *looks* like a philen-square solve and is in fact
# block-diagonal in energy groups, while the gradD and nodal operators are
# assembled but never solved. diffusion_solverxyz and
# sanodaldiffusion_solverxyz solve the full flux system, which couples nodes
# spatially, and both factorise LHS once and reuse that factorisation across
# power iterations (MATLAB `decomposition`).
# The root workspace entry is `default-features = false` (GitHub #486,
# 2026-10-02, so outram-blender can build faer for wasm32); this names faer's
# own default features so bedok's build is unchanged.
faer = { workspace = true, features = ["std", "rayon", "sparse-linalg", "rand", "npy"] }
