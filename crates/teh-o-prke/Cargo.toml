[package]
name = "teh-o-prke"
version = "0.1.5"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Point Reactor Kinetics Package (PRKE) for the Transport and Eigenvalue Hybrid Open source solver (Teh-O)"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# `pki/` contains a private key (private.pem) that must never be published, and
# `docs/` holds a large theory PDF that isn't crate content.
exclude = ["pki", "docs", "verification_and_validation/*.csv"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 2
topic = "neutronics"
fidelity = 0
maturity = 1

[dependencies]
approx.workspace = true
ndarray.workspace = true
thiserror.workspace = true
uom.workspace = true
# real (non-dev) dep: nordheim_fuchs's optional reactivity-input driver
# reuses this crate's TransferFnFirstOrder -- see src/nordheim_fuchs.rs
chem-eng-real-time-process-control-simulator.workspace = true

[dev-dependencies]
env_logger.workspace = true
local-ip-address.workspace = true
roots.workspace = true
serde.workspace = true
tuas_boussinesq_solver.workspace = true

# GUI-only dev-deps for the `fhr_sim_v1` example. These are Android-hostile:
# egui/eframe pull in `ring` (via ureq/rustls), which needs a C compiler the
# Android target has no toolchain for here. The example itself is gated off
# Android (item-level `cfg(not(target_os = "android"))`), so these deps must be
# absent from the Android dependency graph too.
# Also off wasm: this block is the egui/eframe (or wgpu) example stack, and
# wgpu-hal is not Sync on wasm. Dev-dependencies apply to TESTS as well as
# examples, so without this gate `cargo test --target wasm32-wasip1` cannot
# build even a test that touches none of it. The --lib compile gate in
# scripts/check-wasm.sh is blind to this class of problem. Bead op-okqo.7.
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dev-dependencies]
egui.workspace = true
eframe.workspace = true
egui_plot.workspace = true
egui_extras.workspace = true




[[example]]
name = "fhr_sim_v1"
path = "examples/fhr_sim_v1/main.rs"
