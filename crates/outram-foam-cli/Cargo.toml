[package]
name = "outram-foam-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "OpenFOAM-style command-line utilities (blockMesh, pimpleFoam, gen-foam, ...) as terminal binaries -- an independent OUTRAM PARK fork, not the official OpenFOAM software"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
exclude = ["verification_and_validation/*.csv", "docs"]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 2
topic = "thermal-hydraulics"
fidelity = 3
maturity = 1

[dependencies]
thiserror.workspace = true
uom.workspace = true
clap.workspace = true
outram-foam-basic-lib.workspace = true
outram-foam-mesh.workspace = true
outram-foam-appbuilder-lib.workspace = true

[dev-dependencies]
# Code-to-code verification only (tests/mechanics_code_to_code.rs, bead
# op-cdte): the OFFBEAT small-strain mechanics solver is run alongside the
# GeN-Foam one on a mesh this crate's own `blockMesh` tool writes. The CLI
# binaries do not link OFFBEAT.
outram-park-fork-offbeat.workspace = true

[lib]
name = "outram_foam_cli"
path = "src/lib.rs"

# One binary per OpenFOAM tool, named exactly like upstream so `blockMesh`,
# `pimpleFoam`, `gen-foam`, ... run as terminal commands.
[[bin]]
name = "blockMesh"
path = "src/bin/block_mesh.rs"

[[bin]]
name = "ideasUnvToFoam"
path = "src/bin/ideas_unv_to_foam.rs"

[[bin]]
name = "polyDualMesh"
path = "src/bin/poly_dual_mesh.rs"

[[bin]]
name = "pimpleFoam"
path = "src/bin/pimple_foam.rs"

[[bin]]
name = "rhoCentralFoam"
path = "src/bin/rho_central_foam.rs"

[[bin]]
name = "rhoPimpleFoam"
path = "src/bin/rho_pimple_foam.rs"

[[bin]]
name = "sonicFoam"
path = "src/bin/sonic_foam.rs"

[[bin]]
name = "gen-foam"
path = "src/bin/gen_foam.rs"
