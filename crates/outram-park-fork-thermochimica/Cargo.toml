[package]
name = "outram-park-fork-thermochimica"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Independent pure-Rust fork/translation of ORNL Thermochimica (BSD-3) — molten-salt Gibbs-energy-minimisation thermochemistry (fission-product speciation, redox, solubility) for the MSRE digital twin. SCAFFOLD: no human V&V. Not affiliated with ORNL or the Thermochimica project."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# docs/ and the upstream reference clone are repo-only provenance aids, never
# shipped in the packaged crate. upstream_source/README.md (the provenance
# record) is intentionally NOT excluded so it stays in the package.
exclude = ["docs", "upstream_source/thermochimica"]

[dependencies]
uom.workspace = true
thiserror.workspace = true

