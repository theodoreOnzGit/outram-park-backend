[package]
name = "nee_soon"
version = "0.0.5"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Neutron Energy-dependent Simulation using Open-source Object-Oriented Numerics — the coupling layer that composes njoy-outram-park-fork (nuclear data), outram-mc-libs (Monte Carlo transport) and teh-o-prke (point reactor kinetics) behind one object-oriented API"
homepage.workspace = true
repository.workspace = true
categories.workspace = true
# The V&V records (verification_and_validation/: CSVs, plots, scripts) are
# not shipped in the packaged crate: nothing reads them at build time, and
# they took the package from 73 kB to 7.4 MiB (maintainer, 2026-10-07). They
# stay in the repository.
exclude = ["docs", "verification_and_validation"]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 3
topic = "neutronics"
fidelity = 4
maturity = 2
backronym = "NEutron Energy-dependent Simulation using Open-source Object-Oriented Numerics"

[features]
default = ["long-tests"]
# Tests over five minutes, or that need the reference nuclear data, are
# gated behind this feature, on by default
# (docs/claude-md/long-tests-and-ci.md). Added 2026-10-13 (gh:#849).
long-tests = []

[dependencies]
# Every transcendental routes through PETIR for cross-platform bit identity
# (gh:#985). petir is no_std, so this edge adds nothing Android- or wasm-hostile.
petir = { workspace = true }
# Integration targets — the crates NEE_SOON composes and re-exposes. Declared
# here so the coupling surface is wired even though the scaffold does not yet
# call into them.
njoy-outram-park-fork = { workspace = true }   # nuclear data / cross sections
outram-mc-libs           = { workspace = true }   # Monte Carlo transport
teh-o-prke            = { workspace = true }   # point reactor kinetics (PRKE)
# GeN-Foam SP3 neutronics + porous-media TH + multi_region coupling. Used by the
# Xin Wang SP3 workflow scaffold (src/xin_wang_sp3_workflow/). The SP3 solver
# port is in progress in a parallel session; the scaffold codes against its
# intended NeutronicsModel::Sp3 / Sp3Neutronics interface (see op-fr2.2.4).
outram-foam-appbuilder-lib = { workspace = true }   # GeN-Foam SP3 multiphysics host
outram-foam-basic-lib      = { workspace = true }   # FvMesh / fields, for the GeN-Foam bridge
# Geometry authoring: `blender_bridge` (surface mesh -> outram-mc CSG) and the
# `sim` run driver moved here from outram-blender's retired `mc-export` feature
# (GitHub #486, 2026-10-02). The edge runs coupler -> blender, never back.
outram-blender        = { workspace = true }
# HTR-10 coupled thermal-hydraulic transients (`htr10_th_transient`, gh:#1151):
# the tampines primary loop and its core models, with the point kinetics here
# (maintainer, 2026-11-03: "any neutronics and TH shld live in nee soon").
# No cycle: tampines has nee_soon only as a target-gated dev-dependency.
tampines              = { workspace = true }

# Public API primitives — dimensioned quantities and error types for the
# object-oriented surface.
uom                   = { workspace = true }
thiserror             = { workspace = true }
# Saved MGXS case records (`htr10_mgxs`): the library and run metadata as JSON,
# so an expensive Monte Carlo run is reloaded rather than repeated.
serde                 = { workspace = true }
serde_json            = { workspace = true }

[dev-dependencies]
# Steam states of the helical-coil SG test in `htr10_th_transient` (moved
# from tampines, gh:#1151). Pure Rust; Android- and wasm-clean.
tampines-steam-tables = { workspace = true }
# Also used by the fhr_sim_v2 example (steam tables, turbine generator).

# The fhr_sim_v2 GUI example, MOVED 2026-11-05 from
# `crates/tampines/examples/fhr_sim_v2/` (maintainer: "nee_soon depends on
# tampines, never the reverse"; the tampines dev-dependency on nee_soon was a
# publish-time cycle). Its dependencies came with it from tampines' gated
# block: TUAS for the loop components, ndarray, and the GUI stack. teh-o-prke,
# serde and outram-foam-basic-lib are already real dependencies above, and the
# example reaches this crate as `nee_soon::...` (no self dev-dependency).
# `local-ip-address`, listed for it in tampines, is not used by the example and
# was dropped.
#
# The egui/eframe stack is Android-hostile and eframe pulls wgpu, whose HAL is
# not Sync on wasm, so the block is gated off both (dev-dependencies apply to
# tests too). The example carries `#![cfg(not(target_os = "android"))]`.
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dev-dependencies]
tuas_boussinesq_solver.workspace = true
ndarray.workspace = true
egui.workspace = true
bugis.workspace = true
eframe.workspace = true
env_logger.workspace = true
egui_plot.workspace = true
egui_extras.workspace = true

# MOVED 2026-11-05 from tampines (see the dev-dependency block above).
[[example]]
name = "fhr_sim_v2"
path = "examples/fhr_sim_v2/main.rs"
