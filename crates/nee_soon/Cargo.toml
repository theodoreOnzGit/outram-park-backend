[package]
name = "nee_soon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Neutron Energy-dependent Simulation using Open-source Object-Oriented Numerics — the coupling layer that composes njoy-outram-park-fork (nuclear data), openmc-libs (Monte Carlo transport) and teh-o-prke (point reactor kinetics) behind one object-oriented API"
homepage.workspace = true
repository.workspace = true
categories.workspace = true

[dependencies]
# Integration targets — the crates NEE_SOON composes and re-exposes. Declared
# here so the coupling surface is wired even though the scaffold does not yet
# call into them.
njoy-outram-park-fork = { workspace = true }   # nuclear data / cross sections
openmc-libs           = { workspace = true }   # Monte Carlo transport
teh-o-prke            = { workspace = true }   # point reactor kinetics (PRKE)

# Public API primitives — dimensioned quantities and error types for the
# object-oriented surface.
uom                   = { workspace = true }
thiserror             = { workspace = true }
