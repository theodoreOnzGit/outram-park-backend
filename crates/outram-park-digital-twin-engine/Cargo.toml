[package]
name = "outram-park-digital-twin-engine"
version = "0.0.2"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable visualization framework for OUTRAM PARK digital twins -- visual process objects whose rendering derives directly from physics state"
homepage.workspace = true
repository.workspace = true
categories.workspace = true

[dependencies]
# Physics backends this framework visualizes. Real (non-dev) dependencies --
# unlike tampines, this crate's whole purpose is presentation, so it makes no
# Android-portability claim and GUI deps are not confined to examples/.
tampines.workspace = true
nee_soon.workspace = true
chem-eng-real-time-process-control-simulator.workspace = true

# REAL (non-dev) dependency: `components::TurbineVisual` renders
# `tampines_steam_tables::steam_turbine_equations::generator::
# ThreePhaseElectricGeneratorTurbine`, whose torque-balance angular velocity
# drives the blade animation. That is library code, not an example, so it
# cannot be a dev-dependency. No new weight in the tree -- `tampines` already
# depends on this crate transitively.
tampines-steam-tables.workspace = true

# TUAS is a REAL (non-dev) dependency because the CIET Educational Simulator v2
# is a `[[bin]]`, and Cargo does not make dev-dependencies available to binary
# targets (only to tests/examples/benches). TUAS's own library is pure Rust
# (approx/csv/ndarray/peroxide/roots/thiserror/uom -- no BLAS, no ndarray-linalg),
# so promoting it here does not endanger the Android build.
#
# NOTE: the crate LIBRARY does not use TUAS at all -- per this crate's CLAUDE.md
# ("no new physics in this crate's library"), all CIET physics lives in the
# binary's own module tree under src/bin/ciet_educational_simulator_v2/.
tuas_boussinesq_solver.workspace = true

# Public API primitives -- dimensioned quantities.
uom.workspace = true

# REAL (non-dev) dependency: `components::HeatExchangerVisual` draws the flow
# arrangement that `tampines::components::HeatExchanger` actually stores, and
# that field's type (`heat_exchanger::lmtd::FlowArrangement`) lives in this
# crate -- tampines does not re-export it. The widget must be able to name the
# type to map it onto `HeatExchangerKind`; without it the physics-backed path
# could only guess an arrangement, which is exactly the kind of fabrication
# this library forbids. Pure Rust (thiserror/ndarray/uom/roots/zip with only
# `deflate`), so promoting it does not endanger the Android build. The
# examples (htgr_sim_v1's schematic, widget_studio's heat-exchanger tab) reach
# it through this entry, so it is no longer declared as a dev-dependency.
outram-park-fork-dwsim-libs.workspace = true

# OPC-UA (IEC 62541) interface layer for the CIET Educational Simulator v2.
# Pure Rust (RustCrypto, not openssl-sys), so this stays Android/Termux-clean
# and needs NO target gate -- the `ciet_opcua` library module builds everywhere,
# including headless on Termux. `server` for the simulator, `client` for the
# bundled demo client binary.
#
# SCOPE (RESPONSIBLE_USE.md): an OFFLINE demonstration interface only. Never to
# be connected to live operational systems, plant systems, safety-critical
# infrastructure, or institutional production systems.
async-opcua = { workspace = true, features = ["server", "client"] }
tokio.workspace = true
# Cooperative mDNS/DNS-SD announce + browse, so the simulator can be found on a
# local network without anyone scanning it. See the root Cargo.toml note.
mdns-sd.workspace = true
# `~/.outram-park` (Linux/Termux) / `%APPDATA%\outram-park` (Windows) discovery
# for the OPC-UA PKI directory.
directories.workspace = true
# Reports the machine's own LAN address so the UI can print a connect URL that
# other devices on the same network can actually reach.
local-ip-address.workspace = true
# Error enums for the OPC-UA server/discovery layer.
thiserror.workspace = true

# `RUST_LOG=debug` logging for the CIET v2 binary (v1 called `env_logger::init()`
# and this keeps that). A REAL dependency, not a dev-dependency, because Cargo
# does not make dev-dependencies available to [[bin]] targets. Pure Rust, so it
# does not endanger the Android/Termux build; the headless path uses it too.
env_logger.workspace = true

# GUI stack. Android-hostile -- `eframe` pulls in `android-activity`, which
# fails to compile as a plain library dependency (it expects the NativeActivity
# glue), and the whole windowing stack is out of scope for Android per the
# workspace Android-portability rule. Confined to non-Android targets so the
# library's visual-component modules (which are gated to match in `lib.rs`)
# drop out on Android and the crate still `cargo check`s there. Desktop builds
# are unchanged.
[target.'cfg(not(target_os = "android"))'.dependencies]
egui.workspace = true
eframe.workspace = true
egui_plot.workspace = true
egui_extras.workspace = true

# Dev-dependencies for the migrated fhr_sim_v2 simulator example. These are the
# physics/support crates the example imports directly that are not already real
# deps above (tampines, nee_soon, egui, egui_plot, uom, chem-eng are). All
# inherit versions from the root [workspace.dependencies].
#
# NOTE: ndarray-linalg is deliberately NOT a dependency. The secondary-loop mass
# balance solve now uses outram-foam-basic-lib's pure-Rust dense LU `SquareMatrix`
# (an OpenFOAM port) instead of a BLAS/LAPACK linear solver.
[dev-dependencies]
teh-o-prke.workspace = true
# tampines-steam-tables is now a REAL dependency above (TurbineVisual renders
# its generator model from the library, and libraries cannot see dev-deps); it
# stays usable from examples/tests either way.
# tuas_boussinesq_solver is now a REAL dependency above (the CIET v2 binary needs
# it and bins cannot see dev-deps); it stays usable from examples/tests either way.
roots.workspace = true
ndarray.workspace = true
outram-foam-basic-lib.workspace = true
serde.workspace = true
# env_logger is now a REAL dependency above (the CIET v2 [[bin]] needs it and
# bins cannot see dev-deps); it stays usable from the examples either way.
# outram-park-fork-dwsim-libs is now a REAL dependency above (the library's
# HeatExchangerVisual names FlowArrangement, and libraries cannot see
# dev-deps); it stays usable from the examples either way. htgr_sim_v1's
# schematic still constructs tampines equipment wrappers (HeatExchanger,
# SteamGenerator, Pump, Valve) whose constructor argument enums
# (FlowArrangement / PumpSpecification / OpeningCharacteristic /
# ValveFlowCoefficient) live in that crate; tampines does not re-export them.
# htgr_sim_v1's helium primary loop evaluates real, temperature-dependent
# helium properties (c_p, density) via `state_pt`. tampines re-exports the
# `Fluid` selector (`tampines::fluids::TampinesFluid`) but not the property
# flashes themselves, so the example reaches the backend directly -- same
# precedent as outram-park-fork-dwsim-libs above. Promoting a property
# accessor into tampines is the tidier long-term home.
outram-park-fork-coolprop.workspace = true

# Widget Studio -- the gallery app for developing and quality-controlling the
# visual component library one widget at a time (bead op-wqk.14). Not a
# simulator: it drives a single widget across its full state range with live
# controls so the widget's look, feel and physics coupling can be judged.
[[example]]
name = "widget_studio"
path = "examples/widget_studio/main.rs"

[[example]]
name = "fhr_sim_v2"
path = "examples/fhr_sim_v2/main.rs"

[[example]]
name = "htgr_sim_v1"
path = "examples/htgr_sim_v1/main.rs"

[[example]]
name = "distillation_sim_v1"
path = "examples/distillation_sim_v1/main.rs"

# CIET Educational Simulator v2 -- the simulator itself (physics + egui GUI +
# embedded OPC-UA server). A [[bin]], not an example, so `cargo install` /
# `cargo run --bin` reach it directly. Its physics model lives in the binary's
# own module tree, keeping new physics out of the crate library per this crate's
# CLAUDE.md.
[[bin]]
name = "ciet_educational_simulator_v2"
path = "src/bin/ciet_educational_simulator_v2/main.rs"

# The bundled OPC-UA demo *client* -- a small egui app that discovers CIET v2
# instances on the local network over mDNS, connects, reads the live outputs and
# writes the controls. Offline demonstration tooling only.
[[bin]]
name = "ciet_v2_opcua_client"
path = "src/bin/ciet_v2_opcua_client/main.rs"

