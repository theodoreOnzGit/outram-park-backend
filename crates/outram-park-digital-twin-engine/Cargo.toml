# through bugis's own wasm32 table.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
bugis = { workspace = true, features = ["web_demo"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = { workspace = true }
# The browser demos' Web Worker plumbing (htgr_sim_v1 on the web, gh:#986).
# Example-only: the library has no browser face, and a consumer of the crate
# pays nothing for these.
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
log = { workspace = true }
# The mobile-first layer of every OUTRAM PARK browser demo: the side panel
# that folds (opens folded under 700 px) and its "Controls »" button. Reused,
# not copied, per dhoby-ghaut's CLAUDE.md ("Build on it; do not copy").
# wasm32-ONLY on purpose: on wasm dhoby-ghaut is egui + petir, its heavy stack
# (kovan, nee_soon, NJOY, outram-mc-libs, the foam crates) being gated
# not(wasm32) in its own Cargo.toml, so this costs the native build and the
# 290 native htgr tests nothing. No cycle: dhoby-ghaut does not depend on this
# crate. Licence: both are AGPL-3.0-only, so nothing is inherited that this
# crate does not already carry.
# A PATH dependency, not `workspace = true`: dhoby-ghaut is deliberately kept
# out of the root [workspace.dependencies] (as kovan is) so no crate picks it
# up by accident, and this follows that boundary rather than widening it.
dhoby-ghaut = { path = "../dhoby-ghaut" }
web-sys = { workspace = true, features = [
  "Window", "Document", "Element", "HtmlCanvasElement",
  "Worker", "WorkerOptions", "WorkerType", "WorkerGlobalScope",
  "DedicatedWorkerGlobalScope", "MessageEvent", "Performance",
  # fukushima_web / double_pipe_twin_web (moved from dhoby-ghaut 2026-11-05).
  "ErrorEvent",
] }

# ── The OPC-UA / mDNS / filesystem stack: everywhere EXCEPT wasm ─────────────
# None of this can work in a browser: async-opcua and tokio want sockets,
# mdns-sd wants multicast UDP, directories wants XDG/AppData paths, and
# local-ip-address wants a network interface list. async-opcua additionally
# drags in getrandom 0.2 and uuid, whose wasm builds each need their own "js"
# feature — a good illustration that satisfying a transitive wasm requirement is
# usually worse than not pulling the dependency in the first place.
#
# These stay UNGATED for Android: async-opcua was verified building for
# aarch64-linux-android on 2026-07-28 (see the root Cargo.toml note), and a
# headless server is Android-in-scope. The gate is wasm-only.
#
# The modules that use them (ciet_opcua, opcua_core) are gated to match in
# lib.rs. Beads op-okqo.3 and op-eeqw.2 (GH #39 Phase 1).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-opcua = { workspace = true, features = ["server", "client"] }
tokio.workspace = true
mdns-sd.workspace = true
directories.workspace = true
local-ip-address.workspace = true
env_logger.workspace = true

[features]
default = ["long-tests"]
# Tests that take minutes rather than seconds, ON BY DEFAULT (workspace
# `long-tests` rule, docs/claude-md/long-tests-and-ci.md): presently the
# double-pipe co-kriging held-out report (gh:#1190), measured at 19 min on
# 2026-11-04. `--no-default-features` skips it for the edit-compile loop.
long-tests = []
