#
#   cargo run -p outram-park-digital-twin-engine --example double_pipe_twin_web --release [-- --headless]
[[example]]
name = "double_pipe_twin_web"
path = "examples/double_pipe_twin_web/main.rs"

# The web-demo framework the two demos above are built on (side panel, view,
# zoom buttons, worker link), from bugis's `web_demo` feature (it is what
# `dhoby_ghaut::web_demo` re-exports). Example-only; off Android, where the
