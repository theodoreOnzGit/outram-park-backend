[package]
name = "outram-park-digital-twin-engine"
version = "0.0.4"
authors.workspace = true
edition.workspace = true
license.workspace = true
# `docs/` is repo-only: the rustdoc->markdown API mirror and the V&V
# write-ups. Excluded so it never ships to crates.io (size, and it is
# not part of the published API surface).
exclude = ["docs"]
description = "Reusable visualization framework for OUTRAM PARK digital twins -- visual process objects whose rendering derives directly from physics state"
homepage.workspace = true
repository.workspace = true
categories.workspace = true

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 4
topic = "app"
fidelity = [0, 1]
maturity = 1

[dependencies]
# Every transcendental routes through PETIR for cross-platform bit identity
# (gh:#985). petir is no_std, so this edge adds nothing Android- or wasm-hostile.
petir = { workspace = true }
# Physics backends this framework visualizes. Real (non-dev) dependencies --
# unlike tampines, this crate's whole purpose is presentation, so it makes no
# Android-portability claim and GUI deps are not confined to examples/.
tampines.workspace = true
nee_soon.workspace = true
# teh-o-prke: see the single entry below (shared by `msre::model`, gh:#1330,
# which steps `zero_power_prke::circulating::CirculatingPointKinetics`, and
# `ebr2::model`, gh:#1331).

# REAL (non-dev) dependencies on the Monte Carlo stack, by maintainer direction
# (2026-09-29: "digital twin engine can use outram-mc-libs/nee-soon as a
# dependency ... so no dev there"). Both are already compiled beneath `nee_soon`,
# so this adds no build work. First consumer: the HIGH-tier Godiva case in
# `tests/ci_smoke/` (GitHub #415). `njoy-outram-park-fork` is named directly only
# for `reference_data::reference_endf`, which `outram-mc-libs` does not re-export.
outram-mc-libs.workspace = true
njoy-outram-park-fork.workspace = true
chem-eng-real-time-process-control-simulator.workspace = true

# REAL (non-dev) dependency: `components::TurbineVisual` renders
# `tampines_steam_tables::steam_turbine_equations::generator::
# ThreePhaseElectricGeneratorTurbine`, whose torque-balance angular velocity
# drives the blade animation. That is library code, not an example, so it
# cannot be a dev-dependency. No new weight in the tree -- `tampines` already
# depends on this crate transitively.
# ~~NOTE 2026-11-02 (gh:#1112): `TurbineVisual` moved to `bugis::components`
# (feature `widgets`, which now carries this edge for the library). Kept here
# because the examples and binaries name the crate directly.~~
# CORRECTED 2026-11-05 (maintainer: "bugis should be standalone"): the
# physics half of `TurbineVisual` is back in this crate's `components`, so
# this entry carries the library edge again.
tampines-steam-tables.workspace = true

# TUAS is a REAL (non-dev) dependency because the CIET Educational Simulator v2
# is a `[[bin]]`, and Cargo does not make dev-dependencies available to binary
# targets (only to tests/examples/benches). TUAS's own library is pure Rust
# (approx/csv/ndarray/peroxide/roots/thiserror/uom -- no BLAS, no ndarray-linalg),
# so promoting it here does not endanger the Android build.
#
# ~~NOTE: the crate LIBRARY does not use TUAS at all -- per this crate's CLAUDE.md
# ("no new physics in this crate's library"), all CIET physics lives in the
# binary's own module tree under src/bin/ciet_educational_simulator_v2/.~~
# CORRECTED 2026-11-10 (gh:#1331): the library does use TUAS. `multifidelity::
# double_pipe` runs the TUAS 1-D exchanger (gh:#1178), and `ebr2::model` takes
# its sodium properties and liquid-metal Nusselt correlations from TUAS. The
# CIET physics itself still lives under src/bin/ciet_educational_simulator_v2/.
tuas_boussinesq_solver.workspace = true

# REAL (non-dev) dependency since 2026-11-10 (gh:#1331): `ebr2::model` runs
# six-group point kinetics, the fast-reactor feedback set
# (`feedback_mechanisms::fast_reactor`) and fission-product decay heat from
# this crate. No cycle: teh-o-prke depends on petir, approx, ndarray,
# thiserror, uom and chem-eng-real-time-process-control-simulator only
# (checked in its Cargo.toml, 2026-11-10), and builds for wasm32. Was a
# dev-dependency (htgr_sim_v1's kinetics); the entry below is removed.
teh-o-prke.workspace = true

# Public API primitives -- dimensioned quantities.
uom.workspace = true

# REAL (non-dev) dependencies for `multifidelity::double_pipe` (gh:#1178, rung 1
# of the HF -> LF epic gh:#1177): the closure-extraction step runs the
# double-pipe conjugate-heat-transfer CFD (`outram_foam_appbuilder_lib::cases::
# double_pipe`) on meshes from `outram_foam_mesh::block_primitives::DoublePipe`,
# and the TUAS 1-D exchanger (above) at the same design points. No cycle:
# neither crate depends on this one (checked in their Cargo.toml, 2026-11-03).
# Both are pure Rust and already build for wasm32 (Foam Studio runs them in the
# browser); the library's Android build is gh:#239's, unchanged by this.
#
# `outram-foam-appbuilder-lib` was a dev-dependency (htgr_sim_v1's genfoam
# placeholder); it moved here.
outram-foam-appbuilder-lib.workspace = true
outram-foam-mesh.workspace = true
# Names `FvMesh` for the meshes above (was a dev-dependency, below).
outram-foam-basic-lib.workspace = true

# REAL (non-dev) dependency for `multifidelity::double_pipe::fidelity`
# (gh:#1194): the double-pipe pair implements `raffles::fidelity`'s traits
# (`ParametricModel`, `Quantities` via `raffles::quantities!`) and builds its
# `Dataset`. No cycle: raffles depends only on thiserror, petir, uom, xml-rs
# and optional burn (checked in its Cargo.toml, 2026-11-04), and it was already
# in this crate's tree through `tampines -> raffles`, so it adds no build work.
raffles.workspace = true

# The central GUI crate (gh:#1112). Untargeted, unlike the egui stack below,
# because `animation` (re-exported from `bugis::animation`) is this crate's
# Android-building module; `animation` is egui-free and pulls only uom, and
# `ascii` (re-exported from `bugis::ascii`) is std only.
bugis = { workspace = true, features = ["animation", "ascii"] }

# app_scaffold::csv_logging's CsvLogger writes real CSV files (bead
# op-wqk.22.2) -- pulling in the `csv` crate instead of hand comma-joining
# strings the way the existing "fake CSV" display panels in
# ciet_educational_simulator_v2/fhr_sim_v2 do, so a value containing a comma
# or a quote round-trips correctly. Already a workspace dependency (root
# Cargo.toml, consumed today by tuas_boussinesq_solver) -- no new version
# introduced. Pure Rust, so this does not endanger the Android/Termux build
# posture of the modules that are gated to build there.
# NOTE 2026-11-02 (gh:#1112): `app_scaffold` moved to `bugis` (whose
# `app_scaffold` feature now carries `csv` for it); the entry stays because
# `htgr_sim_v1`'s tests read CSV back with it.
csv.workspace = true

# REAL (non-dev) dependency: `components::HeatExchangerVisual` draws the flow
# arrangement that `tampines::components::HeatExchanger` actually stores, and
# that field's type (`heat_exchanger::lmtd::FlowArrangement`) lives in this
# crate -- tampines does not re-export it. The widget must be able to name the
# type to map it onto `HeatExchangerKind`; without it the physics-backed path
# could only guess an arrangement, which is exactly the kind of fabrication
# this library forbids. Pure Rust (thiserror/ndarray/uom/zip with only
# `deflate`, and petir, which replaced `roots` there on 2026-10-20, gh:#991),
# so promoting it does not endanger the Android build. The
# examples (htgr_sim_v1's schematic, widget_studio's heat-exchanger tab) reach
# it through this entry, so it is no longer declared as a dev-dependency.
# ~~NOTE 2026-11-02 (gh:#1112): `HeatExchangerVisual` moved to
# `bugis::components` (feature `widgets` carries this edge for the library);
# the entry stays for the examples named above.~~
# CORRECTED 2026-11-05 (maintainer: "bugis should be standalone"): the
# physics half of `HeatExchangerVisual` (and `HeatExchangerKindArrangement`) is
# back in this crate's `components`, so this edge is the library's again.
outram-park-fork-dwsim-libs.workspace = true

# OPC-UA (IEC 62541) interface layer for the CIET Educational Simulator v2.
# Pure Rust (RustCrypto, not openssl-sys), so this stays Android/Termux-clean
# and needs NO target gate -- the `ciet_opcua` library module builds everywhere,
# including headless on Termux. `server` for the simulator, `client` for the
# bundled demo client binary.
#
# SCOPE (RESPONSIBLE_USE.md): an OFFLINE demonstration interface only. Never to
# be connected to live operational systems, plant systems, safety-critical
# infrastructure, or institutional production systems.
# Cooperative mDNS/DNS-SD announce + browse, so the simulator can be found on a
# local network without anyone scanning it. See the root Cargo.toml note.
# `~/.outram-park` (Linux/Termux) / `%APPDATA%\outram-park` (Windows) discovery
# for the OPC-UA PKI directory.
# Reports the machine's own LAN address so the UI can print a connect URL that
# other devices on the same network can actually reach.
# Error enums for the OPC-UA server/discovery layer.
thiserror.workspace = true

# `RUST_LOG=debug` logging for the CIET v2 binary (v1 called `env_logger::init()`
# and this keeps that). A REAL dependency, not a dev-dependency, because Cargo
# does not make dev-dependencies available to [[bin]] targets. Pure Rust, so it
# does not endanger the Android/Termux build; the headless path uses it too.

# GUI stack. Android-hostile -- `eframe` pulls in `android-activity`, which
# fails to compile as a plain library dependency (it expects the NativeActivity
# glue), and the whole windowing stack is out of scope for Android per the
# workspace Android-portability rule. Confined to non-Android targets so the
# library's visual-component modules (which are gated to match in `lib.rs`)
# drop out on Android and the crate still `cargo check`s there. Desktop builds
# are unchanged.
[target.'cfg(not(target_os = "android"))'.dependencies]
# The GUI frame timer needs a clock that exists in a browser; see the root
# Cargo.toml's note on `web-time`.
web-time.workspace = true
egui.workspace = true
# `widgets`: the widget ART, re-exported by `components` (gh:#1112).
# CORRECTED 2026-11-05 (maintainer: "widget art can live in bugis, the
# combination of logic and art can live inside the digital twin engine"): the
# widgets that hold physics state (`PipeVisual`, `CondenserVisual`, ...) live
# in this crate's `src/components/` and draw through the bugis art; bugis's
# `widgets` feature no longer pulls any physics crate.
# `app_scaffold`: re-exported as `app_scaffold`.
bugis = { workspace = true, features = ["widgets", "app_scaffold"] }
eframe.workspace = true
egui_plot.workspace = true
egui_extras.workspace = true

# Dev-dependencies for the migrated fhr_sim_v2 simulator example. These are the
# physics/support crates the example imports directly that are not already real
# deps above (tampines, nee_soon, egui, egui_plot, uom, chem-eng are). All
# inherit versions from the root [workspace.dependencies].
#
# NOTE: ndarray-linalg is deliberately NOT a dependency. The secondary-loop mass
# balance solve now uses outram-foam-basic-lib's pure-Rust dense LU `SquareMatrix`
# (an OpenFOAM port) instead of a BLAS/LAPACK linear solver.
[dev-dependencies]
# `tests/ci_smoke/edwards.rs` (GitHub #415) names `SlipModel`. The crate is
# already compiled beneath `tampines`, so this adds no build work.
outram-foam-multiphase.workspace = true
# teh-o-prke is a REAL dependency above since 2026-11-10: `ebr2::model`
# (gh:#1331) and `msre::model` (gh:#1330) both step kinetics from the
# library; it stays usable from the examples either way.
# tampines-steam-tables is now a REAL dependency above (TurbineVisual renders
# its generator model from the library, and libraries cannot see dev-deps); it
# stays usable from examples/tests either way.
# tuas_boussinesq_solver is now a REAL dependency above (the CIET v2 binary needs
# it and bins cannot see dev-deps); it stays usable from examples/tests either way.
ndarray.workspace = true
# outram-foam-basic-lib is now a REAL dependency above (gh:#1178).
serde.workspace = true
# env_logger is now a REAL dependency above (the CIET v2 [[bin]] needs it and
# bins cannot see dev-deps); it stays usable from the examples either way.
# outram-park-fork-dwsim-libs is now a REAL dependency above (the library's
# HeatExchangerVisual names FlowArrangement, and libraries cannot see
# dev-deps); it stays usable from the examples either way. htgr_sim_v1's
# schematic still constructs tampines equipment wrappers (HeatExchanger,
# SteamGenerator, Pump, Valve) whose constructor argument enums
# (FlowArrangement / PumpSpecification / OpeningCharacteristic /
# ValveFlowCoefficient) live in that crate; tampines does not re-export them.
# htgr_sim_v1's helium primary loop evaluates real, temperature-dependent
# helium properties (c_p, density) via `state_pt`. tampines re-exports the
# `Fluid` selector (`tampines::fluids::TampinesFluid`) but not the property
# flashes themselves, so the example reaches the backend directly -- same
# precedent as outram-park-fork-dwsim-libs above. Promoting a property
# accessor into tampines is the tidier long-term home.
outram-park-fork-coolprop.workspace = true

# htgr_sim_v1's TRISO fission-product release channel
# (`physics::fission_product_release`) drives `boon-lay`'s Rust fork of Idaho
# National Laboratory's TRISO-ATOPS off the resolved fuel-kernel temperature.
# A DEV-dependency, not a real one: only the example uses it, and this crate's
# own CLAUDE.md forbids new physics in the library. No new weight in the tree
# either -- `tampines` already depends on `boon-lay` (its `TrisoParticle`
# converts to and from that crate's `TrisoCell`), so this entry makes an
# existing transitive dependency nameable from the example rather than adding
# one. AGPL/GPL note: `boon-lay` is GPL-3.0 like this crate, and the TRISO-ATOPS
# fork inside it carries its upstream MIT notice, which is GPLv3-compatible.
boon-lay.workspace = true
# The reactor-building CV between the primary leak and the stack (gh:#400).
bishan.workspace = true

# htgr_sim_v1's fuel node (gh:#360, 2026-09-28) needs the heat capacity of the
# TRISO kernel and SiC coating: `outram-park-fork-offbeat`'s MATPRO UO2 and
# Snead SiC correlations, reused rather than re-entered. DEV-dependency for the
# same reason as `boon-lay`: example-only, and this crate's CLAUDE.md forbids
# new physics in the library. Pure Rust (uom, thiserror, outram-foam-basic-lib,
# which this crate already uses), so Android and wasm stay clean.
outram-park-fork-offbeat.workspace = true

# htgr_sim_v1's atmospheric dispersion channel
# (`physics::atmospheric_dispersion`) takes the TRISO release channel's
# circulating activity out of the primary circuit and downwind, using
# `changi`'s Gaussian puff model (a port of the R package `puff` 0.1.1) and its
# activity layer. DEV-dependency for the same reasons as `boon-lay` above:
# example-only, and this crate's CLAUDE.md forbids new physics in the library.
#
# SCOPE (RESPONSIBLE_USE.md, and `changi::activity`'s own binding scope limit):
# research, education and V&V only. Never for emergency planning, emergency
# response, dose assessment for real populations, or Level 3 PSA. ~~No dose
# quantity of any kind is computed.~~ CHANGED 2026-09-29: changi computes
# none; the map's INDICATIVE dose rate is buangkok's (see below).
#
# `gpu`: dispatches `changi::puff::wgsl::field_auto`'s WGSL kernel through
# PETIR's headless runner. htgr_sim_v1's Map tab evaluates the dispersion
# field once per screen pixel at 10 Hz -- 31.5 M kernel evaluations a frame at
# 512 cells. Measured 2026-09-25 (`cargo run --release -p changi --example
# field_timing --features gpu`, 16 cores, one adapter): 1.33 ms on the GPU
# against 19.6 ms pooled. Both fit the 100 ms physics tick on their own, but
# the plant step already spends ~96 ms of it, so only the GPU figure is small
# enough to leave real-time pacing alone at full resolution.
#
# The CPU path stays mandatory and is what runs when this host has no usable
# adapter: `outram-mc-libs/CLAUDE.md`'s GPU policy is a hard rule across this
# workspace (detection at run time, CI must never need a GPU), and
# `physics::atmospheric_dispersion::max_grid_cells` probes the adapter to pick
# a resolution the CPU path can also meet. Both paths compute the same field.
#
# Android/wasm are unaffected: `petir/wgpu`'s `wgpu` dependency is itself
# target-gated off both, so enabling this feature there activates nothing.
changi = { workspace = true, features = ["gpu"] }

# htgr_sim_v1's map "Dose rate" basis (maintainer direction 2026-09-29):
# `physics::dose_rate` turns the live air concentration and the dry deposit
# into an INDICATIVE effective dose rate through buangkok's pathway functions
# (`submersion_dose_rate_msv_per_s`, `ground_shine_dose_rate_msv_per_s`,
# `inhalation_committed_dose_rate_msv_per_s`) and buangkok's shipped EPA
# coefficients (FGR-15 2025, FGR-11). DEV-dependency, example-only, for the
# same reasons as changi above. Direction: buangkok -> changi, petir, uom;
# nothing depends on this crate, so no cycle. buangkok is pure Rust (petir is
# no_std), so Android and wasm stay clean.
# SCOPE: research/education only -- never a dose to any real person, never for
# emergency or regulatory use (RESPONSIBLE_USE.md, buangkok's CLAUDE.md).
# Also the map's optional steady Gaussian-plume overlay (gh:#470,
# `physics::steady_plume_overlay`): buangkok's pyDOSEIA single-plume master
# equation evaluated per grid cell.
buangkok = { workspace = true }

# htgr_sim_v1's map "Bounding air ingress" button (#453): the HTR-10 bounding
# air-ingress case (1400 C / 140 h, KORA f_ox from IAEA-TECDOC-978 Table 5-7,
# TRISO-ATOPS release with sembawang's venting, #446) and its LWR comparison
# (RG 1.183 per unit leak rate, WASH-1400 PWR 8), from
# `sembawang::lwr_comparison::bounding_comparison` -- the SAME function the
# #452 example calls, so the map cannot drift from it. DEV-dependency,
# example-only, like buangkok. Direction: sembawang -> boon-lay, changi,
# buangkok, uom (and outram-mc-libs since 2026-10-17, gh:#951, already a
# dependency here); nothing in sembawang depends on this crate, so no cycle.
sembawang = { workspace = true }

# outram-foam-appbuilder-lib is now a REAL dependency above (gh:#1178's
# `multifidelity::double_pipe` runs its double-pipe CFD from the library);
# htgr_sim_v1's `coarse_mesh_genfoam` placeholder keeps citing its `genfoam`
# module either way.

# Widget Studio -- the gallery app for developing and quality-controlling the
# visual component library one widget at a time (bead op-wqk.14). Not a
# simulator: it drives a single widget across its full state range with live
# controls so the widget's look, feel and physics coupling can be judged.
# gh:#1190: the TUAS 1-D low-fidelity grid for the double-pipe co-kriging
# (`multifidelity::double_pipe::lf_grid`), written to
# verification_and_validation/double_pipe_mfk_gh1190/lf_grid.csv.
[[example]]
name = "double_pipe_lf_grid"
path = "examples/double_pipe_lf_grid.rs"

[[example]]
name = "widget_studio"
path = "examples/widget_studio/main.rs"

[[example]]
name = "fhr_sim_v2"
path = "examples/fhr_sim_v2/main.rs"

[[example]]
name = "htgr_sim_v1"
path = "examples/htgr_sim_v1/main.rs"

[[example]]
name = "distillation_sim_v1"
path = "examples/distillation_sim_v1/main.rs"

# CIET Educational Simulator v2 -- the simulator itself (physics + egui GUI +
# embedded OPC-UA server). A [[bin]], not an example, so `cargo install` /
# `cargo run --bin` reach it directly. Its physics model lives in the binary's
# own module tree, keeping new physics out of the crate library per this crate's
# CLAUDE.md.
[[bin]]
name = "ciet_educational_simulator_v2"
path = "src/bin/ciet_educational_simulator_v2/main.rs"

# The bundled OPC-UA demo *client* -- a small egui app that discovers CIET v2
# instances on the local network over mDNS, connects, reads the live outputs and
# writes the controls. Offline demonstration tooling only.
[[bin]]
name = "ciet_v2_opcua_client"
path = "src/bin/ciet_v2_opcua_client/main.rs"

# CIET Educational Simulator v2 in the browser (gh:#924): the v2 physics
# stepper (`full_simulation::stepper`, included by path, so one copy of the
# physics) compiled to wasm and driven from a Web Worker by a plain-JS page
# (`web/ciet/`). Native builds carry its tests.
[[example]]
name = "ciet_web"
path = "examples/ciet_web/main.rs"

# The Fukushima Daiichi Unit 1 station-blackout demo (gh:#986): a GE BWR/3
# with isolation condensers in a Mark I containment, from the scram through
# core damage, hydrogen, venting and the reactor-building explosion. Built on
# `bugis::web_demo` and this crate's widgets; the plant (`sembawang::
# bwr_mark1`), core and containment step on three Web Workers
# (web/fukushima/, published at demos/fukushima/). AI draft, not validated.
# MOVED 2026-11-05 from dhoby-ghaut (maintainer: "if web examples live in
# dhoby ghaut, and this causes the dependency cycle, let the web examples
# deploy from digital twin engine instead"); it came there from the
# outram-park repository on 2026-10-27.
#
#   cargo run -p outram-park-digital-twin-engine --example fukushima_web --release [-- --headless 108000 600]
[[example]]
name = "fukushima_web"
path = "examples/fukushima_web/main.rs"

# The double-pipe high-fidelity -> low-fidelity twin (gh:#1182, rung 5 of
# epic gh:#1177): the TUAS 1-D double pipe evaluated live in a Web Worker
# (this crate's `one_d::ua`), beside the committed Kennedy-O'Hagan predictive
