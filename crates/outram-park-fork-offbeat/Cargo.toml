[package]
name = "outram-park-fork-offbeat"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Pure-Rust fork of OFFBEAT (foam-for-nuclear) — multi-dimensional nuclear fuel-performance: solid mechanics, rheology, fuel/cladding gap and contact, material property correlations, burnup and fission-gas release, on the OUTRAM-FOAM finite-volume substrate. SCAFFOLD/early: no human V&V. Independent OUTRAM PARK fork, not the official OFFBEAT."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# docs/ is the repo-only rustdoc mirror; never shipped in the packaged crate.
exclude = ["docs"]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: its order in that box,
# 1 = highest fidelity (longest crunch time, fewest assumptions).
[package.metadata.kovan]
row = 2
topic = "fuel-performance"
fidelity = 1

[dependencies]
# Pure-Rust, Android-safe deps only (no BLAS / C toolchain). `uom` types the
# physical API boundary; `thiserror` the crate error enum. The finite-volume
# framework (FvMesh, VolScalarField/VolSymmTensorField, fvc/fvm operators, the
# LDU matrix and Krylov solvers) is reused from the Layer-1-4 crate, which is
# pure-Rust throughout — so this crate stays Android/Termux-buildable.
uom.workspace = true
thiserror.workspace = true
outram-foam-basic-lib.workspace = true

[dev-dependencies]
approx.workspace = true

[lib]
name = "outram_park_fork_offbeat"
path = "src/lib.rs"
