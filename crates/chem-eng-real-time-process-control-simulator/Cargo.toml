[package]
name = "chem-eng-real-time-process-control-simulator"
version = "0.2.1"
authors.workspace = true
edition.workspace = true
# NOTE: relicensed from Apache-2.0 to GPL-3.0-only on 2026-08-11 by maintainer
# direction (sole copyright holder — see NOTICE). Versions <= 0.1.x already
# published to crates.io remain Apache-2.0. The crate now matches the workspace
# default, so it inherits the license from [workspace.package].
license.workspace = true
description = "Process Control Library (Chemical Engineering) with real time transfer function simulators"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
# V&V raw data (verification_and_validation/*.csv) is dev-only, gitignored,
# and never shipped in the packaged crate.
exclude = ["docs", "verification_and_validation/*.csv"]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 0
topic = "utility"
maturity = 2

[[package.metadata.kovan.maturity_modules]]
module = "alpha_nightly::stable_transfer_functions"
level = 4
why = "transfer functions verified against Scilab in the maintainer's PhD dissertation (maintainer, 2026-10-06)"

[[package.metadata.kovan.maturity_modules]]
module = "beta_testing::stable_transfer_functions"
level = 4
why = "transfer functions verified against Scilab in the maintainer's PhD dissertation (maintainer, 2026-10-06)"

[dependencies]
approx.workspace = true
csv.workspace = true
thiserror.workspace = true
uom.workspace = true

[[bin]]
name = "library_demo"
path = "src/main.rs"

[lib]
name = "chem_eng_real_time_process_control_simulator"
path = "src/lib/lib.rs"

# NOTE: the crate's original `[profile.release] opt-level = 2` and
# `[profile.dev.package."*"]` sections were moved to the workspace root
# Cargo.toml — Cargo only honors profiles defined on the root manifest.
