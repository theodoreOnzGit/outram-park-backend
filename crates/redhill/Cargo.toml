[package]
name = "redhill"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "REDHILL (Radionuclide Effluent Dispersion solver for Hydrogeological Infiltration and Leaching through Layers) — groundwater and geological transport of radionuclides after deposition. Placeholder: nothing is implemented."
homepage.workspace = true
repository.workspace = true
categories.workspace = true
# `docs/` is repo-only (the rustdoc->markdown API mirror and any V&V
# write-ups). Excluded so it never ships to crates.io.
exclude = ["docs"]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: its order in that box,
# 1 = highest fidelity (longest crunch time, fewest assumptions).
[package.metadata.kovan]
row = 2
topic = "risk"
fidelity = 5
maturity = "placeholder"

# NO DEPENDENCIES YET, deliberately.
#
# REDHILL is expected to build on `outram-park-fork-pflotran`, which already
# exists in this workspace -- but declaring that edge now would be an
# architectural claim made before any code exists to justify it, and an unused
# dependency is not free (it enters the lock file and every downstream build
# graph). Add it when something here actually calls into it.
[dependencies]
