# ---------------------------------------------------------------- 8b
# Who wrote the V&V case (maintainer, #769/#739, 2026-10-07). Pre-filled from
# git: the commits that added the tests reaching the function, read with
# `types::agent_trailer` (`wizard::vv_case_author_prefill`). Git can check
# only the writing; "verified by hand" is the reviewer's signed attestation.
# The engine refuses rung 4 when git shows an agent trailer on those commits.
[[question]]
key = "vv_case_author"
text = "Who wrote the V&V case?"
applies_when = "always"
workspace_rule = "Rung 4 is a V&V case written and verified by hand by a human, without AI agents; LSP/IDE tooling allowed (maintainer, #769/#739, 2026-10-07)"
prefill = "git_test_authorship"

[[question.option]]
key = "human_wrote_and_verified"
label = "A human wrote the V&V case and verified its result by hand, without AI agents (LSP/IDE tooling allowed)"
effect = "gate_rung4_author"

[[question.option]]
key = "agent_wrote_or_cowrote"
label = "An AI agent wrote or co-wrote it"
effect = "none"

[[question.option]]
key = "other"
label = "Other: ____"
effect = "none"
requires_text = true

