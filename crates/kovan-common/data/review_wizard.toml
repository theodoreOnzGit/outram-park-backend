# The kovan code-review wizard's question set (GitHub #769; wizard rules on
# #740, maintainer 2026-10-07). Read by `kovan_common::review::wizard`, which
# embeds this file with `include_str!` so desktop kovan, web-kovan (wasm) and
# CI ask the same questions and apply the same stamp gate.
#
# Keys are STABLE: they are written into review.md (`[review.checklist]`) and
# must never be renamed. Add a question or an option; never repurpose a key.
#
# applies_when: always | port | physical_interface
#   port               the folder's kovan.toml [upstream] table (or the
#                      wizard's "Is this a port?") declares the function a port
#   physical_interface a physical quantity crosses the function's interface
#
# effect (what choosing the option does to the stamp):
#   none              no effect
#   prompt_needs_fix  asks "Mark as Needs fix instead?"; the stamp is allowed
#   block             the stamp is refused
#   flag              recorded as "needs improvement"; never blocks
#   gate_rung4        V&V evidence of the qualifying kinds: one half of
#                     opening rung 4
#   gate_rung4_author the V&V case was written and verified by hand by a
#                     human, without AI agents: the other half. Rung 4 opens
#                     only with both (maintainer, #769/#739, 2026-10-07:
#                     "rung 4 = writing AND verifying a V&V case by hand").
#                     (~~gate_rung4 alone opens rung 4~~ CORRECTED 2026-10-07)
#   not_independent   the reviewer is not independent of the code: the stamp
#                     counts at rung 3 or 4 but cannot be ~~the independent
#                     second review for rung 5~~ (CORRECTED 2026-10-08, #809)
#                     rung 5's independent V&V case. (~~no_rung4: rung 4 is
#                     not available whatever else is answered~~ CORRECTED
#                     2026-10-07, maintainer on #769: independence gates
#                     rung 5, not rung 4.)
#   (~~needs_rung4_gate  choosing it is refused unless rung 4 is open~~
#    CORRECTED 2026-10-07, maintainer on #769: the user never chooses the
#    rung; it is derived from vv_evidence, vv_case_author and git, so the
#    `rung` question and this effect are gone. See `wizard::derived_rung`.)
#
# requires_text: the option must carry text of at least 2 characters
# (`Other: ____`, a justification). On disk the answer is `"<option>"`, or
# `"<option>: <text>"` for these options.
#
# Sources: ONLY the clauses recorded on #769 (research agent, 2026-10-07; every
# cited page was read). `document` is the kovan standard-corpus id
# (crates/kovan/src/corpus.rs), checked by kovan's tests/review_wizard_sources.rs.
# `quote` is filled only where #769 records quoted wording. A question or
# option that rests on a workspace rule names it in `workspace_rule` instead of
# a citation.
#
# Abbreviations on #769: BR = NUREG/BR-0167 (nureg-br-0167); DOEG = DOE G
# 414.1-4 (doe-g-414.1-4); STD = DOE-STD-1172-2003 (doe-std-1172-2003); KM =
# NUREG/KM-0006 (nureg-km-0006); AppB = 10 CFR 50 App. B (10cfr50).

version = 1

# ---------------------------------------------------------------- 1
[[question]]
key = "doc_matches_behaviour"
text = "Does the function do what its doc comment says it does?"
applies_when = "always"

[[question.option]]
key = "yes"
label = "Yes"
effect = "none"

[[question.option]]
key = "partly"
label = "Partly: some of the doc is wrong or out of date"
effect = "prompt_needs_fix"

[[question.option]]
key = "no"
label = "No"
effect = "block"

[[question.option]]
key = "no_doc"
label = "There is no doc comment"
effect = "prompt_needs_fix"

[[question.option]]
key = "other"
label = "Other: ____"
effect = "none"
requires_text = true

[[question.source]]
document = "nureg-br-0167"
section = "§4.5"
page = "13"

[[question.source]]
document = "nureg-br-0167"
section = "§3.2.2.5"
page = "10"

[[question.source]]
document = "doe-g-414.1-4"
section = "F.5.6, criterion 2"
page = "F-14"

# ---------------------------------------------------------------- 2
[[question]]
key = "upstream_fidelity"
text = "Does it do what the upstream routine does?"
applies_when = "port"
workspace_rule = "Debugging a port: read upstream first (HARD RULE)"

[[question.option]]
key = "matches"
label = "Yes, it matches upstream"
effect = "none"

[[question.option]]
key = "deviation_documented"
label = "It deviates, and the deviation is documented and justified in its doc comment"
effect = "none"

[[question.option]]
key = "deviation_not_documented"
label = "It deviates, and the deviation is not documented"
effect = "block"
action = "document_deviation"

[[question.option]]
key = "other"
label = "Other: ____"
effect = "none"
requires_text = true

[[question.source]]
document = "10cfr50"
section = "Appendix B, Criterion III"

[[question.source]]
document = "doe-g-414.1-4"
section = "§3.3.2"
page = "11"

[[question.source]]
document = "doe-g-414.1-4"
section = "§5.2.6"
page = "24-25"

# ---------------------------------------------------------------- 3
[[question]]
key = "limits_and_guards"
text = "Are the allowable input ranges guarded, and what happens outside them?"
applies_when = "always"
workspace_rule = "Error handling: Result is preferred to panics (maintainer, #740, 2026-10-07; not yet a CLAUDE.md rule)"

[[question.option]]
key = "guarded_returns_result"
label = "Guarded: out-of-range input returns a Result error (preferred)"
effect = "none"

[[question.option]]
key = "guarded_panics_justified"
label = "Guarded: out-of-range input panics, justified: ____"
effect = "none"
requires_text = true

[[question.option]]
key = "guard_present_range_undocumented"
label = "A guard is present, but the range is not documented"
effect = "prompt_needs_fix"

[[question.option]]
key = "guard_missing"
label = "A guard is missing"
effect = "block"

[[question.option]]
key = "no_limits"
label = "No limits apply, explained: ____"
effect = "none"
requires_text = true

[[question.option]]
key = "other"
label = "Other: ____"
effect = "none"
requires_text = true

[[question.source]]
document = "doe-g-414.1-4"
section = "F.5.6"
page = "F-14"
quote = "allowable input/output ranges"

[[question.source]]
document = "nureg-km-0006"
page = "64-65"

[[question.source]]
document = "nureg-br-0167"
section = "§3.2.4.1"
page = "11"

