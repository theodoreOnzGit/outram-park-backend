# ---------------------------------------------------------------- 10
# Pre-filled from git (commit author plus agent trailer); see
# `wizard::independence_prefill`.
#
# Rung 5 (GitHub #809, maintainer decisions 2026-10-08) is IV&V by an
# organisation "both technically and managerially separate from the
# organization responsible for developing the software" (NUREG/BR-0167
# §3.1 p. 6). ~~Answering someone_else made the stamp a candidate second
# review for rung 5~~ CORRECTED 2026-10-08: someone_else is now ONE of
# rung 5's conditions. The others are not wizard answers, because an answer
# would be an unsigned self-declaration of what the registry already
# records under signature: the reviewer's `[[reviewer.organisation]]`
# (maintainer-signed) must differ from the developing organisation
# (`[[code_review.developing_organisation]]`, maintainer-signed), and the
# review must name the reviewer's own signed `[[reviewer.separation]]`
# attestation (`[review] separation_attestation`), with a GitHub issue as
# its audit record; the review must also be a hand-written V&V case (rung
# 4). No organisation or attestation question is added: an always-asked new
# question would leave every existing stamp with an unanswered applicable
# question, which the gate re-run on read makes invalid. See
# `kovan_common::review::ivv`.
[[question]]
key = "independence"
text = "Who wrote this function? (Rung 5, independent V&V, also needs your organisation to be technically and managerially separate from the developing organisation, shown by your signed separation attestation.)"
applies_when = "always"
prefill = "git_authorship"

[[question.option]]
key = "someone_else"
label = "Someone else, or an AI agent"
effect = "none"

[[question.option]]
key = "self_check"
label = "I wrote it (self-check)"
effect = "not_independent"

# An unstated author cannot show independence, so it cannot be the
# independent review for rung 5 (~~cannot open rung 4~~ CORRECTED
# 2026-10-07).
[[question.option]]
key = "other"
label = "Other: ____"
effect = "not_independent"
requires_text = true

[[question.source]]
document = "10cfr50"
section = "Appendix B, Criterion III"

[[question.source]]
document = "doe-g-414.1-4"
section = "F.5.8, criterion 5"
page = "F-15"

[[question.source]]
document = "doe-std-1172-2003"
page = "8"

[[question.source]]
document = "nureg-km-0006"
section = "PCMM-3"

# Rung 5 as IV&V (GitHub #809, 2026-10-08), read from the standard-corpus PDF.
[[question.source]]
document = "nureg-br-0167"
section = "§3.1"
page = "6"
quote = "Independent verification and validation (IV&V) is verification and validation by an organization that is both technically and managerially separate from the organization responsible for developing the software."

