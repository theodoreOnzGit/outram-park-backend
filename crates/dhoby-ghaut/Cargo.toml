[package]
name = "dhoby-ghaut"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
# AGPL-3.0-only, NOT `license.workspace = true` (GPL-3.0-only): relicensed
# 2026-10-05 at the maintainer's direction (gh:#561/#562) so the workbench can
# depend on `kovan` (AGPL-3.0-only) as a library. See NOTICE in this directory.
license = "AGPL-3.0-only"
description = "Digital High-fidelity Orchestration by GUI for a Human-friendly Automated Unified Toolkit — DHOBY GHAUT, OUTRAM PARK's GUI home: the guided high-fidelity simulation workbench, the meshing and Monte Carlo studios, and the web-demo framework of the tutorial tracks."
homepage.workspace = true
repository.workspace = true
categories.workspace = true

# ---------------------------------------------------------------------------
# ~~The library itself has NO dependencies.~~ CORRECTED 2026-10-04 (gh:#521):
# the library now carries the web-demo framework (`src/web_demo/`), shared by
# every tutorial track's browser demo, so it depends on `egui` (off Android,
# with the rest of the windowing stack) and, on wasm32 only, on the
# wasm-bindgen family for the Web Worker plumbing. The studios and the demos
# themselves are still examples, carried by the dev-dependencies below.
# ---------------------------------------------------------------------------

# The workbench binary, `cargo run -p dhoby-ghaut --release` (gh:#561).
# Carries an Android/wasm stub `main`.
[[bin]]
name = "dhoby-ghaut"
path = "src/bin/dhoby-ghaut/main.rs"

[dependencies]

# `kovan`: the workbench's recipes (input decks) and every file it writes are
# kovan-compatible markdown + TOML artifacts, parsed by kovan's own artifact
# parser rather than a second one (maintainer, 2026-10-05, gh:#561/#562).
# AGPL-3.0-only -- which is why this crate is too (NOTICE). Declared here with
# a path, NOT in the root `[workspace.dependencies]`, so no other crate picks
# it up by accident (the boundary rule in `crates/kovan/NOTICE`).
# `default-features = false` drops kovan's own egui GUI binary stack.
# Gated off wasm32: kovan carries gix, directories and the kopitiam crates,
# none of which belong in the browser demos that build this library for wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kovan = { path = "../kovan", default-features = false }
# The recipe schema (`src/workbench/recipe.rs`): serde for the settings
# tables, toml to read/write them, uom for the quantities that leave it.
serde = { workspace = true }
toml = { workspace = true }
uom = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
egui = { workspace = true }

# The `dhoby-ghaut` BINARY (src/bin/dhoby-ghaut/): the guided high-fidelity
# workbench (gh:#561). Maintainer, 2026-10-05: "dhoby-ghaut is to be a
# binary". A binary cannot use dev-dependencies, so its stack is here, gated
# off Android (the windowing exemption) and off wasm32 (a native desktop app;
# the browser demos build this library for wasm and must not pull nee_soon).
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
eframe = { workspace = true }
egui_plot = { workspace = true }
# Step 0's folder picker for the unzipped ENDF library (the same picker kovan
# and tampines-steam-tables-gui use).
egui-file-dialog = { workspace = true }
nee_soon = { workspace = true }
outram-mc-libs = { workspace = true }
# Step 1's fresh DEM pour (`htr10_fill`, the LIGGGHTS port's GranularSystem).
outram-park-fork-liggghts = { workspace = true }
# Steps 7-8 (gh:#572, #573): the meshing nexus (neutral mesh, cfMesh bridge,
# farrer-park FEM bridge, mesh-to-mesh overlap, mesh plots), the cfMesh port
# itself (named patches, boundary layers on one patch, polyMesh writer,
# quality checks), and the GeN-Foam port's nuclearData writer/reader.
outram-blender = { workspace = true, features = ["foam-mesh", "fem-export"] }
outram-park-fork-cfmesh = { workspace = true, features = ["foam-export"] }
outram-foam-appbuilder-lib = { workspace = true }
# The literature pane renders PDF pages with the engine kovan's own reader
# uses (AGPL-3.0-only, like this crate since 2026-10-05; see NOTICE). Same
# version and features as `crates/kovan`.
kopitiam-pdf = { version = "0.4.3", default-features = false, features = ["egui"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Location", "History", "Response",
    "Worker", "WorkerOptions", "WorkerType", "WorkerGlobalScope",
    "DedicatedWorkerGlobalScope", "MessageEvent", "ErrorEvent", "console",
    # `platform::keep_canvas_at_device_pixels` (gh:#556).
    "Element", "HtmlCanvasElement", "NodeList", "DomRect",
] }

# The windowing stack, and the whole reason this crate exists. Target-gated OFF
# Android (the workspace's single windowing exemption): eframe pulls in
# android-activity. Nothing else in the workspace should carry these.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
eframe = { workspace = true }
egui = { workspace = true }
# The TRISO pebble demo, which ALSO builds for wasm32: continuous-energy
# transport, the in-repo NJOY port that processes the real ENDF tapes it runs
# on, and zlib for the covariance-stripped tapes the browser downloads.
outram-mc-libs = { workspace = true }
njoy-outram-park-fork = { workspace = true }
miniz_oxide = { workspace = true }
log = { workspace = true }
# The dispersion demo (gh:#530), which also builds for wasm32: buangkok's
# pyDOSEIA plume, rise, wake and deposition velocities, changi's puff kernel
# and decay transfer function. Both are wasm in-scope crates.
changi = { workspace = true }
buangkok = { workspace = true }
# The TRISO-ATOPS and fuel failure demo (gh:#540): boon-lay's TRISO geometry,
# decay chains, Walk-on-Spheres, fuel failure, chemistry and TRISO-ATOPS
# release. A wasm in-scope crate (its `wasm_par` shim stands in for rayon).
boon-lay = { workspace = true }
# The nuclear data demo's THERMR rung names energies and cross sections in
# njoy-outram-park-fork's `uom` units (gh:#529).
uom = { workspace = true }

# Native only: the two studios' stacks. Gated off wasm32 because dev-deps
# resolve for EVERY example in the package, and outram-blender's `gpu` feature
# and nee_soon have no business in the browser build of the pebble demo.
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dev-dependencies]
egui_plot = { workspace = true }
env_logger = { workspace = true }
# Authoring frontend (math/mesh/primitives) plus its volume-meshing bridge.
#
# ~~The `mc-export` feature is still required here because `outram_blender::sim`
# has not moved yet.~~ DONE 2026-10-02 (GitHub #486): the headless Monte Carlo
# bridge (`to_mc_geometry`) and run driver (`sim`) now live ungated in
# `nee_soon`, outram-blender's `mc-export` feature is retired, and MC Studio
# drives `nee_soon::sim`. The volume-meshing bridge (`foam-mesh`) is LIBRARY
# code and stays in outram-blender; this crate only hosts the GUI that drives it.
outram-blender = { workspace = true, features = ["foam-mesh", "gpu"] }
# MC Studio's backend (`nee_soon::sim`, `nee_soon::blender_bridge`).
nee_soon = { workspace = true }

# MC Studio -- author geometry, set up and run an outram-mc calculation.
#
#   cargo run -p dhoby-ghaut --example mc_studio --release
#
# Carries its own Android stub `main` (the example rule: a blanked file gives
# "main function not found"), so an on-device Termux build still compiles it.
[[example]]
name = "mc_studio"
path = "examples/mc_studio/main.rs"

# Mesh Studio -- author a surface, run it through cfmesh's tet-dual pipeline,
# write an OpenFOAM polyMesh.
#
#   cargo run -p dhoby-ghaut --example mesh_studio --release
[[example]]
name = "mesh_studio"
path = "examples/mesh_studio/main.rs"

# Browser-side extras for the Monte Carlo web demo. `glow` (WebGL2) is added
# because WebGPU is still not universal; the app selects it at start-up.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
eframe = { workspace = true, features = ["glow"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "Response", "Location", "History",
    # The physics Web Worker that keeps the page live while ENDF data process.
    "Worker", "WorkerOptions", "WorkerType", "WorkerGlobalScope",
    "DedicatedWorkerGlobalScope", "MessageEvent", "ErrorEvent", "console",
] }

# The Monte Carlo demo -- one app, a rung of the tutorial ladder at a time
# (gh:#520/#521): `godiva` (a bare HEU sphere: Watch, and a live Run k_eff) and
# `triso` (a 2D HTR-10 fuel pebble). Real ENDF/B-VIII.0 data, outram-mc-libs
# transport. Runs natively and, single-threaded, in the browser
# (web/monte_carlo/). Was `triso_pebble_web` until 2026-10-04.
#
#   cargo run -p dhoby-ghaut --example monte_carlo_web --release [-- --rung godiva --mode run]
#   cargo run -p dhoby-ghaut --example monte_carlo_web --release -- --headless-keff
#
# Carries an Android stub `main`, as mc_studio does.
[[example]]
name = "monte_carlo_web"
path = "examples/monte_carlo_web/main.rs"

# The dispersion demo -- one app, a rung of the dispersion lesson ladder at a
# time (gh:#530; deep-dives/dispersion/rungs/): steady plume, sigma curves,
# plume rise and wake, the puff train in a turning wind, deposition, dose
# against distance, and the HTR-10 capstone (recorded). Built on
# `dhoby_ghaut::web_demo`; runs natively and in the browser
# (web/dispersion/), every calculation off the UI thread.
#
#   cargo run -p dhoby-ghaut --example dispersion_web --release [-- --rung puffs]
#
# Carries an Android stub `main`.
[[example]]
name = "dispersion_web"
path = "examples/dispersion_web/main.rs"

# The TRISO-ATOPS and fuel failure demo (gh:#540) -- one app, a rung of the
# boon-lay lesson ladder at a time (triso, decay, walk, layers, failure,
# chemistry, release, source-term), every number a call into boon-lay in a
# background thread or Web Worker, built on `dhoby_ghaut::web_demo`
# (web/triso_atops/).
#
#   cargo run -p dhoby-ghaut --example triso_atops_web --release [-- --rung failure]
#
# Carries an Android stub `main`.
[[example]]
name = "triso_atops_web"
path = "examples/triso_atops_web/main.rs"

# The nuclear data demo (gh:#529) -- one app, a rung of the nuclear data track
# at a time (endf, reconr, broadr, purr, thermr, groupr, acer): real
# ENDF/B-VIII.0 processed by njoy-outram-park-fork in a background thread or
# Web Worker, built on `dhoby_ghaut::web_demo` (web/nuclear_data/).
#
#   cargo run -p dhoby-ghaut --example nuclear_data_web --release [-- --rung broadr]
#
# Carries an Android stub `main`.
[[example]]
name = "nuclear_data_web"
path = "examples/nuclear_data_web/main.rs"
