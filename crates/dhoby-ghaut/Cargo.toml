[package]
name = "dhoby-ghaut"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Digital High-fidelity Orchestration by GUI for a Human-friendly Automated Unified Toolkit — DHOBY GHAUT, the GUI home for OUTRAM PARK's meshing and Monte Carlo studios. The library is a placeholder; the MC Studio and Mesh Studio GUIs, and a browser-capable TRISO pebble neutron-track demo, live here as examples."
homepage.workspace = true
repository.workspace = true
categories.workspace = true

# ---------------------------------------------------------------------------
# The library itself has NO dependencies. The studios are examples.
# ---------------------------------------------------------------------------
#
# `src/lib.rs` is still a placeholder and stays dependency-free. Everything
# below is a DEV-dependency, carried only so the studio examples build. That
# keeps the published crate trivially light and makes it obvious that nothing
# here is a library surface yet.

[dependencies]

# The windowing stack, and the whole reason this crate exists. Target-gated OFF
# Android (the workspace's single windowing exemption): eframe pulls in
# android-activity. Nothing else in the workspace should carry these.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
eframe = { workspace = true }
egui = { workspace = true }
# The TRISO pebble demo, which ALSO builds for wasm32: continuous-energy
# transport, the in-repo NJOY port that processes the real ENDF tapes it runs
# on, and zlib for the covariance-stripped tapes the browser downloads.
outram-mc-libs = { workspace = true }
njoy-outram-park-fork = { workspace = true }
miniz_oxide = { workspace = true }
log = { workspace = true }

# Native only: the two studios' stacks. Gated off wasm32 because dev-deps
# resolve for EVERY example in the package, and outram-blender's `gpu` feature
# and nee_soon have no business in the browser build of the pebble demo.
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dev-dependencies]
egui_plot = { workspace = true }
env_logger = { workspace = true }
# Authoring frontend (math/mesh/primitives) plus its volume-meshing bridge.
#
# ~~The `mc-export` feature is still required here because `outram_blender::sim`
# has not moved yet.~~ DONE 2026-10-02 (GitHub #486): the headless Monte Carlo
# bridge (`to_mc_geometry`) and run driver (`sim`) now live ungated in
# `nee_soon`, outram-blender's `mc-export` feature is retired, and MC Studio
# drives `nee_soon::sim`. The volume-meshing bridge (`foam-mesh`) is LIBRARY
# code and stays in outram-blender; this crate only hosts the GUI that drives it.
outram-blender = { workspace = true, features = ["foam-mesh", "gpu"] }
# MC Studio's backend (`nee_soon::sim`, `nee_soon::blender_bridge`).
nee_soon = { workspace = true }

# MC Studio -- author geometry, set up and run an outram-mc calculation.
#
#   cargo run -p dhoby-ghaut --example mc_studio --release
#
# Carries its own Android stub `main` (the example rule: a blanked file gives
# "main function not found"), so an on-device Termux build still compiles it.
[[example]]
name = "mc_studio"
path = "examples/mc_studio/main.rs"

# Mesh Studio -- author a surface, run it through cfmesh's tet-dual pipeline,
# write an OpenFOAM polyMesh.
#
#   cargo run -p dhoby-ghaut --example mesh_studio --release
[[example]]
name = "mesh_studio"
path = "examples/mesh_studio/main.rs"

# Browser-side extras for the Monte Carlo web demo. `glow` (WebGL2) is added
# because WebGPU is still not universal; the app selects it at start-up.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
eframe = { workspace = true, features = ["glow"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "Response", "Location", "History",
    # The physics Web Worker that keeps the page live while ENDF data process.
    "Worker", "WorkerOptions", "WorkerType", "WorkerGlobalScope",
    "DedicatedWorkerGlobalScope", "MessageEvent", "ErrorEvent", "console",
] }

# The Monte Carlo demo -- one app, a rung of the tutorial ladder at a time
# (gh:#520/#521): `godiva` (a bare HEU sphere: Watch, and a live Run k_eff) and
# `triso` (a 2D HTR-10 fuel pebble). Real ENDF/B-VIII.0 data, outram-mc-libs
# transport. Runs natively and, single-threaded, in the browser
# (web/monte_carlo/). Was `triso_pebble_web` until 2026-10-04.
#
#   cargo run -p dhoby-ghaut --example monte_carlo_web --release [-- --rung godiva --mode run]
#   cargo run -p dhoby-ghaut --example monte_carlo_web --release -- --headless-keff
#
# Carries an Android stub `main`, as mc_studio does.
[[example]]
name = "monte_carlo_web"
path = "examples/monte_carlo_web/main.rs"
