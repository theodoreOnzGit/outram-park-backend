[package]
name = "dhoby-ghaut"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Digital High-fidelity Orchestration by GUI for a Human-friendly Automated Unified Toolkit — DHOBY GHAUT, the GUI home for OUTRAM PARK's meshing and Monte Carlo studios. The library is a placeholder; the MC Studio and Mesh Studio GUIs live here as examples."
homepage.workspace = true
repository.workspace = true
categories.workspace = true

# ---------------------------------------------------------------------------
# The library itself has NO dependencies. The studios are examples.
# ---------------------------------------------------------------------------
#
# `src/lib.rs` is still a placeholder and stays dependency-free. Everything
# below is a DEV-dependency, carried only so the studio examples build. That
# keeps the published crate trivially light and makes it obvious that nothing
# here is a library surface yet.

[dependencies]

# The windowing stack, and the whole reason this crate exists. Target-gated OFF
# Android (the workspace's single windowing exemption): eframe pulls in
# android-activity. Nothing else in the workspace should carry these.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
eframe = { workspace = true }
egui = { workspace = true }
egui_plot = { workspace = true }
env_logger = { workspace = true }
# Authoring frontend (math/mesh/primitives) plus its volume-meshing bridge.
#
# ~~The `mc-export` feature is still required here because `outram_blender::sim`
# has not moved yet.~~ DONE 2026-10-02 (GitHub #486): the headless Monte Carlo
# bridge (`to_mc_geometry`) and run driver (`sim`) now live ungated in
# `nee_soon`, outram-blender's `mc-export` feature is retired, and MC Studio
# drives `nee_soon::sim`. The volume-meshing bridge (`foam-mesh`) is LIBRARY
# code and stays in outram-blender; this crate only hosts the GUI that drives it.
outram-blender = { workspace = true, features = ["foam-mesh", "gpu"] }
# MC Studio's backend (`nee_soon::sim`, `nee_soon::blender_bridge`).
nee_soon = { workspace = true }

# MC Studio -- author geometry, set up and run an outram-mc calculation.
#
#   cargo run -p dhoby-ghaut --example mc_studio --release
#
# Carries its own Android stub `main` (the example rule: a blanked file gives
# "main function not found"), so an on-device Termux build still compiles it.
[[example]]
name = "mc_studio"
path = "examples/mc_studio/main.rs"

# Mesh Studio -- author a surface, run it through cfmesh's tet-dual pipeline,
# write an OpenFOAM polyMesh.
#
#   cargo run -p dhoby-ghaut --example mesh_studio --release
[[example]]
name = "mesh_studio"
path = "examples/mesh_studio/main.rs"
