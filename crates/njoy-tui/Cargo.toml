[package]
name = "njoy-tui"
version = "0.0.1"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
description = "Mobile-first touchscreen ratatui TUI for njoy-outram-park-fork — a JANIS-like nuclear-data browser (nuclide finder, log-log cross-section plot, Doppler temperature input)."

[[bin]]
name = "njoy-tui"
path = "src/main.rs"

[dependencies]
njoy-outram-park-fork.workspace = true
# ratatui is a terminal library — it runs on Android/Termux like any other
# non-GUI crate (workspace CLAUDE.md "Android portability": only windowing GUI,
# e.g. egui/eframe, is out of scope; a TUI is in scope). Declared as a NORMAL
# dependency (not target-gated) per op-omf: this TUI must build for
# aarch64-linux-android exactly the same as for desktop. ratatui re-exports its
# matched crossterm build as `ratatui::crossterm`, so no separate crossterm pin
# is needed (mirrors kovan-tui's convention).
ratatui.workspace = true
