[package]
name = "kovan-semantics"
description = "KOVAN repository-understanding engine — ripgrep-first, escalating to language-native tooling."
version = "0.0.1"
edition.workspace = true
license.workspace = true
# `docs/` is repo-only: the rustdoc->markdown API mirror and the V&V
# write-ups. Excluded so it never ships to crates.io (size, and it is
# not part of the published API surface).
exclude = ["docs"]
repository.workspace = true

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 2
topic = "knowledge-management"
maturity = 1

[dependencies]
kovan-common.workspace = true
kovan-discovery.workspace = true
# Pure-Rust regex, used only to pull symbol names/kinds out of the candidate
# lines that kovan-discovery's ripgrep engine already located. Android-friendly
# (no system libs), keeping the DEFAULT build deterministic + offline.
regex.workspace = true

# Language-native semantics are the source of truth once wired:
#   Rust    -> rust-analyzer crates (ra_ap_syntax / ra_ap_hir / ra_ap_ide)
#   C++     -> clangd / libclang
#   Python  -> Pyright / Jedi
#   Fortran -> fortls
# These are heavyweight and, for the Rust crates / libclang, Android-hostile, so
# they are NOT hard dependencies here yet — they belong behind the per-language,
# target-gated `language-servers` feature below so the crate stays headless and
# Android-buildable. Until then, semantics starts from kovan-discovery (fd +
# ripgrep) + `regex`. Tree-sitter is a last resort only (see docs/kovan.md,
# "Tree-Sitter Policy").

[features]
default = []
# Escalation path (see docs/kovan.md "Important Philosophy"): drive the real
# language servers (rust-analyzer / clangd / Pyright / fortls) instead of the
# ripgrep-first extractor. Those integrations are heavyweight and Android-hostile
# (in-process `ra_ap_*` / `libclang`), so this feature is OFF by default AND the
# code behind it is additionally source-gated to `cfg(not(target_os =
# "android"))`. The default build stays ripgrep-only and Android-clean.
language-servers = []

[dev-dependencies]
# `agent_docs` tests build a synthetic crate tree rather than depending on the
# real `crates/` contents, which change and whose api.md files are megabytes.
tempfile.workspace = true
