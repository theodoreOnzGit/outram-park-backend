# Kovan's concept-tree skeleton (OUTRAM PARK GitHub #724, #726, #727).
# Lives in kovan-literature, beside the corpus it links to (the reactor-literature
# submodule is mounted in this crate); wasm-clean, so the Code Review tab can be
# built for the browser as well as the desktop.
#
# Two fixed levels, shared by the Literature and Code Review tabs:
#   L1: the 19 infrastructure issues of IAEA NG-G-3.1 (Rev. 1), numbered so
#       `NN-` is the document's section 3.NN (decided 2026-10-06);
#   L2: categories from the open NRC guides (NUREG-0800, NUREG-1537 Part 1,
#       RG 1.232, NUREG-1520, NUREG-1555, NUREG-0654/FEMA-REP-1) and ORNL's
#       MSR gap analysis, plain-word segments with no number.
# The owner's concepts hang below L2 as folders, as today.
#
# Every source names a [[document]] by `id`; each document names its file in
# a corpus repository (`tier = "standard"`: reactor-literature; `"private"`:
# the owner's private corpus). This is the INITIAL linking, at document and
# section level (2026-10-06); finer artifact links (page anchors, quotes) are
# the owner's, added later. Section numbers are the documents' own.
# `cross_links` names other nodes a node also belongs to (shown as a dotted
# link; the node's home is its path).
# A node is shown greyed (and hidden by the 'show empty nodes' toggle) when
# nothing is classified under it; that is computed, not stored here.

