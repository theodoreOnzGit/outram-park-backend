# Kovan's SCIENCES tree: PROPOSALS (OUTRAM PARK GitHub #727; maintainer
# direction 2026-10-10). DRAFT FOR MAINTAINER REVIEW.
#
# Two trees, two tabs (maintainer, 2026-10-10):
#   1. IAEA (application): `concept_skeleton.toml` (19 NG-G-3.1 issues -> NRC
#      L2) -> `concept_proposals.toml` L3 engineering concepts -> L4
#      outram-park implementation leaves. Unchanged by this file.
#   2. Sciences (this file): physical principles; computation (numerical
#      methods and computer science, anchored on problems, theorems and
#      aims); then the disciplines that branch out of them (neutronics,
#      thermal hydraulics, materials; human factors later). Software
#      engineering and QA are NOT here: they belong to the IAEA tab.
# The IAEA tree REFERENCES the Sciences tree: an L2 node, an L3 concept or an
# L4 implementation leaf names the Sciences nodes it rests on. Review stamps
# will also link Sciences nodes (review.md `[[relation]] kind = "implements"`).
#
# STATUS: every entry here is `status = "proposed"`. NOTHING in this file is
# part of either tree until the maintainer approves it, line by line.
# The readable review copy is `docs/concept-sciences-proposals.md`,
# regenerated from this file by
# `KOVAN_REGENERATE_SCIENCES=1 cargo test --release -p kovan-literature --test concept_sciences`
# (the test fails while the two disagree).
#
# ---------------------------------------------------------------------------
# NODE IDS ARE PERMANENT (maintainer, 2026-10-10: "they are physics, fixed").
# ---------------------------------------------------------------------------
# A Sciences node's id is its `path`: `sciences/<segment>/<segment>/...`,
# each segment plain lower-case ASCII words joined by `-`, no digits. A segment
# names the PHYSICS (or the mathematics), never a source, a document number, a
# code or a crate (the test rejects any segment equal to a workspace crate
# name). Once a node is approved its path never changes and never disappears:
# the tree grows additively. Approval is recorded by appending the path to
# `concept_sciences_approved.txt`; the test fails if a listed path is missing
# from this file or no longer `approved`, and if an `approved` node is not
# listed.
#
# [[document]]  a source the Sciences tree cites that the skeleton does not
#               already declare (a source may name EITHER a skeleton document
#               id or one of these; the ids may not collide)
#   id, title, publisher, date
#   holder  "standard"      = reactor-literature/kovan-standard-open-corpus/
#           "theodore-open" = reactor-literature/theodore-open-corpus/
#           "web"           = not in the corpus; `url` names a stable page
#   file    path relative to the reactor-literature repository root
#           (holder standard/theodore-open)
#   url     (holder web)
#   licence the document's own licence statement, as read
#   redistributable  true when that statement permits redistribution
#
# [[science]]  one node of the Sciences tree
#   path        the permanent id (see above). Its parent is the path minus the
#               last segment; a two-segment path (`sciences/x`) is a top-level
#               branch of the Sciences tab.
#   title       plain words
#   sources     [{ document, section }]: sections READ FROM THE DOCUMENT
#               ITSELF (2026-10-10), never from memory
#   cross_links other Sciences paths this node also belongs to (the graph)
#   status      "proposed" | "approved" | "deferred"
#   note        optional: a judgement call, or "source not yet read" (an
#               empty `sources` list REQUIRES that note)
#   kind        optional: "method" marks a computation method leaf (must sit
#               under sciences/computation/problems/); it then carries
#               `dated` (required), optional `superseded_by`, `theorems`,
#               `aims`, `order_of_accuracy`, `cost_scaling`, `memory`; see
#               the sciences/computation banner below. A method is never
#               deleted: it is marked `superseded_by`.
#
# [[reference]]  a PROPOSED link from the IAEA tree into the Sciences tree
#   node        a skeleton node path (L1/L2) or a concept path (L3+), OR
#   crate + module  an existing `[[implementation]]` leaf of
#               concept_proposals.toml
#   sciences    Sciences paths it rests on; a list with no cap (an
#               implementation leaf typically rests on many)
#   status      "proposed"
#   note        optional
# Once approved, a reference moves into an optional `sciences = [...]` field
# on that `[[concept]]` or `[[implementation]]` in concept_proposals.toml
# (documented there; additive, ignored by the current tree reader). Skeleton
# L2 references stay here, since the approved skeleton is not edited.
#
# [[candidate]]  an open document the maintainer may add to the corpus
#   title, url, licence, why   (nothing is downloaded or committed)

