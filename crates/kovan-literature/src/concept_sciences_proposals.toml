# ============================================================================
# sciences/computation  (maintainer, 2026-10-10: "Computation (numerical
# methods & computer science)", anchored on TIMELESS things, not algorithms)
#
# Algorithms evolve fast; problems and theorems do not, so the permanent ids
# live on Problems, Governing theorems and Aims. Methods are leaves under the
# Problem they solve (kind = "method"): each is dated, never deleted (marked
# `superseded_by` instead), and names the theorems and aims it trades on, with
# its accuracy-versus-speed properties recorded (order of accuracy, cost
# scaling, memory). Aims are the motivation: accuracy and speed, often
# orthogonal; trust is added because an irreproducible fast and accurate run is
# worthless for V&V (root CLAUDE.md: the HTR-10 bed gave a different answer
# every run because a neighbour grid iterated a randomly seeded HashMap).
# Software engineering and QA (the human/management side) live under the IAEA
# tab, not here; they may reference the trust aims.
#
# Extra fields on a `kind = "method"` node (all optional except dated):
#   dated          when the method was recorded in this tree (YYYY-MM-DD)
#   superseded_by  the path of the method that replaces it (never deleted)
#   theorems       paths under sciences/computation/governing-theorems
#   aims           paths under sciences/computation/aims
#   order_of_accuracy, cost_scaling, memory   free text, as the source states
# ============================================================================

