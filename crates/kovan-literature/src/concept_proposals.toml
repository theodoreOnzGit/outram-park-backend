# Kovan concept-tree PROPOSALS: level 3 (concepts) and level 4 (outram-park
# implementation leaves). OUTRAM PARK GitHub #724, #726, #727, #729.
#
# STATUS: every entry here is `status = "proposed"`. NOTHING in this file is
# part of the tree until the maintainer approves it, line by line. Approved
# concepts move into `concept_skeleton.toml` (or a public-concepts file beside
# it); rejected ones are deleted here. The readable review copy is
# `docs/concept-proposals.md`, regenerated from this file by
# `KOVAN_REGENERATE_PROPOSALS=1 cargo test --release -p kovan-literature --test concept_proposals`
# (the test fails while the two disagree).
#
# [[concept]] (L3; may nest under another proposed concept)
#   path    full path, under an L2 node of the skeleton (or under another
#           proposed concept); plain lower-case hyphenated segments
#   title   the source document's own words, verbatim or lightly shortened
#   origin  "nrc"         = a subsection the cited document names itself;
#           "outram-park" = a concept the outram-park code needs that the
#                           cited text names only implicitly (`why` says why)
#   sources [{ document, section }], document = a skeleton [[document]] id;
#           sections read from the document text (2026-10-06), never from memory
#   note    optional: a judgement call the maintainer should look at
#
# [[implementation]] (L4, outram-park only; world leaves are the maintainer's)
#   concept the full path of a proposed concept (or a skeleton node)
#   crate   a workspace member directory under crates/
#   module  a file or directory under crates/<crate>/src/, without `.rs`
#   kind    "port" (with `upstream`) or "new-work" (`upstream` = what it is
#           built from, when that is a published method rather than code)
# L4 will be REGENERATED by kovan from `//! kovan-concept: <L3 path>` lines in
# each module's own doc comment (maintainer, 2026-10-06); these entries are the
# SEED set of those tags. The test `tests/concept_proposals.rs` checks every
# crate/module still exists on develop, so a refactor that moves a module
# fails until this file is updated.

