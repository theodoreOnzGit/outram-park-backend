[package]
name = "kovan-literature"
description = "KOVAN nuclear-engineering knowledge archive: PDF → Markdown → KovanDocument → BibTeX."
version = "0.0.0"
edition.workspace = true
license.workspace = true

# What ships to crates.io vs what only lives in the GitHub repo.
#
# Excluded — source PDFs and generated markdown. Redistributing third-party
# theses/papers on crates.io is a separate licence question from hosting them in
# this repo, and full-text bodies run to hundreds of KB each. They stay
# repository-only; `src/` works against whatever archive root the caller points
# it at, so none of it is needed to build.
#
# Included — `generated/bibtex/open/`. Citation entries are a few hundred bytes
# each and are pure bibliographic facts about open-access works, so shipping them
# makes the published crate directly citable. `generated/bibtex/proprietary/` is
# excluded: those describe user-owned content that must not leave the machine.
#
# Every pattern is anchored with a leading `/`. Cargo matches `exclude` with
# gitignore semantics, where an unanchored `open/` matches a directory named
# `open` at *any* depth — which silently excluded `generated/bibtex/open/`, the
# one part of the archive that is meant to ship. Keep the slashes.
exclude = [
    "/open/",
    "/proprietary/",
    "/generated/markdown/",
    "/generated/assets/",
    "/generated/bibtex/proprietary/",
    "/docs/",
    # /derived/ holds datasets extracted FROM archived documents (factual
    # values with provenance, e.g. the HTR-10 r-z zone partition read from
    # Terry 2005 Fig. 2). Committed to git — facts are not copyrightable and
    # these carry an open provenance path — but repo-only, like /docs/: the
    # published crate is a library, not a data distribution.
    "/derived/",
]

# Graph-digitiser front ends (bead op-5v5.8): one engine in `src/digitiser/`,
# three binaries. The CLI and ratatui TUI are default features and MUST build
# on Termux/Android (terminal apps are in scope per the workspace Android
# rule); the egui GUI is a NON-DEFAULT feature and its dependencies are
# additionally target-gated off Android, so neither the default build nor any
# crate that merely depends on this library ever pulls a GUI stack.
[features]
default = ["digitise-cli", "digitise-tui"]
# `kovan-digitise` — fully automatic, scriptable, deterministic (agent path).
digitise-cli = ["dep:clap"]
# `kovan-digitise-tui` — hybrid: automatic pass, then terminal review.
digitise-tui = ["dep:ratatui", "dep:clap"]
# `kovan-digitise-gui` — hybrid egui review, graphreader-style. Desktop-only:
# non-default feature AND the deps below are declared only off Android; the
# binary itself compiles to a stub `main` on Android as belt-and-braces.
digitise-gui = ["dep:eframe", "dep:egui"]

[[bin]]
name = "kovan-digitise"
path = "src/bin/kovan_digitise.rs"
required-features = ["digitise-cli"]

[[bin]]
name = "kovan-digitise-tui"
path = "src/bin/kovan_digitise_tui.rs"
required-features = ["digitise-tui"]

[[bin]]
name = "kovan-digitise-gui"
path = "src/bin/kovan_digitise_gui.rs"
required-features = ["digitise-gui"]

[dependencies]
kovan-common.workspace = true
serde.workspace = true
toml.workspace = true
pulldown-cmark.workspace = true
# PDF ingestion — pure-Rust, offline, Android-buildable, MIT (GPLv3-compatible).
# pdf-extract: deterministic plain-text extraction. lopdf: low-level PDF object
# model, used for Info-dict metadata and raw image-asset extraction.
pdf-extract.workspace = true
lopdf.workspace = true
# SHA-256 of the ingested source file, recorded as provenance (DATA_POLICY.md).
# Pure Rust, no C toolchain, so it does not compromise the Android/Termux build.
sha2.workspace = true
# Graph digitiser engine: pure-Rust PNG/JPEG decoding (no C toolchain, builds
# on Termux/Android) and JSON (de)serialisation of DigitisedDataset records.
image.workspace = true
serde_json.workspace = true
# Front-end deps, all optional (see [features] above). clap and ratatui are
# pure Rust and Android-clean; eframe/egui are desktop-only and target-gated.
clap = { workspace = true, optional = true }
ratatui = { workspace = true, optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
