[package]
name = "kovan-literature"
description = "KOVAN nuclear-engineering knowledge archive: PDF → Markdown → KovanDocument → BibTeX."
version = "0.0.1"
edition.workspace = true
license = "AGPL-3.0-only"  # all of kovan is AGPL since 2026-10-07 (NOTICE)
repository.workspace = true

# What ships to crates.io vs what only lives in the GitHub repo.
#
# Excluded — source PDFs and generated markdown. Redistributing third-party
# theses/papers on crates.io is a separate licence question from hosting them in
# this repo, and full-text bodies run to hundreds of KB each. They stay
# repository-only; `src/` works against whatever archive root the caller points
# it at, so none of it is needed to build.
#
# Included — `generated/bibtex/open/`. Citation entries are a few hundred bytes
# each and are pure bibliographic facts about open-access works, so shipping them
# makes the published crate directly citable. `generated/bibtex/proprietary/` is
# excluded: those describe user-owned content that must not leave the machine.
#
# Every pattern is anchored with a leading `/`. Cargo matches `exclude` with
# gitignore semantics, where an unanchored `open/` matches a directory named
# `open` at *any* depth — which silently excluded `generated/bibtex/open/`, the
# one part of the archive that is meant to ship. Keep the slashes.
exclude = [
    # citeproc-js port verification (GitHub #790, #791): citeproc-js's output
    # on the CSL test suite and the site bib, and the tests that read it.
    # Repo-only (maintainer, 2026-10-08): it stays on GitHub, never in the
    # published crate. data/csl/ does ship: the library compiles apa.csl and
    # the locale in, with their CC BY-SA attribution README.
    "/tests/data/csl/",
    "/tests/citeproc_*.rs",
    "/tests/csl_vs_citeproc_js.rs",
    "docs",
    "/open/",
    "/proprietary/",
    "/generated/markdown/",
    "/generated/assets/",
    "/generated/bibtex/proprietary/",
    "/docs/",
    # /derived/ holds datasets extracted FROM archived documents (factual
    # values with provenance, e.g. the HTR-10 r-z zone partition read from
    # Terry 2005 Fig. 2). Committed to git — facts are not copyrightable and
    # these carry an open provenance path — but repo-only, like /docs/: the
    # published crate is a library, not a data distribution.
    "/derived/",
    # /reactor-literature/ is a Git submodule (the maintainer's
    # theodoreOnzGit/reactor-literature repository: the Kovan standard open
    # corpus and the maintainer's open corpus, as PDFs). Repo-only, never
    # packaged: the crate is a library, not a PDF distribution.
    "/reactor-literature/",
    # The Zotero port's code-to-code verification (GitHub #747, #752): the
    # upstream reference outputs, fixtures and Zotero schema copies under
    # /tests/data/zotero/ (about 16 MB, 600+ files), and the tests and helper
    # that read them. Repo-only (maintainer, 2026-10-07): they are only
    # meaningful with the repository's harness, and a test shipped without its
    # data would fail when run from the published crate.
    "/tests/data/zotero/",
    "/tests/zotero_*.rs",
    "/tests/zotero_db/",
]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 1
topic = "knowledge-management"
maturity = 1

[dependencies]
kovan-common.workspace = true
serde.workspace = true
# Zotero (src/zotero/): JSON item formats for the translators (#749) and the
# local library import's JSON output (#750), and the translators' regular
# expressions. Both pure Rust, wasm- and Android-safe.
serde_json.workspace = true
# CSL citations for the Pages site (`csl`, GitHub #789): see the root Cargo.toml.
regex.workspace = true
# Collation for `citeproc::js::locale_compare` (#795, DECISIONS.md): ICU4X, as node's ICU.
icu_collator.workspace = true
icu_locale_core.workspace = true
# HTML parsing for the note exporters (Note HTML, Note Markdown; #749): the
# WHATWG algorithm jsdom's parse5 implements. MIT OR Apache-2.0, pure Rust.
html5ever.workspace = true
toml.workspace = true
pulldown-cmark.workspace = true
# PDF ingestion — pure-Rust, offline, Android-buildable, MIT (GPLv3-compatible).
# pdf-extract: deterministic plain-text extraction. lopdf: low-level PDF object
# model, used for Info-dict metadata and raw image-asset extraction.
pdf-extract.workspace = true
lopdf.workspace = true
# SHA-256 of the ingested source file, recorded as provenance (DATA_POLICY.md).
# Pure Rust, no C toolchain, so it does not compromise the Android/Termux build.
sha2.workspace = true

# Reading a Zotero data folder (`zotero::local_library`, GitHub #750). turso_core
# reads the SQLite file format and its WAL from memory in pure Rust (C-backed
# features off: see the root Cargo.toml), so the reader compiles and runs on every
# target, wasm32-unknown-unknown and Android included (since 2026-10-07; it used to
# be rusqlite with bundled C SQLite, gated off both).
turso_core.workspace = true

# The Zotero reader's tests build databases from Zotero's own schema files with
# real SQLite (rusqlite, C) and compare the turso reader against it
# (tests/zotero_local_library.rs, tests/zotero_sqlite_format.rs). Test-only and
# native-only: rusqlite never reaches the shipped library on any target.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
