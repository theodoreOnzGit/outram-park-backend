[package]
name = "tuas_boussinesq_solver"
version = "0.1.5"
edition.workspace = true
license.workspace = true
description = "Thermo-hydraulic Uniphase Solver for Advection and Convection in Salt Flows (TUAS)"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# Test runs dump ~58 MB of CSV output into the crate root; keep them out of the
# published package (well over the crates.io size limit, and not crate content).
exclude = ["*.csv"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
approx.workspace = true
csv.workspace = true
ndarray.workspace = true
peroxide.workspace = true
roots.workspace = true
thiserror.workspace = true
uom.workspace = true

[lib]
name = "tuas_boussinesq_solver"
path = "src/lib/lib.rs"

[[example]]
name = "ciet_educational_simulator"


[dev-dependencies]
# the natural circulation loop requires a PID controller
chem-eng-real-time-process-control-simulator.workspace = true

log.workspace = true

# You only need serde if you want app persistence:
serde.workspace = true
uom.workspace = true

# GUI-only dev-deps for the `ciet_educational_simulator` example. These are
# Android-hostile: egui/eframe pull in `ring` (via ureq/rustls), which needs a
# C compiler that the Android target has no toolchain for here. The example
# itself is gated off Android with `#![cfg(not(target_os = "android"))]`, so
# these deps must be absent from the Android dependency graph too.
[target.'cfg(not(target_os = "android"))'.dev-dependencies]
egui.workspace = true
eframe.workspace = true
egui_extras.workspace = true
egui_plot.workspace = true
image.workspace = true

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true
