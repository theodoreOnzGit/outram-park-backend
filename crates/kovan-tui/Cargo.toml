[package]
name = "kovan-tui"
description = "KOVAN terminal user interface — human-facing (literature / repository / knowledge browser)."
version = "0.0.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "kovan-tui"
path = "src/main.rs"

[dependencies]
kovan-common.workspace = true
kovan-discovery.workspace = true
kovan-literature.workspace = true
kovan-semantics.workspace = true
kovan-codegen.workspace = true

# TUI is desktop scope. ratatui (and its bundled crossterm) are pulled ONLY off
# Android so the crate honours the workspace Android rule; on Android the binary
# compiles to a stub that points users at the `kovan` CLI. ratatui re-exports
# its matched crossterm as `ratatui::crossterm`.
[target.'cfg(not(target_os = "android"))'.dependencies]
ratatui.workspace = true

# Pure-Rust, Android-friendly (see kovan-discovery's identical use): only
# referenced from `#[cfg(test)]` fixtures under `src/tui/`, which is itself
# behind the crate's Android gate on `main.rs`'s `mod tui;` — never reaches
# the Android build even in principle.
[dev-dependencies]
tempfile.workspace = true
