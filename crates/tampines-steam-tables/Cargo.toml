[package]
name = "tampines-steam-tables"
version = "0.2.9"
authors = [
    "Ong Kay Chen Theodore",
    "Ethan Yew Hoe, Wong",
    "Professor Per F. Peterson",
    "University of California, Berkeley Thermal Hydraulics Lab",
    "Singapore Nuclear Research and Safety Institute (SNRSI)",
    "National University of Singapore (NUS)",
    "Repository Contributors",
]
edition.workspace = true
license.workspace = true
description = "IAPWS-IF97 steam tables for the TAMPINES simulator -- draws from (not a 1:1 port of) the rust-steam crate; independent OUTRAM PARK implementation, not the original rust-steam project"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# `docs/` holds LaTeX sources and build artifacts (.aux/.bbl/.bcf/...) that are
# not crate content.
# `figures/` holds regenerable output from the `tampines-steam-tables-gui`
# example (`--export-all` rewrites all 20 files in seconds). It is tens of
# megabytes and is not crate content.
exclude = [
    "docs",
    "verification_and_validation/*.csv",
    "verification_and_validation/**/*.csv",
    "figures",
]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it.
[package.metadata.kovan]
row = 2
topic = "thermal-hydraulics"
fidelity = 0
maturity = 2

[[package.metadata.kovan.maturity_modules]]
module = "constants"
level = 3
why = "IAPWS-IF97 property code reviewed by the maintainer (maintainer, 2026-10-06)"

