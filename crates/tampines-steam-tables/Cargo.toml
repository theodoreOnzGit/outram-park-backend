[dependencies]
approx.workspace = true
# PETIR supplies the Chebyshev evaluation these backward correlations use.
# It is no_std with only `libm`, so it adds no std/BLAS/toolchain weight.
petir.workspace = true
ndarray.workspace = true
thiserror.workspace = true
uom.workspace = true
# The FvMesh, MeshError, 1-D mesher and tensor primitives of
# `openfoam_algorithms::openfoam_source` are re-exported from here (deduped
# 2026-10-03, GitHub #492; they were code-identical copies). Adds this one
# crate to the tree: its own deps (petir, thiserror, uom, ndarray) are already
# ours, and its rayon/wgpu are optional and off. Android- and wasm-clean.
outram-foam-basic-lib.workspace = true

[features]
# `long-tests` gates the individual tests that measure over 5 minutes, and is
# default-on, so a plain `cargo test` runs them. See the "Any test over 5
# minutes" HARD RULE in the workspace CLAUDE.md. Turn them off while
# iterating with `cargo quick-test -p tampines-steam-tables`.
default = ["long-tests"]
long-tests = []
# ~~platform-libm~~ REMOVED 2026-09-17 (bn:op-7kwt), together with the petir
# feature it passed through to. That hatch could not compile in ANY
# configuration, so the sanctioned invocation recorded here never ran as
# written; see `petir::mathf`'s module docs for the full record.
#
# Consequence: the pre-adoption Edwards-O'Brien golden reference under
# `verification_and_validation/edwards_blowdown_platform_libm_golden.md` can no
# longer be regenerated from this tree, and regenerating it needs a pre-no_std
# petir. It was already unregenerable in practice -- this makes that explicit
# instead of leaving a route that only appeared to exist.


# All dev-dependencies below are used ONLY by the FHR-simulator / Rankine-cycle
# examples (the library itself and its unit tests are TUAS-free and GUI-free).
# They are Android-hostile: the `egui`/`eframe` GUI stack pulls in `ring`,
# which needs an Android C toolchain (`cc-rs`). (`tuas_boussinesq_solver` no
# longer pulls system BLAS -- its `ndarray-linalg` dependency was removed in
# TUAS v0.1.2.) Gate the whole block off Android so
# `cargo check --target aarch64-linux-android --tests --examples` stays clean.
# The examples themselves carry `#![cfg(not(target_os = "android"))]` so they
# compile to nothing on Android.
# Also off wasm: this block is the egui/eframe GUI + TUAS example stack, and
# eframe pulls wgpu, whose HAL is not Sync on wasm. Dev-dependencies apply to
# TESTS as well as examples, so without this gate `cargo test --target
# wasm32-wasip1` fails to build even for a test that touches none of it — which
# is exactly what happened when tests/wasm_smoke.rs was first run. Note the
# --lib compile gate cannot catch this class: dev-deps are invisible to it.
[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dev-dependencies]
# resolves to the in-tree crate rather than crates.io
tuas_boussinesq_solver.workspace = true
teh-o-prke.workspace = true
chem-eng-real-time-process-control-simulator.workspace = true
egui.workspace = true
eframe.workspace = true
env_logger.workspace = true
local-ip-address.workspace = true
roots.workspace = true
egui_plot.workspace = true
egui_extras.workspace = true
serde.workspace = true
# PNG encoding for the `tampines-steam-tables-gui` example's raster export
# backend (GitHub issue #26). Already a root [workspace.dependencies] entry, so
# this adds no new third-party dependency to the workspace -- it only opts this
# crate's dev build in. The PDF and SVG backends need no crate at all: with
# every glyph reduced to a polyline by the example's own stroke font, a page is
# a plain path stream (see examples/tampines-steam-tables-gui/figure/pdf.rs).
image.workspace = true
# In-app export path picker (GitHub issue #26 file-browser export request).
# egui-file-dialog 0.13.0 is the only published version pinned to
# `egui ^0.34.0` / `eframe ^0.34.0`, matching this workspace's pinned 0.34.3
# exactly (0.14+ requires egui 0.35+, which this workspace does not carry).
# Pure egui/eframe, no GTK/native-dialog backend, so it stays Android-hostile
# only insofar as egui/eframe already are -- no new Android exposure.
egui-file-dialog.workspace = true




[[example]]
name = "fhr_sim_v1"
path = "examples/fhr_sim_v1/main.rs"

[[example]]
name = "depressurisation"
path = "examples/depressurisation/main.rs"

# fhr_sim_v2 moved to crates/tampines/examples/fhr_sim_v2/ (op-dt3.7) -- its
# Nordheim-Fuchs kinetics reconstruction lives there.

[[example]]
name = "rankine_cycle"
path = "examples/transient_rankine_cycle/main.rs"


# Interactive T-p / p-h / T-s / h-s steam-table plotter and figure generator
# (GitHub issue #26). `test = true` so `cargo test --example
# tampines-steam-tables-gui` runs its self-checks -- including the
# saturation-curve V&V gate against the published Wagner table, and the
# byte-reproducibility gates on the SVG, PDF and CSV exports.
[[example]]
name = "tampines-steam-tables-gui"
path = "examples/tampines-steam-tables-gui/main.rs"
test = true
