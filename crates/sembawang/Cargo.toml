[package]
name = "sembawang"
version = "0.0.1"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "SEMBAWANG — severe accident and source term, and orchestrator of the offsite chain (source term -> CHANGI dispersion and deposition). TRISO release implemented via boon-lay; accident progression not yet. No dose. Research, education and V&V only."
homepage.workspace = true
repository.workspace = true
categories.workspace = true
# `docs/` is repo-only (the rustdoc->markdown API mirror and any V&V
# write-ups). Excluded so it never ships to crates.io.
exclude = ["docs"]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: 0 lumped (no spatial
# discretisation), 1 one resolved dimension (system-code-like), 2 two
# (subchannel), 3 three (full CFD, diffusion), 4 brute force (Monte Carlo,
# first-principles data); a resolved non-spatial axis (nuclides, pointwise
# energy, time) counts as a dimension; [lo, hi] when the crate spans levels;
# absent for utilities and knowledge management. maturity:
# 0 concept, 1 AI draft, 2 AI V&V, 3 human reviewed, 4 human V&V (ready); the
# crate's LOWEST part, with higher-rated modules listed below it. backronym:
# the MRT-station backronym spelled out, as set in docs/ecosystem-naming.md
# (maintainer, 2026-09-21); shown on the code map (GitHub #815).
[package.metadata.kovan]
row = 3
topic = "risk"
fidelity = 0
maturity = 1
backronym = "Severe-accident Evolution and Melt Behaviour Analysis Workbench for Advanced Nuclear Geometries"

# Dependencies added 2026-09-21, when the crate stopped being a placeholder for
# its source-term half. The comment that stood here said adding one before
# there was anything to depend on would assert an undecided architecture --
# that reasoning held, and these three are added because there is now code
# that calls into them, not ahead of it.
[dependencies]
# The release physics. boon-lay's TRISO-ATOPS fork is the whole mechanistic
# layer; this crate orchestrates it and does not reimplement any of it.
boon-lay  = { workspace = true }
# The consumer. The dependency direction is sembawang -> changi and never the
# reverse: changi defines the source-term types its own driver consumes, which
# is what lets changi's end-to-end example run with this crate untouched.
changi    = { workspace = true }
# Dose (maintainer direction, 2026-09-30): the Gaussian plume and the dose
# pathways at the end of the offsite chain. buangkok depends on changi and
# petir only, so the edge sembawang -> buangkok introduces no cycle.
buangkok  = { workspace = true }
uom       = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Reads boon-lay's upstream code-to-code probes (tests/nuclide_names_code_to_code.rs).
serde_json = { workspace = true }
# Examples and tests ONLY. The published HTR-10 pebble and TRISO particle
# dimensions live in `tampines::pebble_bed` (IAEA-TECDOC-1382 part 2
# Table 4-17) and must not be copied into this crate, so the HTR-10 case reads
# them from there. Kept out of `[dependencies]` deliberately: the library takes
# geometry as an argument (`htr10::Htr10Geometry`), so a consumer of the
# library pays nothing for this. `tampines` already depends on `boon-lay`, so
# the edge sembawang -> tampines introduces no cycle.
tampines = { workspace = true }
