[package]
name = "outram-foam-turbulence-lib"
version = "0.1.2"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenFOAM turbulence models translated to Rust (RAS, LES, DES and everything in between) -- an independent OUTRAM PARK fork, not the official OpenFOAM software"
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# V&V raw data (verification_and_validation/*.csv) is dev-only, gitignored,
# and never shipped in the packaged crate. `docs/` (incl. the generated
# docs/api.md rustdoc mirror) isn't crate content either.
exclude = ["verification_and_validation/*.csv", "docs"]

# Where this crate sits in kovan's code map (GitHub #729, #733; maintainer
# decisions 2026-10-06). row: degree of integration, 0-1 utilities and
# standalone crates, 2 domain solvers, 3 coupled multiphysics, 4 integrated
# GUI apps. topic: the box it is drawn in. fidelity: its order in that box,
# 1 = highest fidelity (longest crunch time, fewest assumptions).
[package.metadata.kovan]
row = 2
topic = "thermal-hydraulics"
fidelity = 4

[dependencies]
thiserror.workspace = true
uom.workspace = true
ndarray.workspace = true
outram-foam-basic-lib.workspace = true

[dev-dependencies]
approx.workspace = true

[lib]
name = "outram_foam_turbulence_lib"
path = "src/lib.rs"
