[package]
name = "raffles"
version = "0.0.0"
edition.workspace = true
# GPL-3.0-only: upstream RAVEN is Apache-2.0, which is ONE-WAY compatible with
# GPLv3 (Apache -> GPLv3 is allowed; GPLv3 -> Apache is not). This crate is
# therefore GPL-3.0-only like the rest of the suite, and its code CANNOT flow
# back upstream to RAVEN. Full provenance, the verbatim upstream LICENSE.txt /
# NOTICE.txt, and the required Battelle Energy Alliance / Idaho National
# Laboratory attribution live in NOTICE, LICENSE-APACHE-RAVEN, NOTICE-RAVEN and
# upstream_source/README.md.
license.workspace = true
# CRATE OWNER: Adolphus Lye (colleague of the workspace maintainer), who chose
# the RAFFLES backronym. Direction, scope and priorities for this crate are
# theirs. `authors` is inherited from [workspace.package]; whether to add an
# explicit per-crate author entry is the maintainer's and owner's call, not an
# assistant's — see README.md and CLAUDE.md.
description = "RAFFLES — Risk Analysis Framework For Learning & Ensemble Simulation. Independent pure-Rust port of the uncertainty-quantification / risk-analysis core of RAVEN (Apache-2.0, Idaho National Laboratory): probability distributions, Monte Carlo / Latin-hypercube / grid samplers, Sobol and correlation sensitivity measures, surrogate models. Also Bayesian model updating (TMCMC / TEMCMC), statistical distances, Approximate Bayesian Computation, imprecise probability and message-passing graph networks. IMPLEMENTED IN PART, with no human V&V — treat every result as untrusted draft material. Not affiliated with the RAVEN project."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
categories.workspace = true
# The upstream reference clone is a repo-only provenance aid, never shipped in
# the packaged crate. upstream_source/README.md (the provenance record) is
# intentionally NOT excluded so it stays in the package, and neither are NOTICE,
# LICENSE-APACHE-RAVEN or NOTICE-RAVEN — Apache-2.0 section 4 requires the
# attribution to travel with every distribution.
exclude = ["docs", "upstream_source/raven"]

[dependencies]
# ANDROID / TERMUX: keep this list pure-Rust. NOTHING here may pull system
# BLAS/LAPACK, a C or Fortran toolchain, or windowing GUI — see the workspace
# CLAUDE.md "Android / Termux portability" rule. In particular `ndarray-linalg`
# is Android-hostile and must NOT be added unconditionally; if RAFFLES ever
# needs dense linear algebra (surrogate fitting, correlated multivariate
# sampling), reach first for the pure-Rust `faer` already in the root
# [workspace.dependencies], and only otherwise add a BLAS-backed crate behind a
# `[target.'cfg(not(target_os = "android"))'.dependencies]` table.
#
# Versions come from the root [workspace.dependencies] — never pin here.
thiserror.workspace = true
# RANDOM NUMBER GENERATOR (src/samplers.rs). RAFFLES does NOT ship its own
# generator: it reuses `outram_mc_libs::rng::lcg` — the OpenMC 64-bit LCG port,
# with the O(log n) `future_seed` jump-ahead that gives each sampled dimension a
# provably non-overlapping stream. That is OpenMC's reproducible-parallel-MC
# design, it is already tested, and duplicating a PRNG in one workspace is the
# thing to avoid. The workspace has no `rand` crate; whether to add one is the
# maintainer's call (docs/raven-port-scoping.md section 10, question 1).
#
# ANDROID: this dependency is Android-clean. outram-mc-libs target-gates its
# wgpu/GPU paths (and its `naga` dev-dependency) off Android with
# `[target.'cfg(not(target_os = "android"))'.dependencies]`, so
# `cargo check -p raffles --all-targets --target aarch64-linux-android` passes.
# RAFFLES follows the same gating convention if it ever needs something
# Android-hostile — see this crate's CLAUDE.md.
outram-mc-libs.workspace = true
# SURROGATE MODELS (src/surrogate.rs) — OPTIONAL, off by default. burn is this
# workspace's replacement for PyTorch (maintainer direction, 2026-09-16):
# upstream RAVEN's machine-learning surrogates are PyTorch-backed, so the port
# reaches for burn wherever PyTorch appears, as far as it will go. The cheaper
# surrogates (polynomial, Gaussian process) need nothing from it, so a plain
# `cargo build -p raffles` must not pay for it — turn it on with
# `--features burn`.
#
# It is declared `no_std` at the workspace root (`default-features = false`) and
# inherited that way here: burn runs on `core` + `alloc`, which is all a tensor
# library needs, and that keeps RAFFLES' Android/Termux and wasm builds clean —
# burn's `std` stack is where the dataset/network/train/sqlite machinery lives.
# `alloc` is implicit in that mode (burn declares `extern crate alloc` itself;
# there is no `alloc` feature to name), and a `std` binary links it happily.
#
# BACKEND: the `burn` feature adds `ndarray`, the one backend that is pure Rust
# and libm-backed — no system BLAS, no C/Fortran toolchain. GPU (`wgpu`,
# `vulkan`, `metal`, `webgpu`) is deliberately OUT OF SCOPE for this first pass;
# when it is wanted it goes behind its own feature under
# `cfg(not(target_os = "android"))`, per the workspace wgpu rule. Never swap the
# backend for `tch`, `candle`, `cuda`, `rocm` or a `blas-*` feature here.
#
# VERIFIED 2026-09-16 with burn 0.21.0, rustc 1.94.1, all clean (raffles' own
# only; the warnings shown come from outram-mc-libs/njoy and predate this):
#   cargo check -p raffles --lib         --features burn
#   cargo check -p raffles --all-targets --features burn --target aarch64-linux-android
#   cargo check -p raffles --lib         --features burn --target wasm32-unknown-unknown
# `cargo tree -e features` confirms burn resolves with only `ndarray`/
# `burn-ndarray` — no `std` — and that the `wgpu` in the tree comes from
# outram-mc-libs/njoy, not from burn.
burn = { workspace = true, optional = true }

[features]
default = ["long-tests"]
# Tests that take minutes rather than seconds. ON BY DEFAULT, per the
# workspace `long-tests` rule: a slow check that nobody runs is not a check.
# `cargo quick-test` turns it off for the edit-compile loop, and a skipped
# test still reports as `ignored` rather than vanishing.
#
# Presently one test: the graph-route ZBDD on `Aralia/das9601`, measured at
# 240 s on 2026-09-22. That cost is the absence of upstream's preprocessor --
# its module decomposition, not its order pruning, is what makes the same
# route fast there.
long-tests = []
# Neural-network surrogates and graph neural networks via burn (no_std + alloc,
# ndarray backend + autodiff). Consumed by `surrogate::neural`, `gnn::mpnn` and
# `gnn::training`; everything else in the crate builds without it, which is why
# it is off by default. `autodiff` is not optional here — training needs
# gradients, and a burn feature that could only do a forward pass would be a
# trap rather than a saving.
burn = ["dep:burn", "burn/ndarray", "burn/autodiff"]
